<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>透鏡光線圖模擬器 V15.4 - 成像性質教材標準版</title>

    <!-- KaTeX 0.16.9（公式排版） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- 共用資源（載入順序固定，不可 defer/async） -->
    <link rel="stylesheet" href="../../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../../assets/css/labgray.css">
    <script src="../../../assets/js/core.js"></script>
    <script src="../../../assets/js/i18n.js"></script>
    <script src="../../../assets/js/canvas2d.js"></script>

    <style>
        /* ── 頁面獨有 CSS ──
           畫布：真・貼邊無縫（book4 3D 風格）——填滿 #canvas-wrap、無外框。
           保留原頁 800×400 邏輯座標系（幾何常數以邏輯像素寫死），由
           PhysLab.c2d.setup({logical}) 做信箱貼邊等比縮放；灰底 #e2e6eb
           由 view.clear() 填滿，指標座標由 pointerPos(...,view) 回傳邏輯座標。 */
        #simCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        /* 滑桿列右側的數字輸入框（保留原頁可直接鍵入數值的功能） */
        .num-input {
            width: 56px; padding: 2px 4px;
            border: 1px solid var(--pl-border); border-radius: 4px;
            background: var(--pl-card); color: var(--pl-accent-deep);
            font-size: 0.78rem; font-weight: 700; text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .zoom-row { opacity: 0.75; }
        /* 讀數格配色 — 與畫布教學色一致（紫=像、藍=放大率、灰=物、橘=像高） */
        .rc-v  { background: #f5f3ff; border-color: #ddd6fe; color: #7c3aed; }
        .rc-m  { background: #eff6ff; border-color: #bfdbfe; color: #2563eb; }
        .rc-h  { background: #f8fafc; border-color: #e2e8f0; color: #334155; }
        .rc-hi { background: #fff7ed; border-color: #fed7aa; color: #ea580c; }
        /* 課堂解鎖推導面板（沿用原頁機制，改用 --pl-* token） */
        .math-panel {
            background: var(--pl-inset); border: 1px dashed var(--pl-border);
            border-radius: 8px; min-height: 72px; padding: 8px 10px;
            display: flex; align-items: center; justify-content: center;
            box-sizing: border-box; overflow: auto;
        }
        .math-panel .katex-display { margin: 2px 0 !important; }
        .math-content-layout { position: relative; width: 100%; }
        .math-lock-hint { font-family: sans-serif; font-size: 0.8rem; color: var(--pl-text-faint); margin-bottom: 4px; }
        .action-link-btn {
            background: var(--pl-blue); color: #fff; border: none; padding: 6px 12px;
            border-radius: 4px; font-size: 0.75rem; cursor: pointer; margin-top: 4px; font-weight: bold;
        }
        .action-link-btn:hover { background: #1d4ed8; }
        .inline-hide-btn {
            position: absolute; top: -6px; right: -2px; background: var(--pl-border);
            border: none; padding: 2px 6px; font-size: 0.65rem; border-radius: 3px;
            color: var(--pl-text-dim); cursor: pointer; z-index: 10;
        }
        .inline-hide-btn:hover { background: #cbd5e1; }
        /* 自訂光線動作按鈕（直排；綠=顯示折射、紅=危險操作，沿用原頁語意色） */
        #left-panel .action-btn { display: block; width: 100%; margin-bottom: 6px; }
        #left-panel .action-btn:last-child { margin-bottom: 0; }
        .btn-go     { background: #16a34a; color: #fff; border-color: #16a34a; }
        .btn-danger { background: #ef4444; color: #fff; border-color: #ef4444; }
    </style>
</head>
<body>

            </div>

    </div>

    <!-- ═══════════ 中央 2D 畫布 ═══════════ -->
    <div id="canvas-wrap">
        <canvas id="simCanvas"></canvas>
    </div>

    <!-- ═══════════ 右側資訊面板 ═══════════ -->

<!-- ═══════════ 頁面邏輯（光學計算與 canvas 繪圖逐字保留自原頁） ═══════════ -->
<script>
    const t = (k, p) => PhysLab.i18n.t(k, p);

    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const logicalWidth = 800, logicalHeight = 400;

    // 舞台貼邊：固定 800×400 邏輯座標 + 信箱等比縮放（幾何碼零改動），
    // 灰底 #e2e6eb 由 view.clear() 填滿，容器縮放時自動 onResize → update()。
    const view = PhysLab.c2d.setup(canvas, {
        logical: { w: logicalWidth, h: logicalHeight },
        bg: '#e2e6eb',
        onResize: update
    });

    // UI 元素
    const btnConvex = document.getElementById('btnConvex');
    const btnConcave = document.getElementById('btnConcave');

    const addCustomRayBtn = document.getElementById('addCustomRayBtn');
    const clearCustomRayBtn = document.getElementById('clearCustomRayBtn');
    const toggleCustomRefractedBtn = document.getElementById('toggleCustomRefractedBtn');

    const zoomSlider = document.getElementById('zoomSlider'), zoomNum = document.getElementById('zoomNum');
    const fSlider = document.getElementById('fSlider'), fNum = document.getElementById('fNum');
    const uSlider = document.getElementById('uSlider'), uNum = document.getElementById('uNum');
    const hSlider = document.getElementById('hSlider'), hNum = document.getElementById('hNum');

    const vDisplay = document.getElementById('vVal'), hiDisplay = document.getElementById('hiVal');
    const hoDisplay = document.getElementById('hoVal'), mDisplay = document.getElementById('mVal');
    const mathCalc = document.getElementById('mathCalc');

    // 核心運作狀態
    let isConvex = true;
    let showGrid = false;
    let showDistances = false;
    let showRay1 = true;
    let showRay2 = true;
    let showImg = true;
    let customRays = [];
    let showCustomRefracted = false;
    let isMathUnlocked = false;

    const centerX = logicalWidth / 2, centerY = logicalHeight / 2;

    // 監聽器：透鏡類型（dir-btn-group 雙按鈕，行為等同原頁單鍵切換）
    function setLensType(convex) {
        if (isConvex === convex) return;
        isConvex = convex;
        btnConvex.classList.toggle('active', convex);
        btnConcave.classList.toggle('active', !convex);
        showCustomRefracted = false; updateCustomRayUI(); update();
    }
    btnConvex.addEventListener('click', () => setLensType(true));
    btnConcave.addEventListener('click', () => setLensType(false));

    // 開關列切換（toggle-row → .toggle-track.on）
    function setupToggle(rowId, trackId, ticker) {
        document.getElementById(rowId).addEventListener('click', () => {
            const state = ticker();
            document.getElementById(trackId).classList.toggle('on', state);
            update();
        });
    }
    setupToggle('row-grid', 'opt-grid', () => showGrid = !showGrid);
    setupToggle('row-labels', 'opt-labels', () => showDistances = !showDistances);
    setupToggle('row-img', 'opt-img', () => showImg = !showImg);
    setupToggle('row-ray1', 'opt-ray1', () => showRay1 = !showRay1);
    setupToggle('row-ray2', 'opt-ray2', () => showRay2 = !showRay2);

    addCustomRayBtn.addEventListener('click', () => {
        const newOffset = -20 + ((customRays.length * 15) % 40);
        customRays.push({ startRatio: 1.0, lensYOffset: newOffset });
        showCustomRefracted = false; updateCustomRayUI(); update();
    });

    clearCustomRayBtn.addEventListener('click', () => {
        customRays = []; showCustomRefracted = false; updateCustomRayUI(); update();
    });

    toggleCustomRefractedBtn.addEventListener('click', () => {
        showCustomRefracted = !showCustomRefracted;
        updateCustomRayUI();
        update();
    });

    // 依狀態同步自訂光線按鈕的可見性、文字與語意色（語言切換時亦重呼）
    function updateCustomRayUI() {
        const hasRays = customRays.length > 0;
        clearCustomRayBtn.style.display = hasRays ? 'block' : 'none';
        toggleCustomRefractedBtn.style.display = hasRays ? 'block' : 'none';
        toggleCustomRefractedBtn.textContent = showCustomRefracted ? t('btn.hideRefracted') : t('btn.showRefracted');
        toggleCustomRefractedBtn.classList.toggle('btn-danger', showCustomRefracted);
        toggleCustomRefractedBtn.classList.toggle('btn-go', !showCustomRefracted);
    }

    function syncInputs(slider, numBox, resetRay = true) {
        slider.addEventListener('input', () => { numBox.value = slider.value; if(resetRay) {showCustomRefracted=false; updateCustomRayUI();} update(); });
        numBox.addEventListener('input', () => { slider.value = numBox.value; if(resetRay) {showCustomRefracted=false; updateCustomRayUI();} update(); });
    }
    syncInputs(fSlider, fNum); syncInputs(uSlider, uNum); syncInputs(hSlider, hNum);
    syncInputs(zoomSlider, zoomNum, false);

    // 繪圖工具
    function drawDimension(startX, endX, y, label, color) {
        const x1 = Math.min(startX, endX), x2 = Math.max(startX, endX);
        ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 1.2;
        ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();

        ctx.beginPath(); ctx.fillStyle = color;
        ctx.moveTo(x1, y); ctx.lineTo(x1 + 6, y - 3); ctx.lineTo(x1 + 6, y + 3); ctx.fill();
        ctx.moveTo(x2, y); ctx.lineTo(x2 - 6, y - 3); ctx.lineTo(x2 - 6, y + 3); ctx.fill();

        ctx.font = 'italic bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const textWidth = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.fillRect((x1+x2)/2 - textWidth/2 - 4, y - 10, textWidth + 8, 20);
        ctx.fillStyle = color; ctx.fillText(label, (x1 + x2) / 2, y);

        ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 0.8; ctx.setLineDash([3, 3]);
        ctx.moveTo(x1, centerY); ctx.lineTo(x1, y); ctx.moveTo(x2, centerY); ctx.lineTo(x2, y);
        ctx.stroke(); ctx.setLineDash([]);
    }

    function drawRay(x1, y1, x2, y2, color, isVirtual = false, drawArrowHead = true) {
        ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 1.5;
        ctx.setLineDash(isVirtual ? [4, 4] : []);
        ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);

        if (drawArrowHead && !isVirtual) {
            let dx = x2 - x1, dy = y2 - y1;
            let p = [-dx, dx, -dy, dy], q = [x1, logicalWidth - x1, y1, logicalHeight - y1];
            let t0 = 0, t1 = 1, isVisible = true;
            for(let i = 0; i < 4; i++) {
                if(p[i] === 0) { if(q[i] < 0) { isVisible = false; break; } }
                else {
                    let t = q[i] / p[i];
                    if(p[i] < 0) { if(t > t1) { isVisible = false; break; } if(t > t0) t0 = t; }
                    else { if(t < t0) { isVisible = false; break; } if(t < t1) t1 = t; }
                }
            }
            if (isVisible && (t1 - t0) * Math.hypot(dx, dy) > 15) {
                const tMid = t0 + (t1 - t0) * 0.55;
                const midX = x1 + dx * tMid, midY = y1 + dy * tMid;
                const angle = Math.atan2(dy, dx);
                ctx.beginPath(); ctx.fillStyle = color;
                ctx.moveTo(midX, midY);
                ctx.lineTo(midX - 8 * Math.cos(angle - Math.PI / 6), midY - 8 * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(midX - 8 * Math.cos(angle + Math.PI / 6), midY - 8 * Math.sin(angle + Math.PI / 6));
                ctx.fill();
            }
        }
    }

    function drawObjectArrow(x, y, heightVal, color, isVirtual = false) {
        ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.setLineDash(isVirtual ? [4, 4] : []);
        ctx.moveTo(x, centerY);
        const endY = heightVal > 0 ? y + 8 : y - 8;
        ctx.lineTo(x, endY); ctx.stroke();

        ctx.beginPath(); ctx.fillStyle = color;
        if (heightVal > 0) { ctx.moveTo(x, y); ctx.lineTo(x - 5, y + 10); ctx.lineTo(x + 5, y + 10); }
        else { ctx.moveTo(x, y); ctx.lineTo(x - 5, y - 10); ctx.lineTo(x + 5, y - 10); }
        ctx.fill(); ctx.setLineDash([]); ctx.lineCap = 'butt';
    }

    function drawLensSymbol(isConvex) {
        const top = 40, bottom = logicalHeight - 40;
        ctx.beginPath(); ctx.strokeStyle = '#475569'; ctx.lineWidth = 3;
        ctx.moveTo(centerX, top); ctx.lineTo(centerX, bottom); ctx.stroke();
        ctx.beginPath(); ctx.fillStyle = '#475569';
        if (isConvex) {
            ctx.moveTo(centerX, top - 10); ctx.lineTo(centerX - 5, top + 6); ctx.lineTo(centerX + 5, top + 6); ctx.fill();
            ctx.moveTo(centerX, bottom + 10); ctx.lineTo(centerX - 5, bottom - 6); ctx.lineTo(centerX + 5, bottom - 6); ctx.fill();
        } else {
            ctx.moveTo(centerX, top + 10); ctx.lineTo(centerX - 5, top - 6); ctx.lineTo(centerX + 5, top - 6); ctx.fill();
            ctx.moveTo(centerX, bottom - 10); ctx.lineTo(centerX - 5, bottom + 6); ctx.lineTo(centerX + 5, bottom + 6); ctx.fill();
        }
    }

    // 核心解鎖控制系統
    function renderMath(f_mag, u, v, isConvex) {
        if (!isMathUnlocked) {
            mathCalc.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%;">
                    <span class="math-lock-hint">${t('math.locked')}</span>
                    <button type="button" class="action-link-btn" onclick="isMathUnlocked=true; update();">${t('math.unlock')}</button>
                </div>`;
            return;
        }

        let f_val = isConvex ? f_mag : -f_mag;
        let v_pos = Math.abs(v);
        let M = v_pos / u;
        let isParallel = isConvex && Math.abs(u - f_mag) < 0.1;

        mathCalc.innerHTML = "";

        const wrapper = document.createElement('div');
        wrapper.className = "math-content-layout";
        wrapper.style.width = "100%";

        const hideBtn = document.createElement('button');
        hideBtn.className = "inline-hide-btn";
        hideBtn.textContent = t('math.hide');
        hideBtn.onclick = () => { isMathUnlocked = false; update(); };
        wrapper.appendChild(hideBtn);

        const formulaArea = document.createElement('div');
        formulaArea.style.width = "100%";
        formulaArea.style.textAlign = "center";
        wrapper.appendChild(formulaArea);
        mathCalc.appendChild(wrapper);

        const texParams = {
            uVal: u.toFixed(0), fVal: f_val,
            vRes: v.toFixed(1), vAbs: v_pos.toFixed(1), mRes: M.toFixed(2)
        };
        const tex = isParallel ? t('math.texParallel', texParams) : t('math.texMain', texParams);

        function showHtmlFallback(target) {
            const makeFrac = (num, den) => `<div style="display: inline-block; text-align: center; vertical-align: middle; margin: 0 3px;"><div style="border-bottom: 1px solid #475569; padding: 0 3px; line-height: 1.1;">${num}</div><div style="line-height: 1.1;">${den}</div></div>`;
            if (isParallel) {
                target.innerHTML = `<div style="font-size:0.75rem; text-align:left; padding-left:10px; color:#334155; line-height:1.4;">
                    <b>${t('math.lensLabel')}</b>${makeFrac(1, 'u')} + ${makeFrac(1, 'v')} = ${makeFrac(1, 'f')} &rArr; ${makeFrac(1, u.toFixed(0))} + ${makeFrac(1, 'v')} = ${makeFrac(1, f_val)} &rArr; v = &infty;<br>
                    <b>${t('math.magLabel')}</b>M = ${makeFrac('v', 'u')} = &infty;
                </div>`;
            } else {
                target.innerHTML = `<div style="font-size:0.75rem; text-align:left; padding-left:10px; color:#334155; line-height:1.4;">
                    <b>${t('math.lensLabel')}</b>${makeFrac(1, 'u')} + ${makeFrac(1, 'v')} = ${makeFrac(1, 'f')} &rArr; ${makeFrac(1, u.toFixed(0))} + ${makeFrac(1, 'v')} = ${makeFrac(1, f_val)} &rArr; v = <b>${v.toFixed(1)}</b><br>
                    <b>${t('math.magLabel')}</b>M = ${makeFrac('v', 'u')} = ${makeFrac(v_pos.toFixed(1), u.toFixed(0))} = <b>${M.toFixed(2)}</b>
                </div>`;
            }
        }

        if (typeof katex !== 'undefined') {
            try {
                katex.render(tex, formulaArea, { throwOnError: false, displayMode: true });
            } catch(e) {
                showHtmlFallback(formulaArea);
            }
        } else {
            showHtmlFallback(formulaArea);
        }
    }

    // 主更新迴圈
    function update() {
        const f_mag = parseFloat(fSlider.value);
        const u = parseFloat(uSlider.value);
        const h_o = parseFloat(hSlider.value);
        const scale = parseFloat(zoomSlider.value);

        const f_calc = isConvex ? f_mag : -f_mag;
        let v = (f_calc * u) / (u - f_calc);
        let h_i = - (v / u) * h_o;

        const isParallel = isConvex && Math.abs(u - f_mag) < 0.1;
        const isVirtual = v < 0;

        view.clear();

        if (showGrid) {
            const major = 50 * scale, minor = 10 * scale;
            ctx.lineWidth = 0.5;
            if (minor >= 4) {
                ctx.strokeStyle = '#f1f5f9';
                for (let x = centerX % minor; x <= logicalWidth; x += minor) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, logicalHeight); ctx.stroke(); }
                for (let y = centerY % minor; y <= logicalHeight; y += minor) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(logicalWidth, y); ctx.stroke(); }
            }
            ctx.strokeStyle = '#cbd5e1';
            for (let x = centerX; x <= logicalWidth; x += major) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, logicalHeight); ctx.stroke(); }
            for (let x = centerX; x >= 0; x -= major) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, logicalHeight); ctx.stroke(); }
            for (let y = centerY; y <= logicalHeight; y += major) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(logicalWidth, y); ctx.stroke(); }
            for (let y = centerY; y >= 0; y -= major) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(logicalWidth, y); ctx.stroke(); }
        }

        drawRay(0, centerY, logicalWidth, centerY, '#0f172a', false, false);
        drawLensSymbol(isConvex);

        const f_px = f_mag * scale;
        ctx.fillStyle = '#ef4444';
        [{x: centerX - f_px, label: 'F'}, {x: centerX + f_px, label: 'F'},
         {x: centerX - 2*f_px, label: '2F'}, {x: centerX + 2*f_px, label: '2F'}].forEach(p => {
            if (p.x > 0 && p.x < logicalWidth) {
                ctx.beginPath(); arc(p.x, centerY, 3.5, 0, Math.PI * 2); ctx.fill();
                ctx.font = "bold 12px sans-serif"; ctx.fillText(p.label, p.x - 4, centerY + 18);
            }
        });

        function arc(x, y, r, s, e) { ctx.arc(x, y, r, s, e); } // 簡化語法內部工具

        const objX = centerX - u * scale, objY = centerY - h_o * scale;
        const imgX = centerX + v * scale, imgY = centerY - h_i * scale;

        if (showRay1) {
            drawRay(objX, objY, centerX, objY, '#ef4444');
            if (isParallel) {
                drawRay(centerX, objY, logicalWidth, objY + (logicalWidth - centerX) * (centerY - objY) / f_px, '#ef4444');
                if (showImg) drawRay(imgX, imgY, centerX, objY, '#ef4444', true, false);
            } else if (isConvex) {
                if (isVirtual) {
                    drawRay(centerX, objY, logicalWidth, objY + (logicalWidth - centerX) * (centerY - objY) / f_px, '#ef4444');
                    if (showImg) drawRay(imgX, imgY, centerX, objY, '#ef4444', true, false);
                } else {
                    drawRay(centerX, objY, imgX, imgY, '#ef4444');
                    drawRay(imgX, imgY, logicalWidth, imgY + (imgY - objY)/(imgX - centerX) * (logicalWidth - imgX), '#ef4444', false, false);
                }
            } else {
                let slope = (objY - centerY) / f_px;
                drawRay(centerX, objY, logicalWidth, objY + slope * (logicalWidth - centerX), '#ef4444');
                if (showImg) drawRay(centerX - f_px, centerY, centerX, objY, '#ef4444', true, false);
            }
        }

        if (showRay2) {
            drawRay(objX, objY, centerX, centerY, '#16a34a');
            let slope = (centerY - objY) / (centerX - objX);
            if (isParallel || isVirtual) {
                drawRay(centerX, centerY, logicalWidth, centerY + slope * (logicalWidth - centerX), '#16a34a');
                if (showImg && isVirtual && imgX < objX) drawRay(imgX, imgY, objX, objY, '#16a34a', true, false);
            } else {
                drawRay(centerX, centerY, imgX, imgY, '#16a34a');
                drawRay(imgX, imgY, logicalWidth, imgY + slope * (logicalWidth - imgX), '#16a34a', false, false);
            }
        }

        customRays.forEach(ray => {
            const cStartY = centerY - (h_o * ray.startRatio) * scale;
            const cLensY = centerY + ray.lensYOffset * scale;
            const cImgY = centerY - (- (v / u) * (h_o * ray.startRatio)) * scale;
            drawRay(objX, cStartY, centerX, cLensY, '#ea580c', false, true);
            if (showCustomRefracted) {
                let slope = isParallel ? (centerY - cStartY) / (centerX - objX) : (cLensY - cImgY) / (centerX - imgX);
                drawRay(centerX, cLensY, logicalWidth, cLensY + slope * (logicalWidth - centerX), '#ea580c', false, true);
                if (showImg && isVirtual) drawRay(imgX, cImgY, centerX, cLensY, '#ea580c', true, false);
            }
            ctx.beginPath(); ctx.fillStyle = '#ea580c'; arc(objX, cStartY, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); arc(centerX, cLensY, 4, 0, Math.PI*2); ctx.fill();
        });

        drawObjectArrow(objX, objY, h_o * scale, '#334155');
        ctx.fillStyle = "#334155"; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'left';
        ctx.fillText(t('canvas.object'), objX - 12, h_o > 0 ? objY - 12 : objY + 22);

        if (showImg && !isParallel) {
            drawObjectArrow(imgX, imgY, h_i * scale, isVirtual ? '#7c3aed' : '#ea580c', isVirtual);
            ctx.fillStyle = isVirtual ? '#7c3aed' : '#ea580c';
            ctx.fillText(t('canvas.image'), imgX - 12, h_i > 0 ? imgY - 12 : imgY + 22);
        }

        if (showDistances) {
            drawDimension(centerX - f_px, centerX, logicalHeight - 75, `f = ${f_mag.toFixed(0)}`, '#ef4444');
            drawDimension(objX, centerX, logicalHeight - 48, `u = ${u.toFixed(0)}`, '#334155');
            let hoText = `h = ${h_o.toFixed(0)}`;
            let hoMidY = (centerY + objY) / 2;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)'; ctx.fillRect(objX - 55, hoMidY - 9, 50, 18);
            ctx.fillStyle = '#334155'; ctx.fillText(hoText, objX - 50, hoMidY + 2);

            if (showImg && !isParallel) {
                drawDimension(centerX, imgX, logicalHeight - 22, `v = ${Math.abs(v).toFixed(0)}`, '#7c3aed');
                let hiText = `h' = ${Math.abs(h_i).toFixed(0)}`;
                let hiMidY = (centerY + imgY) / 2;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)'; ctx.fillRect(imgX + 8, hiMidY - 9, 50, 18);
                ctx.fillStyle = isVirtual ? '#7c3aed' : '#ea580c'; ctx.fillText(hiText, imgX + 12, hiMidY + 2);
            }
        }

        hoDisplay.textContent = h_o.toFixed(0);
        let natureStr = "";
        if (!showImg) {
            vDisplay.textContent = "❓"; hiDisplay.textContent = "❓"; mDisplay.textContent = "❓";
            natureStr = t('nature.hidden');
        } else {
            if (isParallel) {
                vDisplay.textContent = "∞"; hiDisplay.textContent = "∞"; mDisplay.textContent = "∞";
                natureStr = t('nature.parallel');
            } else {
                vDisplay.textContent = Math.abs(v).toFixed(1);
                hiDisplay.textContent = Math.abs(h_i).toFixed(1);

                let mRatio = Math.abs(v / u);
                mDisplay.textContent = mRatio.toFixed(2);

                // ⚙️ 核心邏輯：輸出學理標準的三大成像性質
                let orientation = (h_i > 0) ? t('nature.upright') : t('nature.inverted');

                let sizeStr = t('nature.magnified');
                if (Math.abs(mRatio - 1.0) < 0.01) {
                    sizeStr = t('nature.same');
                } else if (mRatio < 1.0) {
                    sizeStr = t('nature.diminished');
                }

                let realVirtual = isVirtual ? t('nature.virtual') : t('nature.real');

                // 格式：[正立/倒置] [放大/縮小/大小不變] [實像/虛像]
                natureStr = `${orientation}、${sizeStr}、${realVirtual}`;
            }
        }

        ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#1e293b'; ctx.textAlign = 'right';
        ctx.fillText(t('canvas.nature', { v: natureStr }), logicalWidth - 15, 22);
        renderMath(f_mag, u, v, isConvex);
    }

    // 滑鼠物理拖曳
    let dragTarget = null;
    canvas.addEventListener('mousedown', (e) => {
        const p = PhysLab.c2d.pointerPos(canvas, e, view);
        const mouseX = p.x, mouseY = p.y;
        const scale = parseFloat(zoomSlider.value);
        const u = parseFloat(uSlider.value), f = parseFloat(fSlider.value), h_o = parseFloat(hSlider.value);
        const objX = centerX - u * scale, objY = centerY - h_o * scale;

        for (let i = customRays.length - 1; i >= 0; i--) {
            const ray = customRays[i];
            if (Math.hypot(mouseX - objX, mouseY - (centerY - (h_o * ray.startRatio) * scale)) < 12) { dragTarget = { type: 'customStart', index: i }; return; }
            if (Math.hypot(mouseX - centerX, mouseY - (centerY + ray.lensYOffset * scale)) < 12) { dragTarget = { type: 'customLens', index: i }; return; }
        }
        if (Math.abs(mouseX - objX) < 12) {
            if (Math.abs(mouseY - objY) < 12) dragTarget = { type: 'object_height' };
            else if (mouseY > objY && mouseY <= centerY + 15) dragTarget = { type: 'object_distance' };
        } else if (Math.abs(mouseX - (centerX - f * scale)) < 12 && Math.abs(mouseY - centerY) < 12) dragTarget = { type: 'focus' };
    });

    canvas.addEventListener('mousemove', (e) => {
        const p = PhysLab.c2d.pointerPos(canvas, e, view);
        const mouseX = p.x, mouseY = p.y;
        const scale = parseFloat(zoomSlider.value);
        const h_o = parseFloat(hSlider.value), u = parseFloat(uSlider.value), f = parseFloat(fSlider.value);
        const objX = centerX - u * scale, objY = centerY - h_o * scale;

        if (dragTarget) {
            if (dragTarget.type === 'customStart') {
                customRays[dragTarget.index].startRatio = Math.max(0, Math.min((centerY - mouseY) / scale / h_o, 1));
            } else if (dragTarget.type === 'customLens') {
                customRays[dragTarget.index].lensYOffset = (mouseY - centerY) / scale;
            } else if (dragTarget.type === 'object_height') {
                hSlider.value = hNum.value = Math.max(5, Math.min(100, (centerY - mouseY) / scale)).toFixed(0);
            } else if (dragTarget.type === 'object_distance') {
                uSlider.value = uNum.value = Math.max(5, Math.min(100, (centerX - mouseX) / scale)).toFixed(0);
            } else if (dragTarget.type === 'focus') {
                fSlider.value = fNum.value = Math.max(5, Math.min(100, (centerX - mouseX) / scale)).toFixed(0);
            }
            showCustomRefracted = false; updateCustomRayUI(); update();
        } else {
            let cursor = 'default';
            for (let i = customRays.length - 1; i >= 0; i--) {
                const ray = customRays[i];
                if (Math.hypot(mouseX - objX, mouseY - (centerY - (h_o * ray.startRatio) * scale)) < 12 ||
                    Math.hypot(mouseX - centerX, mouseY - (centerY + ray.lensYOffset * scale)) < 12) { cursor = 'pointer'; break; }
            }
            if (cursor === 'default') {
                if (Math.abs(mouseX - objX) < 12) {
                    cursor = Math.abs(mouseY - objY) < 12 ? 'ns-resize' : 'ew-resize';
                } else if (Math.abs(mouseX - (centerX - f * scale)) < 12 && Math.abs(mouseY - centerY) < 12) cursor = 'pointer';
            }
            canvas.style.cursor = cursor;
        }
    });

    canvas.addEventListener('mouseup', () => dragTarget = null);
    canvas.addEventListener('mouseleave', () => dragTarget = null);

    // 面板開關（切換後重繪畫布）
    PhysLab.ui.bindPanelToggle('btn-toggle-left', 'left-panel', update);
    PhysLab.ui.bindPanelToggle('btn-toggle-right', 'right-panel', update);

    // 語言切換後：同步 JS 生成文字的按鈕 + 重繪畫布（fillText 中文標籤與推導面板）
    PhysLab.i18n.onChange(() => { updateCustomRayUI(); update(); });

    // 初始化（容器縮放由 c2d.setup 的 onResize → update() 處理）
    update();
</script>
</body>
</html>
