<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 凸透鏡成像模擬實驗室</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- 共用資源（載入順序固定，不可 defer/async）：core → i18n → sim3d -->
    <link rel="stylesheet" href="../../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../../assets/css/labgray.css">
    <script src="../../../assets/js/core.js"></script>
    <script src="../../../assets/js/i18n.js"></script>
    <script src="../../../assets/js/sim3d.js"></script>

    <style>
        /* ── 頁面獨有樣式（共用 chrome 見 assets/css/labgray.css）── */

        /* 固定視角版式：全螢幕高度＋面板卡片不被 flexbox 壓縮（成對鐵律） */
        body { height: 100vh; overflow: hidden; }
        #left-panel > *, #right-panel > * { flex-shrink: 0; }

        /* 沿用原版按鈕語意色（紫＝無限遠模式切換、藍＝重設視角） */
        #infinity-toggle-btn { background: #8e44ad; color: #fff; }
        #infinity-toggle-btn:hover { background: #7d3c98; }
        #reset-cam-btn { background: #3498db; color: #fff; }
        #reset-cam-btn:hover { background: #2e86c1; }

        /* 下拉選單（labgray 未收錄 select） */
        select {
            width: 100%; padding: 7px 8px; margin-top: 8px;
            border: 1px solid var(--pl-border); border-radius: 6px;
            background: var(--pl-card); color: var(--pl-text-strong);
            font-size: 0.78rem; font-weight: 600; cursor: pointer;
        }
        select:hover { border-color: var(--pl-blue); }
        select:disabled { opacity: 0.45; cursor: not-allowed; }

        /* 滑桿兩側 ◀▶ 步進鈕（行為由 PhysLab.ui.bindSteppers 接管） */
        .slider-with-btns { display: flex; align-items: center; gap: 5px; }
        .slider-with-btns input[type="range"] { flex: 1; min-width: 0; }
        .step-btn {
            background: var(--pl-inset); border: 1px solid var(--pl-border); border-radius: 5px;
            color: var(--pl-text-dim); font-size: 0.68rem; font-weight: 700;
            padding: 2px 7px; cursor: pointer; user-select: none;
        }
        .step-btn:hover { background: var(--pl-card-head); }
        .step-btn:active { background: var(--pl-border); }

        /* 單頁動作鈕：無限遠光源啟用態沿用原版橘色語意 */
        .action-btn { width: 100%; }
        .action-btn.active { background: #f39c12; border-color: #e67e22; color: #fff; }

        /* 光學數據盒：保留原版動態左框線（JS 依成像狀態改色） */
        #info-panel { border-left: 5px solid #f39c12; transition: border-color 0.2s; }
        #status-text { line-height: 1.6; }

        /* 清晰成像徽章（原版 popIn 動畫） */
        .focus-badge {
            display: none; background: #2ecc71; color: #fff; text-align: center;
            padding: 4px 8px; border-radius: 6px; font-weight: 700; font-size: 0.78rem;
            margin-bottom: 8px; animation: popIn 0.3s ease-out;
        }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* 操作指南列表 */
        .guide-list { margin: 0; padding-left: 16px; line-height: 1.8; }
    </style>
</head>
<body>

<div id="topbar">
    <div style="display: flex; align-items: center; gap: 16px;">
        <button type="button" class="panel-toggle-btn" id="btn-toggle-left">
            <span>☰</span> <span data-i18n="topbar.controls">控制</span>
        </button>
        <div class="title-block">
            <h1 data-i18n="topbar.title">🔍 3D 凸透鏡成像模擬實驗室</h1>
            <p data-i18n="topbar.subtitle">HKDSE Physics · Book 3 · Chapter 3 · 透鏡</p>
        </div>
    </div>
    <div class="tb-actions">
        <button type="button" class="panel-toggle-btn" id="btn-toggle-right">
            <span>📖</span> <span data-i18n="topbar.info">資訊</span>
        </button>
    </div>
</div>

<div id="main">
    <div id="left-panel">
        <div class="card">
            <div class="card-header">💡 <span data-i18n="panel.source.header">光源與光線</span><span class="chevron">▾</span></div>
            <div class="card-body">
                <button type="button" class="action-btn" id="infinity-toggle-btn">🌌 切換無限遠光源</button>
                <select id="shape-select">
                    <option value="F" data-i18n="panel.source.shapeF">發光 F 字</option>
                    <option value="arrow" data-i18n="panel.source.shapeArrow">發光箭頭</option>
                </select>
                <select id="ray-mode-select">
                    <option value="7" data-i18n="panel.source.ray7">顯示多束光線 (7條)</option>
                    <option value="2" data-i18n="panel.source.ray2">主要作圖光線 (2條)</option>
                    <option value="0" data-i18n="panel.source.ray0">隱藏光線</option>
                </select>
            </div>
        </div>

        <div class="card">
            <div class="card-header">📍 <span data-i18n="panel.pos.header">位置與尺寸</span><span class="chevron">▾</span></div>
            <div class="card-body">
                <div class="slider-row">
                    <div class="slider-head"><label data-i18n="panel.pos.lens">🔎 透鏡座標 (長按)</label><span class="val" id="lens-val">0.0 cm</span></div>
                    <div class="dir-btn-group">
                        <button type="button" class="dir-btn" id="lens-left-btn">◀</button>
                        <button type="button" class="dir-btn" id="lens-right-btn">▶</button>
                    </div>
                </div>

                <div class="slider-row" id="obj-group">
                    <div class="slider-head"><label data-i18n="panel.pos.obj">🍎 物距 (u)</label><span class="val" id="obj-val">40.0 cm</span></div>
                    <div class="slider-with-btns">
                        <button type="button" class="step-btn" data-target="obj-slider" data-dir="-1">◀</button>
                        <input type="range" id="obj-slider" min="5" max="300" value="40" step="0.1">
                        <button type="button" class="step-btn" data-target="obj-slider" data-dir="1">▶</button>
                    </div>
                </div>

                <div class="slider-row" id="angle-group" style="display:none;">
                    <div class="slider-head"><label data-i18n="panel.pos.angle">📐 無限遠入射角</label><span class="val" id="angle-val">0°</span></div>
                    <div class="slider-with-btns">
                        <button type="button" class="step-btn" data-target="angle-slider" data-dir="-1">◀</button>
                        <input type="range" id="angle-slider" min="-15" max="15" value="0" step="1">
                        <button type="button" class="step-btn" data-target="angle-slider" data-dir="1">▶</button>
                    </div>
                </div>

                <div class="slider-row">
                    <div class="slider-head"><label data-i18n="panel.pos.screen">📄 屏幕距離</label><span class="val" id="screen-val">50.0 cm</span></div>
                    <div class="slider-with-btns">
                        <button type="button" class="step-btn" data-target="screen-slider" data-dir="-1">◀</button>
                        <input type="range" id="screen-slider" min="5" max="300" value="50" step="0.1">
                        <button type="button" class="step-btn" data-target="screen-slider" data-dir="1">▶</button>
                    </div>
                </div>

                <div class="slider-row">
                    <div class="slider-head"><label data-i18n="panel.pos.focal">🔍 透鏡焦距 (f)</label><span class="val" id="focal-val">20.0 cm</span></div>
                    <div class="slider-with-btns">
                        <button type="button" class="step-btn" data-target="focal-slider" data-dir="-1">◀</button>
                        <input type="range" id="focal-slider" min="10" max="40" value="20" step="0.1">
                        <button type="button" class="step-btn" data-target="focal-slider" data-dir="1">▶</button>
                    </div>
                </div>

                <div class="slider-row">
                    <div class="slider-head"><label data-i18n="panel.pos.cover">⬛ 遮蓋透鏡</label><span class="val" id="cover-val">0%</span></div>
                    <input type="range" id="cover-slider" min="0" max="100" value="0" step="1">
                </div>

                <div class="slider-row">
                    <div class="slider-head"><label data-i18n="panel.pos.screenSize">📏 屏幕大小</label><span class="val" id="screen-size-val">1.0x</span></div>
                    <input type="range" id="screen-size-slider" min="0.5" max="2.5" value="1.0" step="0.1">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">👁 <span data-i18n="panel.display.header">顯示選項</span><span class="chevron">▾</span></div>
            <div class="card-body">
                <div class="toggle-row" id="row-hide-screen">
                    <div class="toggle-track" id="trk-hide-screen"><div class="toggle-thumb"></div></div>
                    <span data-i18n="panel.display.hideScreen">隱藏屏幕</span>
                    <input type="checkbox" id="hide-screen-toggle" hidden>
                </div>
                <div class="toggle-row" id="row-show-image">
                    <div class="toggle-track" id="trk-show-image"><div class="toggle-thumb"></div></div>
                    <span data-i18n="panel.display.floatImage">顯示浮空像</span>
                    <input type="checkbox" id="show-image-toggle" hidden>
                </div>
                <div class="toggle-row" id="row-marker">
                    <div class="toggle-track on" id="trk-marker"><div class="toggle-thumb"></div></div>
                    <span data-i18n="panel.display.marker">F/2F 標記</span>
                    <input type="checkbox" id="marker-toggle" checked hidden>
                </div>
                <div class="toggle-row" id="row-dist">
                    <div class="toggle-track on" id="trk-dist"><div class="toggle-thumb"></div></div>
                    <span data-i18n="panel.display.dist">顯示距離標示器</span>
                    <input type="checkbox" id="dist-toggle" checked hidden>
                </div>
            </div>
        </div>
    </div>

    <div id="canvas-wrap">
        <div id="view3d"></div>
    </div>

    <div id="right-panel">
        <div class="formula-box">
            <h4><span data-i18n="info.header">實驗室光學軌道數據</span></h4>
            <div id="focus-badge" class="focus-badge" data-i18n="info.focusBadge">✨ 找到清晰成像 ✨</div>
            <div class="info-box" id="info-panel">
                <div id="status-text" data-i18n="status.loading">載入中...</div>
            </div>
        </div>

        <div class="guide-box">
            <h4><span data-i18n="guide.header">操作指南</span></h4>
            <div class="info-box">
                <ul class="guide-list">
                    <li data-i18n="guide.rotate">左鍵：旋轉視角</li>
                    <li data-i18n="guide.pan">右鍵：平移</li>
                    <li data-i18n="guide.zoom">滾輪：縮放</li>
                    <li data-i18n-html="guide.longPress"><strong style="color:#e74c3c;">長按 ◀/▶</strong>：動態加速</li>
                    <li data-i18n="guide.floatTip">隱藏屏幕 + 顯示浮空像（預設關閉，可手動開啟）</li>
                </ul>
            </div>
            <button type="button" class="action-btn" id="reset-cam-btn" data-i18n="guide.resetCam" style="margin-top:10px;">🔄 重設視角</button>
        </div>
    </div>
</div>

<script>
PhysLab.sim3d.ready(function () {
    var t = PhysLab.i18n.t;

    /* ============================================================
       場景底座（原版精確值：背景 0x1a252f、fov 45、far 3000、
       相機 (90,40,120) → (0,5,10)、damping 0.05、無網格；
       原版燈光為 Ambient+Hemisphere 組合 → lights:false 保留頁面燈光碼；
       原版未呼叫 setPixelRatio（three 預設 1）→ pixelRatio:1）
       ============================================================ */
    var sim = PhysLab.sim3d.create(document.getElementById('view3d'), {
        background: 0x1a252f,
        fov: 45, near: 0.1, far: 3000,
        views: { default: { pos: [90, 40, 120], tgt: [0, 5, 10] } },
        controls: { damping: 0.05 },
        lights: false,
        grid: false,
        pixelRatio: 1
    });
    const scene = sim.scene, camera = sim.camera, renderer = sim.renderer, controls = sim.controls;
    scene.fog = new THREE.FogExp2(0x1a252f, 0.001);

    document.getElementById('reset-cam-btn').addEventListener('click', function () { sim.setView('default'); });

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.5);
    hemiLight.position.set(0, 200, 0); scene.add(hemiLight);
    const ledMat = new THREE.MeshStandardMaterial({ color: 0xff3300, emissive: 0xff2200, emissiveIntensity: 1.0 });
    const fGroup = new THREE.Group();
    const vBar = new THREE.Mesh(new THREE.BoxGeometry(1.5, 10, 1.5), ledMat); vBar.position.set(-2, 0, 0);
    const hBar1 = new THREE.Mesh(new THREE.BoxGeometry(6, 1.5, 1.5), ledMat); hBar1.position.set(1.5, 4.25, 0);
    const hBar2 = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 1.5), ledMat); hBar2.position.set(0.5, 0, 0);
    fGroup.add(vBar, hBar1, hBar2);
    const arrowGroup = new THREE.Group();
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 7), ledMat); shaft.position.y = -1.5;
    const head = new THREE.Mesh(new THREE.ConeGeometry(2.5, 3), ledMat); head.position.y = 3.5;
    arrowGroup.add(shaft, head);
    const mainObjectGroup = new THREE.Group();
    mainObjectGroup.add(fGroup);
    scene.add(mainObjectGroup);

    // === 浮空像視覺化群組 (實像倒立 / 虛像正立) ===
    const imageVizGroup = new THREE.Group();
    scene.add(imageVizGroup);

    // 使用青色發光材質區分「像」與實物
    const imageLedMat = new THREE.MeshStandardMaterial({
        color: 0x00ffff,
        emissive: 0x00cccc,
        emissiveIntensity: 0.9,
        transparent: true,
        opacity: 0.78,
        depthWrite: false
    });

    const imageFGroup = new THREE.Group();
    const imgVBar = new THREE.Mesh(new THREE.BoxGeometry(1.5, 10, 1.5), imageLedMat); imgVBar.position.set(-2, 0, 0);
    const imgHBar1 = new THREE.Mesh(new THREE.BoxGeometry(6, 1.5, 1.5), imageLedMat); imgHBar1.position.set(1.5, 4.25, 0);
    const imgHBar2 = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 1.5), imageLedMat); imgHBar2.position.set(0.5, 0, 0);
    imageFGroup.add(imgVBar, imgHBar1, imgHBar2);

    const imageArrowGroup = new THREE.Group();
    const imgShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 7), imageLedMat); imgShaft.position.y = -1.5;
    const imgHead = new THREE.Mesh(new THREE.ConeGeometry(2.5, 3), imageLedMat); imgHead.position.y = 3.5;
    imageArrowGroup.add(imgShaft, imgHead);

    imageVizGroup.add(imageFGroup, imageArrowGroup);
    // 預設隱藏，交由 updateSimulation 控制
    imageVizGroup.visible = false;

    const lensRadius = 18;
    const pts = [];
    for (let i = 0; i <= 20; i++) pts.push(new THREE.Vector2(lensRadius * (i / 20), 2.5 * (1 - Math.pow(i / 20, 2))));
    for (let i = 1; i <= 20; i++) pts.push(new THREE.Vector2(lensRadius * (1 - i / 20), -2.5 * (1 - Math.pow(1 - i / 20, 2))));
    const lensGeo = new THREE.LatheGeometry(pts, 64); lensGeo.rotateX(Math.PI / 2);
    const lensMesh = new THREE.Mesh(lensGeo, new THREE.MeshPhysicalMaterial({ color: 0xcfeaf3, transmission: 0.9, opacity: 1, roughness: 0.05, ior: 1.5, thickness: 2.0 }));
    scene.add(lensMesh);
    const coverMesh = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.DoubleSide }));
    scene.add(coverMesh);
    const screenGroup = new THREE.Group();
    const projCanvas = document.createElement('canvas');
    projCanvas.width = 1024; projCanvas.height = 1024;
    const ctx = projCanvas.getContext('2d');
    const projTexture = new THREE.CanvasTexture(projCanvas);

    const screenGeo = new THREE.PlaneGeometry(60, 60);
    const screenMesh = new THREE.Mesh(screenGeo, new THREE.MeshStandardMaterial({ map: projTexture, transparent: true, opacity: 0.9, side: THREE.DoubleSide, color: 0xffffff }));
    screenGroup.add(screenMesh, new THREE.LineSegments(new THREE.EdgesGeometry(screenGeo), new THREE.LineBasicMaterial({ color: 0x333333, linewidth: 3 })));
    scene.add(screenGroup);
    const opticalAxis = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 5, -1000), new THREE.Vector3(0, 5, 1000)]),
        new THREE.LineDashedMaterial({ color: 0xaaaaaa, dashSize: 2, gapSize: 2 })
    );
    opticalAxis.computeLineDistances(); scene.add(opticalAxis);
    const numRays = 7;
    const solidRays = [], dashedRays = [];
    for(let i=0; i<numRays; i++){
        const solid = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xf1c40f, linewidth: 2, transparent: true, opacity: 0.8 }));
        const dashed = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineDashedMaterial({ color: 0xf1c40f, dashSize: 1.5, gapSize: 1.5, transparent: true, opacity: 0.6 }));
        solidRays.push(solid); dashedRays.push(dashed);
        scene.add(solid, dashed);
    }
    const distIndicatorGroup = new THREE.Group(); scene.add(distIndicatorGroup);
    function createAxisMarker(text, colorStr) {
        const group = new THREE.Group();
        group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 3.5, 0), new THREE.Vector3(0, 6.5, 0)]), new THREE.LineBasicMaterial({ color: colorStr, linewidth: 3 })));
        const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 64;
        const context = canvas.getContext('2d'); context.fillStyle = colorStr; context.font = 'bold 36px Arial'; context.textAlign = 'center'; context.fillText(text, 32, 48);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false }));
        sprite.scale.set(6, 6, 1); sprite.position.set(0, 1.5, 0); group.add(sprite);
        scene.add(group); return group;
    }
    const markerF1 = createAxisMarker('F', '#e74c3c'), markerF2 = createAxisMarker('F', '#e74c3c');
    const marker2F1 = createAxisMarker('2F', '#3498db'), marker2F2 = createAxisMarker('2F', '#3498db');

    // ◀▶ 長按步進（.step-btn[data-target][data-dir]）→ 共用 bindSteppers
    PhysLab.ui.bindSteppers();

    let lensWorldZ = 0, lensMoveInterval = null, lensTimeout = null, lensSpeed = 1;
    const uiObj = document.getElementById('obj-slider'), uiScreen = document.getElementById('screen-slider');
    function checkLimitsAndMove(dir) {
        let currentU = parseFloat(uiObj.value), currentScreenD = parseFloat(uiScreen.value);
        let objWorldZ = isInfinityMode ? -2000 : (lensWorldZ - currentU);
        let screenWorldZ = lensWorldZ + currentScreenD;
        let nextZ = lensWorldZ + dir * 0.1 * Math.floor(lensSpeed);

        if (isInfinityMode) { lensWorldZ = Math.min(nextZ, screenWorldZ - 5); }
        else { lensWorldZ = Math.max(objWorldZ + 5, Math.min(nextZ, screenWorldZ - 5)); }
        if (!isInfinityMode) uiObj.value = (lensWorldZ - objWorldZ).toFixed(1);
        uiScreen.value = (screenWorldZ - lensWorldZ).toFixed(1);
        updateSimulation(); if(lensSpeed < 15) lensSpeed += 0.5;
    }
    function startMovingLens(dir) {
        lensSpeed = 1; checkLimitsAndMove(dir);
        lensTimeout = setTimeout(() => { lensMoveInterval = setInterval(() => checkLimitsAndMove(dir), 40); }, 300);
    }
    function stopMovingLens() { clearTimeout(lensTimeout); clearInterval(lensMoveInterval); }
    document.getElementById('lens-left-btn').addEventListener('mousedown', () => startMovingLens(-1));
    document.getElementById('lens-right-btn').addEventListener('mousedown', () => startMovingLens(1));
    document.getElementById('lens-left-btn').addEventListener('touchstart', (e) => { e.preventDefault(); startMovingLens(-1); });
    document.getElementById('lens-right-btn').addEventListener('touchstart', (e) => { e.preventDefault(); startMovingLens(1); });
    window.addEventListener('mouseup', stopMovingLens); window.addEventListener('touchend', stopMovingLens);
    let isInfinityMode = false;
    function updateInfinityBtn() {
        document.getElementById('infinity-toggle-btn').innerText = t(isInfinityMode ? 'panel.source.back' : 'panel.source.infinity');
    }
    document.getElementById('infinity-toggle-btn').addEventListener('click', function() {
        isInfinityMode = !isInfinityMode; this.classList.toggle('active');
        updateInfinityBtn();
        document.getElementById('shape-select').disabled = isInfinityMode;
        document.getElementById('angle-group').style.display = isInfinityMode ? '' : 'none';
        document.getElementById('obj-group').style.display = isInfinityMode ? 'none' : '';
        if(!isInfinityMode) document.getElementById('angle-slider').value = 0;
        updateSimulation();
    });
    function drawShape(ctx, size, shape) {
        if (isInfinityMode) {
            ctx.fillStyle = '#2ecc71'; ctx.beginPath(); ctx.moveTo(0, -size); ctx.lineTo(-size*0.5, -size*0.2); ctx.lineTo(size*0.5, -size*0.2); ctx.fill();
            ctx.fillStyle = '#8e44ad'; ctx.beginPath(); ctx.moveTo(-size*0.8, -size*0.2); ctx.lineTo(-size*1.5, size*0.5); ctx.lineTo(-size*0.1, size*0.5); ctx.fill();
            ctx.fillStyle = '#8b4513'; ctx.fillRect(-size*0.1, -size*0.2, size*0.2, size*0.7);
        } else if (shape === 'F') {
            ctx.fillStyle = '#ff3300'; const barT = size * 0.2;
            ctx.fillRect(-size/2, -size, barT, size * 2); ctx.fillRect(-size/2, -size, size * 1.2, barT); ctx.fillRect(-size/2, -size * 0.1, size * 0.8, barT);
        } else {
            ctx.fillStyle = '#ff3300'; const shaftW = size * 0.2, shaftH = size * 1.4;
            ctx.fillRect(-shaftW/2, -size*0.8, shaftW, shaftH);
            ctx.beginPath(); ctx.moveTo(0, -size); ctx.lineTo(-size*0.4, -size*0.3); ctx.lineTo(size*0.4, -size*0.3); ctx.fill();
        }
    }
    function createDimensionLine(text, color, zStart, zEnd, yLevel) {
        const group = new THREE.Group(); const mat = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
        group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, yLevel, zStart), new THREE.Vector3(0, yLevel, zEnd)]), mat));
        group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, yLevel-0.8, zStart), new THREE.Vector3(0, yLevel+0.8, zStart)]), mat));
        group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, yLevel-0.8, zEnd), new THREE.Vector3(0, yLevel+0.8, zEnd)]), mat));
        const canvas = document.createElement('canvas'); canvas.width = 160; canvas.height = 64;
        const context = canvas.getContext('2d'); context.fillStyle = color; context.font = 'bold 28px Arial'; context.textAlign = 'center'; context.fillText(text, 80, 45);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false }));
        sprite.scale.set(12, 4.8, 1); sprite.position.set(0, yLevel + 2, (zStart + zEnd) / 2); group.add(sprite); return group;
    }
    const uiFocal = document.getElementById('focal-slider'), uiCover = document.getElementById('cover-slider'), uiScreenSize = document.getElementById('screen-size-slider');
    const uiAngle = document.getElementById('angle-slider'), uiShape = document.getElementById('shape-select'), uiRayMode = document.getElementById('ray-mode-select');
    const uiMarker = document.getElementById('marker-toggle'), uiDistToggle = document.getElementById('dist-toggle');

    const uiHideScreen = document.getElementById('hide-screen-toggle');
    const uiShowImage = document.getElementById('show-image-toggle');

    const statusText = document.getElementById('status-text'), focusBadge = document.getElementById('focus-badge');

    // === 物理一致的尺寸常數 ===
    const OBJECT_HEIGHT_WORLD = 10;
    const SCREEN_WORLD_HEIGHT = 60;
    const CANVAS_RESOLUTION = 1024;
    const BASE_DRAW_SIZE = (OBJECT_HEIGHT_WORLD / 2) * (CANVAS_RESOLUTION / SCREEN_WORLD_HEIGHT);

    function updateSimulation() {
        const u = isInfinityMode ? Infinity : parseFloat(uiObj.value);
        const screenD = parseFloat(uiScreen.value), objWorldZ = isInfinityMode ? -2000 : (lensWorldZ - u), screenWorldZ = lensWorldZ + screenD;
        const f = parseFloat(uiFocal.value), coverPercent = parseFloat(uiCover.value), screenScale = parseFloat(uiScreenSize.value);
        const rayMode = parseInt(uiRayMode.value), infinityAngle = parseFloat(uiAngle.value) * Math.PI / 180;
        document.getElementById('lens-val').innerText = `${lensWorldZ.toFixed(1)} cm`;
        document.getElementById('obj-val').innerText = isInfinityMode ? '∞' : `${u.toFixed(1)} cm`;
        document.getElementById('focal-val').innerText = `${f.toFixed(1)} cm`;
        document.getElementById('cover-val').innerText = `${coverPercent}%`;
        document.getElementById('screen-val').innerText = `${screenD.toFixed(1)} cm`;
        document.getElementById('screen-size-val').innerText = `${screenScale.toFixed(1)}x`;
        document.getElementById('angle-val').innerText = `${uiAngle.value}°`;
        uiShape.style.display = isInfinityMode ? 'none' : 'block';
        lensMesh.position.set(0, 5, lensWorldZ); mainObjectGroup.position.set(0, 5, objWorldZ); mainObjectGroup.visible = !isInfinityMode;
        screenGroup.position.set(0, 5, screenWorldZ); screenGroup.scale.set(screenScale, screenScale, 1);
        if(uiShape.value === 'F') { fGroup.visible = true; arrowGroup.visible = false; } else { fGroup.visible = false; arrowGroup.visible = true; }
        markerF1.position.set(0, 5, lensWorldZ - f); marker2F1.position.set(0, 5, lensWorldZ - 2*f);
        markerF2.position.set(0, 5, lensWorldZ + f); marker2F2.position.set(0, 5, lensWorldZ + 2*f);
        markerF1.visible = marker2F1.visible = markerF2.visible = marker2F2.visible = uiMarker.checked;
        const lensTopY = 5 + lensRadius, coverHeight = (lensRadius * 2) * (coverPercent / 100);
        if (coverPercent > 0) { coverMesh.visible = true; coverMesh.scale.set(1, coverHeight / 40, 1); coverMesh.position.set(0, lensTopY - coverHeight / 2, lensWorldZ - 3.5); }
        else coverMesh.visible = false;
        const coverEdgeY = lensTopY - coverHeight;
        let v = (u === f) ? Infinity : (u * f) / (u - f), M = (u === f) ? 0 : (isInfinityMode ? 0 : -v / u);
        let isRealImage = (v > 0 && v !== Infinity), imageWorldZ = lensWorldZ + v;
        while(distIndicatorGroup.children.length > 0) distIndicatorGroup.remove(distIndicatorGroup.children[0]);
        if (uiDistToggle.checked) {
            if (!isInfinityMode) distIndicatorGroup.add(createDimensionLine(`u = ${u.toFixed(1)}`, '#c0392b', objWorldZ, lensWorldZ, -3));
            distIndicatorGroup.add(createDimensionLine(`f = ${f.toFixed(1)}`, '#f39c12', lensWorldZ, lensWorldZ + f, -8));
            if (isRealImage || u < f) { distIndicatorGroup.add(createDimensionLine(`v = ${Math.abs(v).toFixed(1)}`, isRealImage ? '#2ecc71' : '#8e44ad', lensWorldZ, imageWorldZ, -13)); }
        }
        solidRays.forEach(l => l.visible = false); dashedRays.forEach(l => l.visible = false);
        ctx.fillStyle = '#f0f0f0'; ctx.fillRect(0, 0, 1024, 1024);
        const topY = isInfinityMode ? 15 : 10, startPt = new THREE.Vector3(0, topY, objWorldZ);
        const imgTipY = isInfinityMode ? (5 - f * Math.tan(infinityAngle)) : (5 + (topY - 5) * M), imgTipPt = new THREE.Vector3(0, imgTipY, imageWorldZ);
        if (rayMode !== 0) {
            solidRays.forEach((line, index) => {
                let hitY;
                if (rayMode === 7) hitY = 5 + 12 * (1 - 2 * (index / (numRays - 1))); else if (rayMode === 2) { if (index > 1) return; hitY = (index === 0) ? topY : 5; }
                line.visible = true; const hitPt = new THREE.Vector3(0, hitY, lensWorldZ);

                if (hitY > coverEdgeY) {
                    line.geometry.setFromPoints([isInfinityMode ? new THREE.Vector3(0, hitY + 100*Math.tan(infinityAngle), lensWorldZ - 100) : startPt, hitPt]);
                    line.material.color.setHex(0xe74c3c); line.material.opacity = 0.3;
                } else {
                    line.material.color.setHex(0xf1c40f); line.material.opacity = 0.8;
                    let endPt;
                    if (isInfinityMode) {
                        const infStart = new THREE.Vector3(0, hitY + 100 * Math.tan(infinityAngle), lensWorldZ - 100);
                        const focusPt = new THREE.Vector3(0, 5 - f * Math.tan(infinityAngle), lensWorldZ + f);
                        endPt = new THREE.Vector3().copy(hitPt).add(new THREE.Vector3().subVectors(focusPt, hitPt).normalize().multiplyScalar(200));
                        line.geometry.setFromPoints([infStart, hitPt, endPt]);
                    } else if (u === f) {
                        endPt = new THREE.Vector3().copy(hitPt).add(new THREE.Vector3(0, 5 - topY, u).normalize().multiplyScalar(200));
                        line.geometry.setFromPoints([startPt, hitPt, endPt]);
                    } else {
                        endPt = new THREE.Vector3().copy(hitPt).add(new THREE.Vector3().subVectors(imgTipPt, hitPt).multiplyScalar(Math.sign(v)).normalize().multiplyScalar(200));
                        line.geometry.setFromPoints([startPt, hitPt, endPt]);
                        if (!isRealImage) { dashedRays[index].geometry.setFromPoints([imgTipPt, hitPt]); dashedRays[index].computeLineDistances(); dashedRays[index].visible = true; }
                    }
                }
            });
        }

        // === 隱藏/顯示半透明屏幕 ===
        screenGroup.visible = !uiHideScreen.checked;

        // === 浮空像直接觀察 (實像倒立、虛像正立) ===
        const showFloatingImage = uiShowImage && uiShowImage.checked;
        const shouldShowImage = showFloatingImage && (isRealImage || (u < f && !isInfinityMode));

        if (shouldShowImage) {
            const absM = Math.abs(M) || 0.001; // 避免 M=0 時縮放為 0
            const useFShape = uiShape.value === 'F';

            imageFGroup.visible = useFShape;
            imageArrowGroup.visible = !useFShape;

            // 放置位置（實像在透鏡另一側，虛像在物體同一側）
            imageVizGroup.position.set(0, 5, imageWorldZ);

            // 凸透鏡實像具有「倒立 + 左右反轉」特性（相當於 180° 旋轉）
            // 使用 x 和 y 同時負縮放實現完整反轉
            if (isRealImage) {
                imageVizGroup.scale.set(-absM, -absM, absM);
            } else {
                imageVizGroup.scale.set(absM, absM, absM);
            }
            imageVizGroup.rotation.set(0, 0, 0); // 清除多餘旋轉

            imageVizGroup.visible = true;
        } else {
            imageVizGroup.visible = false;
        }

        if (isRealImage) {
            const distanceError = Math.abs(screenD - v), blurAmount = (distanceError * 4.0) / screenScale;
            const drawSize = isInfinityMode ? 200 / screenScale : BASE_DRAW_SIZE * Math.abs(M) * (screenD / v) / screenScale;
            const physicalYOffset = isInfinityMode ? (screenD * Math.tan(infinityAngle)) : 0;
            ctx.save(); ctx.translate(512, 512 + (physicalYOffset * (1024 / 60) / screenScale));
            if (!isInfinityMode) ctx.scale(-1, -1);
            ctx.globalAlpha = Math.max(0, 1.0 - (coverPercent / 100));
            if (ctx.globalAlpha > 0) { ctx.filter = `blur(${blurAmount}px)`; drawShape(ctx, drawSize, uiShape.value); }
            ctx.restore();
            if (distanceError < 1.5) {
                if(isInfinityMode) {
                    statusText.innerHTML = t('status.focalPlane', { v: v.toFixed(1) });
                } else {
                    let text = t('status.sharpImage', { u: u.toFixed(1), v: v.toFixed(1), m: Math.abs(M).toFixed(2) });
                    if (showFloatingImage) text += t('status.floatingReal');
                    text += coverPercent === 100 ? t('status.coveredFull') : (coverPercent > 0 ? t('status.coveredPart') : "");
                    statusText.innerHTML = text;
                }
                document.getElementById('info-panel').style.borderLeftColor = coverPercent === 100 ? '#e74c3c' : '#2ecc71';
                focusBadge.style.display = coverPercent === 100 ? 'none' : 'block';
            } else {
                statusText.innerHTML = t('status.blurry', { d: distanceError.toFixed(1) });
                document.getElementById('info-panel').style.borderLeftColor = '#f39c12'; focusBadge.style.display = 'none';
            }
        } else if (u < f) {
            const distanceToScreen = screenD + Math.abs(v);
            ctx.save(); ctx.translate(512, 512); ctx.globalAlpha = 0.1 * Math.max(0, 1.0 - (coverPercent/100));
            if (ctx.globalAlpha > 0) { ctx.filter = `blur(${(40 + distanceToScreen * 0.8) / screenScale}px)`; drawShape(ctx, BASE_DRAW_SIZE * Math.abs(M) * (distanceToScreen / Math.abs(v) / screenScale), uiShape.value); }
            ctx.restore();

            let text = t('status.virtual', { u: u.toFixed(1), f: f.toFixed(1), m: Math.abs(M).toFixed(2) });
            if (showFloatingImage) text += t('status.floatingVirtual');
            statusText.innerHTML = text;
            document.getElementById('info-panel').style.borderLeftColor = '#e74c3c'; focusBadge.style.display = 'none';
        } else {
            statusText.innerHTML = t('status.atFocus');
            document.getElementById('info-panel').style.borderLeftColor = '#e74c3c'; focusBadge.style.display = 'none';
        }
        projTexture.needsUpdate = true;
    }

    // 綁定滑桿與選單事件（開關列改由下方 bindToggle 處理）
    [uiObj, uiScreen, uiFocal, uiCover, uiScreenSize, uiAngle, uiRayMode, uiShape].forEach(el => {
        if (el) el.addEventListener(el.tagName === 'INPUT' && el.type === 'range' ? 'input' : 'change', updateSimulation);
    });

    // 開關列：點擊切換隱藏 checkbox（物理碼照舊讀 .checked）並同步軌道樣式
    function bindToggle(rowId, trackId, boxId) {
        var row = document.getElementById(rowId), track = document.getElementById(trackId), box = document.getElementById(boxId);
        track.classList.toggle('on', box.checked);
        row.addEventListener('click', function () {
            box.checked = !box.checked;
            track.classList.toggle('on', box.checked);
            updateSimulation();
        });
    }
    bindToggle('row-hide-screen', 'trk-hide-screen', 'hide-screen-toggle');
    bindToggle('row-show-image', 'trk-show-image', 'show-image-toggle');
    bindToggle('row-marker', 'trk-marker', 'marker-toggle');
    bindToggle('row-dist', 'trk-dist', 'dist-toggle');

    // 面板開關（切換後重算畫布尺寸）
    PhysLab.ui.bindPanelToggle('btn-toggle-left', 'left-panel', sim.resize);
    PhysLab.ui.bindPanelToggle('btn-toggle-right', 'right-panel', sim.resize);

    // 語言切換：刷新 JS 管理字串（狀態文字、無限遠模式按鈕）；
    // 靜態 data-i18n 由 i18n.applyTo 自動處理；3D 尺寸線/F/2F 標記為拉丁字不需翻譯
    PhysLab.i18n.onChange(function () {
        updateInfinityBtn();
        updateSimulation();
    });

    updateInfinityBtn();   // 初始文字須經 t()（?lang= 非 zh 時首屏才正確）
    updateSimulation();
    // 主迴圈：controls.update 與 renderer.render 由 sim.start 處理（本頁無逐幀物理）
    sim.start(function () {});
});
</script>
</body>
</html>
