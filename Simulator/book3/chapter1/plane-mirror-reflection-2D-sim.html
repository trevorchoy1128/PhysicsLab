<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSE 物理 - 平面鏡光學模擬器</title>

    <!-- 共用資源（載入順序固定，不可 defer/async） -->
    <link rel="stylesheet" href="../../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../../assets/css/labgray.css">
    <script src="../../../assets/js/core.js"></script>
    <script src="../../../assets/js/i18n.js"></script>

    <style>
        /* ── 頁面獨有 CSS ──
           畫布：保留原頁 800×600 邏輯座標系（幾何常數以邏輯像素寫死），
           CSS 尺寸在 #canvas-wrap 內自適應，滑鼠座標換算沿用原頁
           (CSS_WIDTH / rect.width) 比例式，兩者相容。 */
        #simCanvas {
            width: min(100% - 28px, 800px);
            aspect-ratio: 800 / 600;
            margin: auto;
            background: #fff;
            border: 1.5px solid var(--pl-border);
            border-radius: 12px;
            display: block;
            cursor: grab;
        }
        #simCanvas:active { cursor: grabbing; }
        /* 物體形狀下拉選單（labgray 無 select 規則） */
        .shape-select {
            width: 100%; padding: 8px 10px; border-radius: 8px;
            border: 1px solid var(--pl-border); background: var(--pl-inset);
            color: var(--pl-text-dim); font-size: 0.78rem; font-weight: 600;
            cursor: pointer;
        }
        /* 顯示設定卡內的虛線分隔（原頁 hr 樣式） */
        .row-divider { border: 0; border-top: 1px dashed var(--pl-border); margin: 8px 0; }
        /* 殘影開關列 — 沿用原頁橘色強調 */
        .ghost-row span { color: #e67e22; font-weight: 700; }
        /* 清除殘影 — 沿用原頁紅色危險鈕配色與停用態 */
        .btn-danger { background: #e74c3c; border-color: #e74c3c; color: #fff; }
        .btn-danger:hover:not(:disabled) { background: #c0392b; }
        .action-btn:disabled {
            background: var(--pl-inset); color: var(--pl-text-faint);
            border-color: var(--pl-border); cursor: not-allowed; opacity: 0.6;
        }
        .action-row + .action-row { margin-top: 6px; }
    </style>
</head>
<body>

<!-- ═══════════ 頂欄 ═══════════ -->
<div id="topbar">
    <div style="display:flex;align-items:center;gap:16px;">
        <button type="button" class="panel-toggle-btn" id="btn-toggle-left">
            <span>☰</span> <span data-i18n="topbar.controls">控制</span>
        </button>
        <div class="title-block">
            <h1 data-i18n="topbar.title">平面鏡光學模擬器</h1>
            <p data-i18n="topbar.subtitle">HKDSE Physics · Book 3 · Chapter 1 · 光的反射</p>
        </div>
    </div>
    <div class="tb-actions">
        <!-- 語言切換 #lang-btn（i18n.js）與 🏠 主頁 #home-btn（core.js）自動注入 -->
    </div>
</div>

<div id="main">

    <!-- ═══════════ 左側控制面板 ═══════════ -->
    <div id="left-panel">
        <div class="card">
            <div class="card-header">🧩 <span data-i18n="panel.shape.header">物體形狀 (Object)</span><span class="chevron">▾</span></div>
            <div class="card-body">
                <select id="shapeSelect" class="shape-select">
                    <option value="arrow" data-i18n="panel.shape.arrow">🎯 經典箭頭 (Arrow)</option>
                    <option value="triangle" data-i18n="panel.shape.triangle">🔺 三角形 (Triangle)</option>
                    <option value="rectangle" data-i18n="panel.shape.rectangle">🟩 長方形 (Rectangle)</option>
                    <option value="letterP" data-i18n="panel.shape.letterP">🔤 字母 P (Letter P)</option>
                    <option value="letterH" data-i18n="panel.shape.letterH">🔤 字母 H (Letter H)</option>
                    <option value="letterY" data-i18n="panel.shape.letterY">🔤 字母 Y (Letter Y)</option>
                </select>
            </div>
        </div>

        <div class="card">
            <div class="card-header">👁️ <span data-i18n="panel.display.header">顯示設定</span><span class="chevron">▾</span></div>
            <div class="card-body">
                <div class="toggle-row" id="row-observer">
                    <div class="toggle-track on" id="opt-observer"><div class="toggle-thumb"></div></div>
                    <span data-i18n="panel.display.eye">顯示眼睛 (Eye)</span>
                </div>
                <div class="toggle-row" id="row-image">
                    <div class="toggle-track on" id="opt-image"><div class="toggle-thumb"></div></div>
                    <span data-i18n="panel.display.image">顯示虛像 (Image)</span>
                </div>
                <div class="toggle-row" id="row-labels">
                    <div class="toggle-track on" id="opt-labels"><div class="toggle-thumb"></div></div>
                    <span data-i18n="panel.display.dots">顯示頂點圓點 (Dots)</span>
                </div>
                <div class="toggle-row" id="row-normal">
                    <div class="toggle-track on" id="opt-normal"><div class="toggle-thumb"></div></div>
                    <span data-i18n="panel.display.normal">顯示法線 (Normal)</span>
                </div>
                <div class="toggle-row" id="row-minmirror">
                    <div class="toggle-track" id="opt-minmirror"><div class="toggle-thumb"></div></div>
                    <span data-i18n="panel.display.minMirror">高亮最少鏡長 (Min)</span>
                </div>
                <div class="toggle-row" id="row-distance">
                    <div class="toggle-track" id="opt-distance"><div class="toggle-thumb"></div></div>
                    <span data-i18n="panel.display.distance">顯示物距與像距 (u / v)</span>
                </div>
                <hr class="row-divider">
                <div class="toggle-row ghost-row" id="row-ghost">
                    <div class="toggle-track" id="opt-ghost"><div class="toggle-thumb"></div></div>
                    <span data-i18n="panel.display.ghost">🎬 啟用殘影 (Ghost)</span>
                </div>
                <div class="action-row">
                    <button type="button" class="action-btn btn-danger" id="btnClearGhost" disabled data-i18n="panel.display.clearGhost">🗑️ 清除殘影</button>
                </div>
            </div>
        </div>

        <div class="card" id="rayControlGroup">
            <div class="card-header">✏️ <span data-i18n="panel.rays.header">作圖光線控制 (Rays)</span><span class="chevron">▾</span></div>
            <div class="card-body">
                <div class="dir-btn-group" style="margin-bottom:8px;">
                    <button type="button" class="dir-btn" id="btnAllRaysOn" data-i18n="panel.rays.allOn">🔓 全開</button>
                    <button type="button" class="dir-btn" id="btnAllRaysOff" data-i18n="panel.rays.allOff">🔒 全關</button>
                </div>
                <div id="rayControlsContainer"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">🪞 <span data-i18n="panel.mirror.header">鏡子設定</span><span class="chevron">▾</span></div>
            <div class="card-body">
                <div class="action-row">
                    <button type="button" class="action-btn btn-reset" id="btnAngle" data-i18n="panel.mirror.angleBtn">切換鏡面傾斜 (垂直/45°)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══════════ 中央 2D 畫布 ═══════════ -->
    <div id="canvas-wrap">
        <canvas id="simCanvas"></canvas>
    </div>
</div>

<!-- ═══════════ 頁面字典（zh 必填；en 缺字自動回退 zh） ═══════════ -->
<script>
PhysLab.i18n.register({
    zh: {
        'topbar.title': '平面鏡光學模擬器',
        'topbar.subtitle': 'HKDSE Physics · Book 3 · Chapter 1 · 光的反射',
        'topbar.controls': '控制',
        'panel.shape.header': '物體形狀 (Object)',
        'panel.shape.arrow': '🎯 經典箭頭 (Arrow)',
        'panel.shape.triangle': '🔺 三角形 (Triangle)',
        'panel.shape.rectangle': '🟩 長方形 (Rectangle)',
        'panel.shape.letterP': '🔤 字母 P (Letter P)',
        'panel.shape.letterH': '🔤 字母 H (Letter H)',
        'panel.shape.letterY': '🔤 字母 Y (Letter Y)',
        'panel.display.header': '顯示設定',
        'panel.display.eye': '顯示眼睛 (Eye)',
        'panel.display.image': '顯示虛像 (Image)',
        'panel.display.dots': '顯示頂點圓點 (Dots)',
        'panel.display.normal': '顯示法線 (Normal)',
        'panel.display.minMirror': '高亮最少鏡長 (Min)',
        'panel.display.distance': '顯示物距與像距 (u / v)',
        'panel.display.ghost': '🎬 啟用殘影 (Ghost)',
        'panel.display.clearGhost': '🗑️ 清除殘影',
        'panel.rays.header': '作圖光線控制 (Rays)',
        'panel.rays.allOn': '🔓 全開',
        'panel.rays.allOff': '🔒 全關',
        'panel.rays.toggle': '顯示 {label} 點光線',
        'panel.mirror.header': '鏡子設定',
        'panel.mirror.angleBtn': '切換鏡面傾斜 (垂直/45°)',
        'canvas.hint': '⚡ 拖動鏡面平移 ｜ 按住物體轉折點可拉伸形狀，按住線條可移動整體'
    },
    en: {}
});
</script>

<!-- ═══════════ 頁面邏輯（光學／幾何計算與繪圖逐字保留自原頁） ═══════════ -->
<script>
    const t = (k, p) => PhysLab.i18n.t(k, p);

    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const CSS_WIDTH = 800;
    const CSS_HEIGHT = 600;
    const GRID_SIZE = 25;
    const MARGIN = 40;

    let currentShape = 'arrow';
    let showObserver = true;
    let showImage = true;
    let showLabels = true;
    let showNormal = true;
    let showMinMirror = false;
    let showDistance = false;
    let showGhost = false;
    let isSlanted = false;

    let ghostHistory = [];
    const MAX_GHOSTS = 8;

    const rayColors = ['#e74c3c', '#e67e22', '#2ecc71', '#9b59b6', '#1abc9c', '#34495e', '#f1c40f'];
    const labels = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];

    let pts = [];
    const mirror = { x: 425, y: 300 };
    const observer = { x: 150, y: 150, radius: 15 };

    let ptVisibility = [];
    let raySelectionStates = {};

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = CSS_WIDTH * dpr;
        canvas.height = CSS_HEIGHT * dpr;
        ctx.resetTransform();
        ctx.scale(dpr, dpr);
        draw();
    }

    // 動態生成選中圖形的對應光線控制 UI 開關（toggle-row 版）
    function updateRayControlUI() {
        const container = document.getElementById('rayControlsContainer');
        container.innerHTML = '';

        pts.forEach((_, idx) => {
            const labelText = labels[idx];
            const color = rayColors[idx % rayColors.length];

            const row = document.createElement('div');
            row.className = 'toggle-row';
            row.style.borderLeft = '3px solid ' + color;

            const track = document.createElement('div');
            // 如果先前沒有記錄過狀態，預設為選中 (true)
            track.className = 'toggle-track' + (raySelectionStates[idx] !== false ? ' on' : '');
            track.id = `trkRay_${idx}`;
            track.appendChild(Object.assign(document.createElement('div'), { className: 'toggle-thumb' }));

            const span = document.createElement('span');
            span.textContent = t('panel.rays.toggle', { label: labelText });

            row.appendChild(track);
            row.appendChild(span);
            row.addEventListener('click', () => {
                const next = raySelectionStates[idx] === false;
                raySelectionStates[idx] = next;
                track.classList.toggle('on', next);
                draw();
            });
            container.appendChild(row);
        });
    }

    document.getElementById('btnAllRaysOn').addEventListener('click', () => {
        pts.forEach((_, idx) => {
            raySelectionStates[idx] = true;
            const trk = document.getElementById(`trkRay_${idx}`);
            if (trk) trk.classList.add('on');
        });
        draw();
    });

    document.getElementById('btnAllRaysOff').addEventListener('click', () => {
        pts.forEach((_, idx) => {
            raySelectionStates[idx] = false;
            const trk = document.getElementById(`trkRay_${idx}`);
            if (trk) trk.classList.remove('on');
        });
        draw();
    });

    function initShape(type) {
        currentShape = type;
        raySelectionStates = {}; // 切換圖形時重置光線勾選狀態

        if (type === 'arrow') {
            pts = [{ x: 225, y: 275 }, { x: 225, y: 425 }];
        } else if (type === 'triangle') {
            pts = [{ x: 225, y: 275 }, { x: 175, y: 425 }, { x: 275, y: 425 }];
        } else if (type === 'rectangle') {
            pts = [{ x: 175, y: 275 }, { x: 275, y: 275 }, { x: 275, y: 400 }, { x: 175, y: 400 }];
        } else if (type === 'letterP') {
            pts = [
                { x: 175, y: 425 },
                { x: 175, y: 250 },
                { x: 250, y: 250 },
                { x: 250, y: 325 },
                { x: 175, y: 325 }
            ];
        } else if (type === 'letterH') {
            pts = [
                { x: 175, y: 250 },
                { x: 175, y: 425 },
                { x: 175, y: 325 },
                { x: 250, y: 325 },
                { x: 250, y: 250 },
                { x: 250, y: 425 }
            ];
        } else if (type === 'letterY') {
            pts = [
                { x: 150, y: 250 },
                { x: 200, y: 325 },
                { x: 250, y: 250 },
                { x: 200, y: 325 },
                { x: 200, y: 425 }
            ];
        }

        // 初始化所有點的光線為開
        pts.forEach((_, idx) => { raySelectionStates[idx] = true; });
        ghostHistory = [];
        updateRayControlUI(); // 確保每次切換形狀時都重新整理控制面板
        if (canvas) { enforceObserverSide(); draw(); }
    }

    document.getElementById('shapeSelect').addEventListener('change', (e) => initShape(e.target.value));

    // 開關列切換（toggle-row → .toggle-track.on）
    function setupToggle(rowId, trackId, ticker) {
        document.getElementById(rowId).addEventListener('click', () => {
            const state = ticker();
            document.getElementById(trackId).classList.toggle('on', state);
            draw();
        });
    }
    setupToggle('row-observer', 'opt-observer', () => showObserver = !showObserver);
    setupToggle('row-image', 'opt-image', () => showImage = !showImage);
    setupToggle('row-labels', 'opt-labels', () => showLabels = !showLabels);
    setupToggle('row-normal', 'opt-normal', () => showNormal = !showNormal);
    setupToggle('row-minmirror', 'opt-minmirror', () => showMinMirror = !showMinMirror);
    setupToggle('row-distance', 'opt-distance', () => showDistance = !showDistance);
    setupToggle('row-ghost', 'opt-ghost', () => {
        showGhost = !showGhost;
        ghostHistory = [];
        document.getElementById('btnClearGhost').disabled = !showGhost;
        return showGhost;
    });

    document.getElementById('btnClearGhost').addEventListener('click', () => {
        if (showGhost) {
            ghostHistory = [];
            draw();
        }
    });

    document.getElementById('btnAngle').addEventListener('click', () => {
        isSlanted = !isSlanted;
        ghostHistory = [];
        enforceObserverSide();
        draw();
    });

    function snap(value) { return Math.round(value / GRID_SIZE) * GRID_SIZE; }
    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
    function getMirrorNormal() {
        const theta = isSlanted ? Math.PI / 4 : Math.PI / 2;
        return { nx: -Math.sin(theta), ny: Math.cos(theta) };
    }
    function isInsideCanvas(pt) {
        return pt.x >= MARGIN && pt.x <= CSS_WIDTH - MARGIN &&
               pt.y >= MARGIN && pt.y <= CSS_HEIGHT - MARGIN;
    }
    function getReflection(px, py, mx, my, nx, ny) {
        const vmoX = px - mx;
        const vmoY = py - my;
        const d = vmoX * nx + vmoY * ny;
        return { x: px - 2 * d * nx, y: py - 2 * d * ny };
    }
    function distToSegment(p, v, w) {
        const l2 = Math.hypot(v.x - w.x, v.y - w.y) ** 2;
        if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
        let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }
    function isPointInPoly(p, poly) {
        let isInside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = poly[i].x, yi = poly[i].y;
            const xj = poly[j].x, yj = poly[j].y;
            const intersect = ((yi > p.y) !== (yj > p.y)) && (p.x < (xj - xi) * (p.y - yi) / (yj - yi) + xi);
            if (intersect) isInside = !isInside;
        }
        return isInside;
    }
    function lineSegmentsIntersect(p1, p2, p3, p4) {
        const d = (p4.y - p3.y) * (p2.x - p1.x) - (p4.x - p3.x) * (p2.y - p1.y);
        if (d === 0) return false;
        const ua = ((p4.x - p3.x) * (p1.y - p3.y) - (p4.y - p3.y) * (p1.x - p3.x)) / d;
        const ub = ((p2.x - p1.x) * (p1.y - p3.y) - (p2.y - p1.y) * (p1.x - p3.x)) / d;
        return (ua > 0.001 && ua < 0.999 && ub > 0.001 && ub < 0.999);
    }
    function isRayBlockedBySelf(startPt, endPt) {
        if (currentShape === 'arrow' || currentShape.startsWith('letter')) return false;
        const len = pts.length;
        for (let i = 0; i < len; i++) {
            const v1 = pts[i];
            const v2 = pts[(i + 1) % len];
            if (lineSegmentsIntersect(startPt, endPt, v1, v2)) return true;
        }
        return false;
    }

    function getMirrorBoundaries(mx, my, theta) {
        const cos = Math.cos(theta);
        const sin = Math.sin(theta);
        let tMinX = -Infinity, tMaxX = Infinity, tMinY = -Infinity, tMaxY = Infinity;
        if (Math.abs(cos) > 0.0001) {
            let t1 = (0 - mx) / cos, t2 = (CSS_WIDTH - mx) / cos;
            tMinX = Math.min(t1, t2); tMaxX = Math.max(t1, t2);
        }
        if (Math.abs(sin) > 0.0001) {
            let t1 = (0 - my) / sin, t2 = (CSS_HEIGHT - my) / sin;
            tMinY = Math.min(t1, t2); tMaxY = Math.max(t1, t2);
        }
        const tStart = Math.max(tMinX, tMinY);
        const tEnd = Math.min(tMaxX, tMaxY);
        return { p1: { x: mx + tStart * cos, y: my + tStart * sin }, p2: { x: mx + tEnd * cos, y: my + tEnd * sin } };
    }

    function enforceObserverSide() {
        if (pts.length === 0) return;
        const { nx, ny } = getMirrorNormal();
        let objCenterX = pts.reduce((sum, p) => sum + p.x, 0) / pts.length;
        let objCenterY = pts.reduce((sum, p) => sum + p.y, 0) / pts.length;
        const objSide = Math.sign((objCenterX - mirror.x) * nx + (objCenterY - mirror.y) * ny);
        const obsSide = Math.sign((observer.x - mirror.x) * nx + (observer.y - mirror.y) * ny);
        if (obsSide !== objSide || obsSide === 0) {
            const vmoX = observer.x - mirror.x, vmoY = observer.y - mirror.y;
            const d = vmoX * nx + vmoY * ny;
            observer.x = clamp(snap(observer.x - 2 * d * nx), MARGIN, CSS_WIDTH - MARGIN);
            observer.y = clamp(snap(observer.y - 2 * d * ny), MARGIN, CSS_HEIGHT - MARGIN);
        }
    }

    function recordGhostState() {
        if (!showGhost || pts.length === 0) return;
        const { nx, ny } = getMirrorNormal();
        const currentImgPts = pts.map(p => getReflection(p.x, p.y, mirror.x, mirror.y, nx, ny));
        if (ghostHistory.length > 0) {
            const last = ghostHistory[ghostHistory.length - 1];
            if (pts.every((p, idx) => p.x === last.obj[idx].x && p.y === last.obj[idx].y)) return;
        }
        ghostHistory.push({ obj: pts.map(p => ({...p})), img: currentImgPts });
        if (ghostHistory.length > MAX_GHOSTS) ghostHistory.shift();
    }

    function drawGhosts() {
        if (!showGhost || ghostHistory.length === 0 || pts.length === 0) return;
        ghostHistory.forEach((state, step) => {
            const alphaBase = (step + 1) / ghostHistory.length;
            const alpha = alphaBase * 0.5 + 0.1;

            ctx.save();
            ctx.strokeStyle = `rgba(52, 152, 219, ${alpha})`;
            ctx.lineWidth = 2.5;
            drawGhostShape(state.obj, `rgba(52, 152, 219, ${alpha * 0.1})`);
            if (showImage) {
                ctx.strokeStyle = `rgba(155, 89, 182, ${alpha})`;
                ctx.setLineDash([5, 5]);
                drawGhostShape(state.img, `rgba(155, 89, 182, ${alpha * 0.1})`);
            }
            ctx.restore();
        });
    }

    function drawGhostShape(points, fillStyle) {
        if (!points || points.length === 0) return;
        ctx.fillStyle = fillStyle;
        if (currentShape === 'arrow') {
            ctx.beginPath(); ctx.moveTo(points[1].x, points[1].y); ctx.lineTo(points[0].x, points[0].y); ctx.stroke();
            const angle = Math.atan2(points[0].y - points[1].y, points[0].x - points[1].x);
            const headlen = 10;
            ctx.beginPath(); ctx.fillStyle = ctx.strokeStyle; ctx.moveTo(points[0].x, points[0].y);
            ctx.lineTo(points[0].x - headlen * Math.cos(angle - Math.PI/6), points[0].y - headlen * Math.sin(angle - Math.PI/6));
            ctx.lineTo(points[0].x - headlen * Math.cos(angle + Math.PI/6), points[0].y - headlen * Math.sin(angle + Math.PI/6));
            ctx.fill();
        } else if (currentShape.startsWith('letter')) {
            ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.stroke();
        } else {
            ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.closePath(); ctx.fill(); ctx.stroke();
        }
    }

    let dragTarget = null, dragHandleIdx = -1, initialPts = [], startMouse = { x: 0, y: 0 };

    canvas.addEventListener('mousedown', (e) => {
        if (pts.length === 0) return;
        const rect = canvas.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) * (CSS_WIDTH / rect.width), mouseY = (e.clientY - rect.top) * (CSS_HEIGHT / rect.height);
        if (showObserver && Math.hypot(mouseX - observer.x, mouseY - observer.y) < observer.radius * 1.5) { dragTarget = 'observer'; return; }
        const bounds = getMirrorBoundaries(mirror.x, mirror.y, isSlanted ? Math.PI/4 : Math.PI/2);
        if (distToSegment({ x: mouseX, y: mouseY }, bounds.p1, bounds.p2) < 15) { dragTarget = 'mirror'; startMouse = { x: snap(mouseX), y: snap(mouseY) }; initialPts = { x: mirror.x, y: mirror.y }; return; }

        for (let i = 0; i < pts.length; i++) {
            if (Math.hypot(mouseX - pts[i].x, mouseY - pts[i].y) < 20) {
                if (currentShape === 'rectangle' && i !== 2) continue;
                dragTarget = 'handle'; dragHandleIdx = i; startMouse = { x: snap(mouseX), y: snap(mouseY) }; initialPts = pts.map(p => ({...p})); return;
            }
        }

        let isClickingBody = false;
        if (currentShape === 'arrow' && distToSegment({ x: mouseX, y: mouseY }, pts[0], pts[1]) < 15) isClickingBody = true;
        else if (currentShape.startsWith('letter')) {
            for(let i=0; i<pts.length-1; i++) {
                if(distToSegment({ x: mouseX, y: mouseY }, pts[i], pts[i+1]) < 15) { isClickingBody = true; break; }
            }
        } else if (isPointInPoly({ x: mouseX, y: mouseY }, pts)) isClickingBody = true;

        if (isClickingBody) {
            dragTarget = 'body'; startMouse = { x: snap(mouseX), y: snap(mouseY) }; initialPts = pts.map(p => ({...p}));
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        if (!dragTarget || pts.length === 0) return;
        const rect = canvas.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) * (CSS_WIDTH / rect.width), mouseY = (e.clientY - rect.top) * (CSS_HEIGHT / rect.height);
        const snX = snap(mouseX), snY = snap(mouseY), { nx, ny } = getMirrorNormal();
        let changed = false;

        if (dragTarget === 'body') {
            const dx = snX - startMouse.x, dy = snY - startMouse.y;
            let test = initialPts.map(p => ({ x: p.x + dx, y: p.y + dy }));
            if (test.every(isInsideCanvas)) { pts = test; enforceObserverSide(); changed = true; }
        } else if (dragTarget === 'handle') {
            const dx = snX - startMouse.x, dy = snY - startMouse.y;
            let test = pts.map(p => ({...p}));
            if (currentShape === 'arrow' || currentShape === 'triangle' || currentShape.startsWith('letter')) {
                test[dragHandleIdx].x = clamp(initialPts[dragHandleIdx].x + dx, MARGIN, CSS_WIDTH - MARGIN);
                test[dragHandleIdx].y = clamp(initialPts[dragHandleIdx].y + dy, MARGIN, CSS_HEIGHT - MARGIN);
                if (currentShape === 'letterY') {
                    if (dragHandleIdx === 1) test[3] = { ...test[1] };
                    if (dragHandleIdx === 3) test[1] = { ...test[3] };
                }
            } else if (currentShape === 'rectangle') {
                let brx = clamp(initialPts[2].x + dx, pts[0].x + GRID_SIZE, CSS_WIDTH - MARGIN);
                let bry = clamp(initialPts[2].y + dy, pts[0].y + GRID_SIZE, CSS_HEIGHT - MARGIN);
                test[2] = { x: brx, y: bry }; test[1] = { x: brx, y: pts[0].y }; test[3] = { x: pts[0].x, y: bry };
            }
            if (test.every(isInsideCanvas)) { pts = test; enforceObserverSide(); changed = true; }
        } else if (dragTarget === 'mirror') {
            mirror.x = clamp(initialPts.x + (snX - startMouse.x), MARGIN, CSS_WIDTH - MARGIN);
            mirror.y = clamp(initialPts.y + (snY - startMouse.y), MARGIN, CSS_HEIGHT - MARGIN);
            enforceObserverSide(); changed = true;
        } else if (dragTarget === 'observer' && showObserver) {
            let ocx = pts.reduce((s, p) => s + p.x, 0) / pts.length, ocy = pts.reduce((s, p) => s + p.y, 0) / pts.length;
            if (Math.sign((snX - mirror.x) * nx + (snY - mirror.y) * ny) === Math.sign((ocx - mirror.x) * nx + (ocy - mirror.y) * ny)) { observer.x = clamp(snX, MARGIN, CSS_WIDTH - MARGIN); observer.y = clamp(snY, MARGIN, CSS_HEIGHT - MARGIN); }
        }
        if (changed) recordGhostState();
        draw();
    });

    canvas.addEventListener('mouseup', () => dragTarget = null);
    canvas.addEventListener('mouseleave', () => dragTarget = null);

    function drawGrid() {
        ctx.beginPath(); ctx.strokeStyle = '#e8ecef'; ctx.lineWidth = 1;
        for (let x = 0; x <= CSS_WIDTH; x += GRID_SIZE) { ctx.moveTo(x, 0); ctx.lineTo(x, CSS_HEIGHT); }
        for (let y = 0; y <= CSS_HEIGHT; y += GRID_SIZE) { ctx.moveTo(0, y); ctx.lineTo(CSS_WIDTH, y); }
        ctx.stroke();
    }

    function drawIndependentDistance(objPt, imgPt, nx, ny) {
        const vmoX = objPt.x - mirror.x, vmoY = objPt.y - mirror.y, d = vmoX * nx + vmoY * ny;
        const mid = { x: objPt.x - d * nx, y: objPt.y - d * ny };
        ctx.save(); ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.strokeStyle = '#7f8c8d';
        ctx.beginPath(); ctx.moveTo(objPt.x, objPt.y); ctx.lineTo(mid.x, mid.y); ctx.lineTo(imgPt.x, imgPt.y); ctx.stroke();
        let u = (!isSlanted) ? Math.abs(objPt.x - mirror.x) / GRID_SIZE : Math.hypot(objPt.x - mid.x, objPt.y - mid.y) / (Math.sqrt(2) * GRID_SIZE);
        ctx.setLineDash([]); ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#666'; ctx.textAlign = 'center';
        ctx.fillText(Number(u.toFixed(1)), (objPt.x + mid.x) / 2, (objPt.y + mid.y) / 2 - 5);
        ctx.fillText(Number(u.toFixed(1)), (imgPt.x + mid.x) / 2, (imgPt.y + mid.y) / 2 - 5);
        ctx.restore();
    }

    function drawShapeOutline(points, color, isImage = false) {
        if (!points || points.length === 0) return;
        ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 3;

        let cx = points.reduce((sum, p) => sum + p.x, 0) / points.length;
        let cy = points.reduce((sum, p) => sum + p.y, 0) / points.length;

        if (isImage) { ctx.setLineDash([6, 5]); ctx.fillStyle = 'rgba(155, 89, 182, 0.05)'; } else { ctx.fillStyle = 'rgba(52, 152, 219, 0.08)'; }

        if (currentShape === 'arrow') {
            ctx.beginPath(); ctx.moveTo(points[1].x, points[1].y); ctx.lineTo(points[0].x, points[0].y); ctx.stroke();
            const a = Math.atan2(points[0].y - points[1].y, points[0].x - points[1].x);
            ctx.beginPath(); ctx.fillStyle = color; ctx.moveTo(points[0].x, points[0].y);
            ctx.lineTo(points[0].x - 14 * Math.cos(a - Math.PI/6), points[0].y - 14 * Math.sin(a - Math.PI/6));
            ctx.lineTo(points[0].x - 14 * Math.cos(a + Math.PI/6), points[0].y - 14 * Math.sin(a + Math.PI/6)); ctx.fill();
        } else if (currentShape.startsWith('letter')) {
            ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.stroke();
        } else {
            ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.closePath(); ctx.fill(); ctx.stroke();
        }

        ctx.setLineDash([]);
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        points.forEach((p, i) => {
            if (!isImage || ptVisibility[i]) {
                if (showLabels) {
                    ctx.beginPath();
                    ctx.fillStyle = isImage ? '#9b59b6' : '#2c3e50';
                    ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                let dx = p.x - cx;
                let dy = p.y - cy;
                let len = Math.hypot(dx, dy);
                if (len === 0) { dx = -1; dy = -1; len = 1; }

                let labelX = p.x + (dx / len) * 16;
                let labelY = p.y + (dy / len) * 16;

                ctx.fillStyle = isImage ? '#8e44ad' : '#2c3e50';
                ctx.fillText((labels[i] || '') + (isImage ? "'" : ""), labelX, labelY);
            }
        });
        ctx.restore();
    }

    function drawRayTracing(objPt, imgPt, color, nx, ny, idx) {
        const denom = nx * (observer.x - imgPt.x) + ny * (observer.y - imgPt.y);
        if (Math.abs(denom) < 0.001) { ptVisibility[idx] = false; return; }
        const u = (nx * (mirror.x - imgPt.x) + ny * (mirror.y - imgPt.y)) / denom;
        const ptRef = { x: imgPt.x + u * (observer.x - imgPt.x), y: imgPt.y + u * (observer.y - imgPt.y) };
        if (isRayBlockedBySelf(objPt, ptRef)) { ptVisibility[idx] = false; return; }
        ptVisibility[idx] = true;

        // 如果此頂點被使用者取消勾選，則不繪製該點的任何射線
        if (raySelectionStates[idx] === false) return;

        ctx.save(); ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
        ctx.moveTo(imgPt.x, imgPt.y); ctx.lineTo(ptRef.x, ptRef.y); ctx.stroke();
        ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(objPt.x, objPt.y); ctx.lineTo(ptRef.x, ptRef.y); ctx.lineTo(observer.x, observer.y); ctx.stroke();
        [{f:objPt, t:ptRef}, {f:ptRef, t:observer}].forEach(l => {
            const mx = (l.f.x + l.t.x) / 2, my = (l.f.y + l.t.y) / 2, a = Math.atan2(l.t.y - l.f.y, l.t.x - l.f.x);
            ctx.beginPath(); ctx.fillStyle = color; ctx.moveTo(mx, my);
            ctx.lineTo(mx - 8*Math.cos(a - Math.PI/6), my - 8*Math.sin(a - Math.PI/6));
            ctx.lineTo(mx - 8*Math.cos(a + Math.PI/6), my - 8*Math.sin(a + Math.PI/6)); ctx.fill();
        });
        if (showNormal) { ctx.beginPath(); ctx.strokeStyle = '#27ae60'; ctx.setLineDash([4, 4]); ctx.moveTo(ptRef.x - nx * 30, ptRef.y - ny * 30); ctx.lineTo(ptRef.x + nx * 30, ptRef.y + ny * 30); ctx.stroke(); }
        ctx.restore();
    }

    function drawEye(x, y) {
        ctx.save(); ctx.beginPath(); ctx.moveTo(x - 18, y); ctx.quadraticCurveTo(x, y - 12, x + 18, y); ctx.quadraticCurveTo(x, y + 12, x - 18, y); ctx.closePath(); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fillStyle = '#3498db'; ctx.fill(); ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fillStyle = '#000'; ctx.fill();
        ctx.fillStyle = '#2c3e50'; ctx.font = 'bold 13px Arial'; ctx.fillText('E', x + 22, y + 5); ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, CSS_WIDTH, CSS_HEIGHT);
        drawGrid();
        if (!pts || pts.length === 0) return;

        const { nx, ny } = getMirrorNormal();
        const theta = isSlanted ? Math.PI/4 : Math.PI/2;
        const bounds = getMirrorBoundaries(mirror.x, mirror.y, theta);
        ctx.beginPath(); ctx.strokeStyle = '#95a5a6'; ctx.lineWidth = 4; ctx.moveTo(bounds.p1.x, bounds.p1.y); ctx.lineTo(bounds.p2.x, bounds.p2.y); ctx.stroke();
        ctx.fillStyle = '#2c3e50'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'left'; ctx.fillText(t('canvas.hint'), 15, 25);

        drawGhosts();
        const imgPts = pts.map(p => getReflection(p.x, p.y, mirror.x, mirror.y, nx, ny));
        ptVisibility = new Array(pts.length).fill(true);

        // 繪製光線
        pts.forEach((p, idx) => drawRayTracing(p, imgPts[idx], rayColors[idx % rayColors.length], nx, ny, idx));
        if (showDistance) pts.forEach((p, idx) => drawIndependentDistance(p, imgPts[idx], nx, ny));

        if (showMinMirror) {
            let tValues = [];
            const dirX = Math.cos(theta), dirY = Math.sin(theta);
            pts.forEach((p, idx) => {
                if (!ptVisibility[idx] || raySelectionStates[idx] === false) return;
                const denom = nx * (observer.x - imgPts[idx].x) + ny * (observer.y - imgPts[idx].y);
                if (Math.abs(denom) > 0.001) {
                    const u = (nx * (mirror.x - imgPts[idx].x) + ny * (mirror.y - imgPts[idx].y)) / denom;
                    const pr = { x: imgPts[idx].x + u * (observer.x - imgPts[idx].x), y: imgPts[idx].y + u * (observer.y - imgPts[idx].y) };
                    tValues.push((pr.x - mirror.x) * dirX + (pr.y - mirror.y) * dirY);
                }
            });
            if (tValues.length > 0) {
                const minPt = { x: mirror.x + Math.min(...tValues) * dirX, y: mirror.y + Math.min(...tValues) * dirY };
                const maxPt = { x: mirror.x + Math.max(...tValues) * dirX, y: mirror.y + Math.max(...tValues) * dirY };
                ctx.save(); ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(minPt.x, minPt.y); ctx.lineTo(maxPt.x, maxPt.y); ctx.stroke(); ctx.restore();
            }
        }
        if (showImage) drawShapeOutline(imgPts, '#9b59b6', true);
        drawShapeOutline(pts, '#3498db', false);
        if (showObserver) drawEye(observer.x, observer.y);
    }

    // 面板開關（切換後重繪畫布）
    PhysLab.ui.bindPanelToggle('btn-toggle-left', 'left-panel', draw);

    // 語言切換後：重建動態光線開關列文字 + 重繪畫布（fillText 中文提示）
    PhysLab.i18n.onChange(() => { updateRayControlUI(); draw(); });

    initShape('arrow');
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
</script>
</body>
</html>
