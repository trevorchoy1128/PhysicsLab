<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平面鏡反射定律模擬器 V3.9 - 教材標準修正版</title>

    <!-- KaTeX 0.16.9（公式排版） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- 共用資源（載入順序固定，不可 defer/async） -->
    <link rel="stylesheet" href="../../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../../assets/css/labgray.css">
    <script src="../../../assets/js/core.js"></script>
    <script src="../../../assets/js/i18n.js"></script>
    <script src="../../../assets/js/canvas2d.js"></script>

    <style>
        /* ── 頁面獨有 CSS ──
           畫布：保留原頁 800×460 邏輯座標系（幾何常數以邏輯像素寫死），
           真・貼邊無縫填滿 #canvas-wrap（信箱留白由 view.clear() 灰底補齊），
           滑鼠座標換算改用 PhysLab.c2d.pointerPos（回傳邏輯座標）。 */
        #simCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* 滑桿列右側的數字輸入框（保留原頁可直接鍵入角度的功能） */
        .num-input {
            width: 56px; padding: 2px 4px;
            border: 1px solid var(--pl-border); border-radius: 4px;
            background: var(--pl-card); color: var(--pl-accent-deep);
            font-size: 0.78rem; font-weight: 700; text-align: center;
            font-variant-numeric: tabular-nums;
        }
        /* 讀數格配色 — 與畫布光線教學色一致（藍=鏡面、紅=入射、綠=反射） */
        .rc-mirror { background: #eff6ff; border-color: #bfdbfe; color: #2563eb; grid-column: 1 / -1; }
        .rc-i      { background: #fef2f2; border-color: #fecaca; color: #ef4444; }
        .rc-r      { background: #f0fdf4; border-color: #bbf7d0; color: #16a34a; }
    </style>
</head>
<body>

<!-- ═══════════ 頂欄 ═══════════ -->
<div id="topbar">
    <div style="display:flex;align-items:center;gap:16px;">
        <button type="button" class="panel-toggle-btn" id="btn-toggle-left">
            <span>☰</span> <span data-i18n="topbar.controls">控制</span>
        </button>
        <div class="title-block">
            <h1 data-i18n="topbar.title">平面鏡反射定律模擬器</h1>
            <p data-i18n="topbar.subtitle">HKDSE Physics · Book 3 · Chapter 1 · 光的反射</p>
        </div>
    </div>
    <div class="tb-actions">
        <!-- 語言切換 #lang-btn（i18n.js）與 🏠 主頁 #home-btn（core.js）自動注入 -->
        <button type="button" class="panel-toggle-btn" id="btn-toggle-right">
            <span>📖</span> <span data-i18n="topbar.info">資訊</span>
        </button>
    </div>
</div>

<div id="main">

    <!-- ═══════════ 左側控制面板 ═══════════ -->
    <div id="left-panel">
        <div class="card">
            <div class="card-header">⚙️ <span data-i18n="panel.params.header">核心參數設定</span><span class="chevron">▾</span></div>
            <div class="card-body">
                <div class="slider-row">
                    <div class="slider-head">
                        <label data-i18n="panel.params.mirrorAngle">鏡面旋轉角度 (度):</label>
                        <input type="number" class="num-input" id="mRotNum" min="-45" max="45" value="0">
                    </div>
                    <input type="range" id="mRotSlider" min="-45" max="45" value="0" step="1">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">👁️ <span data-i18n="panel.visual.header">畫面視覺控制</span><span class="chevron">▾</span></div>
            <div class="card-body">
                <div class="toggle-row" id="row-normal">
                    <div class="toggle-track on" id="opt-normal"><div class="toggle-thumb"></div></div>
                    <span data-i18n="panel.visual.normal">📐 顯示法線 (N)</span>
                </div>
                <div class="toggle-row" id="row-angles">
                    <div class="toggle-track on" id="opt-angles"><div class="toggle-thumb"></div></div>
                    <span data-i18n="panel.visual.angles">📏 顯示角度標註</span>
                </div>
            </div>
        </div>

        <div class="info-box">
            <b data-i18n="panel.guide.header">💡 教學操作指引</b><br>
            <span data-i18n-html="panel.guide.body">1. <b>直接在畫布上滑鼠拖曳</b>橘色點，可以任意移動<b>光源 (S)</b> 的位置。<br>2. 調整上方拉桿旋轉鏡面。系統內建<b>安全物理邊界限制</b>，鏡面角度絕不允許超越入射光源。</span>
        </div>
    </div>

    <!-- ═══════════ 中央 2D 畫布 ═══════════ -->
    <div id="canvas-wrap">
        <canvas id="simCanvas"></canvas>
    </div>

    <!-- ═══════════ 右側資訊面板 ═══════════ -->
    <div id="right-panel">
        <div class="formula-box">
            <h4>⚡ <span data-i18n="formula.title">反射定律 (Law of Reflection)</span></h4>
            <div class="formula" id="mathCalcFormula"></div>
            <div class="readout-grid">
                <div class="readout-cell rc-mirror"><small data-i18n="readout.mirror">鏡面旋轉角度</small><span id="mAngVal">--</span></div>
                <div class="readout-cell rc-i"><small><span data-i18n="readout.incident">入射角</span> (<span id="texLabelUiI">θ<sub>i</sub></span>)</small><span id="iAngVal">--</span></div>
                <div class="readout-cell rc-r"><small><span data-i18n="readout.reflected">反射角</span> (<span id="texLabelUiR">θ<sub>r</sub></span>)</small><span id="rAngVal">--</span></div>
            </div>
        </div>
    </div>
</div>

<!-- ═══════════ 頁面字典（zh 必填；en 缺字自動回退 zh） ═══════════ -->
<script>
PhysLab.i18n.register({
    zh: {
        'topbar.title': '平面鏡反射定律模擬器',
        'topbar.subtitle': 'HKDSE Physics · Book 3 · Chapter 1 · 光的反射',
        'topbar.controls': '控制',
        'topbar.info': '資訊',
        'panel.params.header': '核心參數設定',
        'panel.params.mirrorAngle': '鏡面旋轉角度 (度):',
        'panel.visual.header': '畫面視覺控制',
        'panel.visual.normal': '📐 顯示法線 (N)',
        'panel.visual.angles': '📏 顯示角度標註',
        'panel.guide.header': '💡 教學操作指引',
        'panel.guide.body': '1. <b>直接在畫布上滑鼠拖曳</b>橘色點，可以任意移動<b>光源 (S)</b> 的位置。<br>2. 調整上方拉桿旋轉鏡面。系統內建<b>安全物理邊界限制</b>，鏡面角度絕不允許超越入射光源。',
        'formula.title': '反射定律 (Law of Reflection)',
        'readout.mirror': '鏡面旋轉角度',
        'readout.incident': '入射角',
        'readout.reflected': '反射角',
        'canvas.normal': '法線 (Normal)',
        'canvas.source': '光源 (S)',
        'canvas.dynCheck': '動態檢驗: 入射角 = 反射角 = {v}°'
    },
    en: {}
});
</script>

<!-- ═══════════ 頁面邏輯（物理／幾何計算逐字保留自原頁） ═══════════ -->
<script>
    const t = (k, p) => PhysLab.i18n.t(k, p);

    const canvas = document.getElementById('simCanvas');
    const logicalWidth = 800, logicalHeight = 460;

    // 貼邊無縫舞台：畫布填滿容器，繪圖座標維持 0..800 × 0..460 置中等比縮放
    const view = PhysLab.c2d.setup(canvas, {
        logical: { w: logicalWidth, h: logicalHeight },
        bg: '#e2e6eb',
        onResize: update
    });
    const ctx = view.ctx;

    // UI 元件
    const mRotSlider = document.getElementById('mRotSlider'), mRotNum = document.getElementById('mRotNum');

    const mAngVal = document.getElementById('mAngVal');
    const iAngVal = document.getElementById('iAngVal'), rAngVal = document.getElementById('rAngVal');
    const texLabelUiI = document.getElementById('texLabelUiI');
    const texLabelUiR = document.getElementById('texLabelUiR');
    const mathCalcFormula = document.getElementById('mathCalcFormula');

    // 顯示狀態
    let showNormal = true;
    let showAngles = true;

    // 鏡面中心點與尺寸
    const centerX = logicalWidth / 2;
    const centerY = 320;
    const mirrorLength = 540;

    // 初始光源座標位置
    let lightSrcX = 220;
    let lightSrcY = 140;

    // 開關列切換（toggle-row → .toggle-track.on）
    function setupToggle(rowId, trackId, ticker) {
        document.getElementById(rowId).addEventListener('click', () => {
            const state = ticker();
            document.getElementById(trackId).classList.toggle('on', state);
            update();
        });
    }
    setupToggle('row-normal', 'opt-normal', () => showNormal = !showNormal);
    setupToggle('row-angles', 'opt-angles', () => showAngles = !showAngles);

    // 【核心修訂】動態計算拉桿的安全邊界，防止鏡面轉到光源後方
    function updateSliderBounds() {
        const dx = lightSrcX - centerX;
        const dy = lightSrcY - centerY;
        const thetaDeg = Math.atan2(dy, dx) * 180 / Math.PI; // 光源相對於中心的角度

        // 預留 5 度的安全緩衝區，計算鏡面允許的旋轉範圍
        let minA = Math.ceil(thetaDeg + 5);
        let maxA = Math.floor(thetaDeg + 175);

        // 限制在絕對物理極限 [-45, 45] 度內
        minA = Math.max(-45, minA);
        maxA = Math.min(45, maxA);

        mRotSlider.min = minA;
        mRotSlider.max = maxA;

        // 如果當前值超出新邊界，平滑推回邊界值
        let currentVal = parseFloat(mRotSlider.value);
        if (currentVal < minA) {
            mRotSlider.value = minA;
            mRotNum.value = minA;
        } else if (currentVal > maxA) {
            mRotSlider.value = maxA;
            mRotNum.value = maxA;
        }
    }

    // 【核心修訂】純淨的拉桿連動邏輯 (依賴動態邊界，不再需要強制 Snap-back)
    mRotSlider.addEventListener('input', () => {
        mRotNum.value = mRotSlider.value;
        update();
    });

    mRotNum.addEventListener('input', () => {
        let val = parseFloat(mRotNum.value);
        if (isNaN(val)) return;

        let minA = parseFloat(mRotSlider.min);
        let maxA = parseFloat(mRotSlider.max);

        // 數字框輸入時也進行邊界鉗制
        if (val < minA) val = minA;
        if (val > maxA) val = maxA;

        mRotSlider.value = val;
        update();
    });

    // 確保使用者輸入完畢後，數字框顯示的是被鉗制後的合法數字
    mRotNum.addEventListener('change', () => {
        mRotNum.value = mRotSlider.value;
    });

    function drawAngleArc(cx, cy, startRad, endRad, radius, color) {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        let diff = endRad - startRad;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        ctx.arc(cx, cy, radius, startRad, startRad + diff, diff < 0);
        ctx.stroke();
    }

    function renderMathTypeStrings(iDeg, rDeg) {
        const formattedVal = iDeg.toFixed(1);
        if (typeof katex !== 'undefined') {
            try {
                katex.render('\\theta_i', texLabelUiI);
                katex.render('\\theta_r', texLabelUiR);
                let texFormula = `\\theta_i = \\theta_r = ${formattedVal}^\\circ`;
                katex.render(texFormula, mathCalcFormula, { displayMode: false });
            } catch(e) {
                mathCalcFormula.innerHTML = `θ<sub>i</sub> = θ<sub>r</sub> = ${formattedVal}°`;
            }
        } else {
            texLabelUiI.innerHTML = "θ<sub>i</sub>";
            texLabelUiR.innerHTML = "θ<sub>r</sub>";
            mathCalcFormula.innerHTML = `θ<sub>i</sub> = θ<sub>r</sub> = ${formattedVal}°`;
        }
    }

    // 主渲染與幾何核心
    function update() {
        view.clear();

        const alphaDeg = parseFloat(mRotSlider.value);
        const alphaRad = alphaDeg * Math.PI / 180;

        // 1. 基準地平虛線
        ctx.beginPath();
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.moveTo(20, centerY);
        ctx.lineTo(logicalWidth - 20, centerY);
        ctx.stroke();
        ctx.setLineDash([]);

        // 2. 鏡面渲染
        const mLeftX = centerX - (mirrorLength / 2) * Math.cos(alphaRad);
        const mLeftY = centerY - (mirrorLength / 2) * Math.sin(alphaRad);
        const mRightX = centerX + (mirrorLength / 2) * Math.cos(alphaRad);
        const mRightY = centerY + (mirrorLength / 2) * Math.sin(alphaRad);

        ctx.beginPath();
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 16;
        ctx.lineCap = 'square';
        ctx.moveTo(mLeftX, mLeftY);
        ctx.lineTo(mRightX, mRightY);
        ctx.stroke();

        ctx.beginPath();
        ctx.strokeStyle = '#0ea5e9';
        ctx.lineWidth = 5;
        ctx.moveTo(mLeftX, mLeftY);
        ctx.lineTo(mRightX, mRightY);
        ctx.stroke();
        ctx.lineCap = 'butt';

        // 3. 物理反射與角度計算
        const nX = Math.sin(alphaRad);
        const nY = -Math.cos(alphaRad);

        const toSrcX = lightSrcX - centerX;
        const toSrcY = lightSrcY - centerY;
        const toSrcLen = Math.hypot(toSrcX, toSrcY);

        const cosTheta = Math.min(1.0, Math.max(-1.0, (toSrcX * nX + toSrcY * nY) / toSrcLen));
        const iAngleDeg = Math.acos(cosTheta) * 180 / Math.PI;
        const rAngleDeg = iAngleDeg;

        const inVecX = centerX - lightSrcX;
        const inVecY = centerY - lightSrcY;

        const dotIncoming = inVecX * nX + inVecY * nY;
        const refVecX = inVecX - 2 * dotIncoming * nX;
        const refVecY = inVecY - 2 * dotIncoming * nY;

        const normalAngleRad = Math.atan2(nY, nX);
        const incomingRayAngle = Math.atan2(toSrcY, toSrcX);
        const reflectedRayAngle = Math.atan2(refVecY, refVecX);

        // 4. 繪製藍色法線 (N)
        if (showNormal) {
            ctx.beginPath();
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(centerX + 240 * nX, centerY + 240 * nY);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.font = 'bold 13px sans-serif';
            ctx.fillStyle = '#2563eb';
            ctx.fillText(t('canvas.normal'), centerX + 250 * nX - 35, centerY + 250 * nY);
        }

        // 5. 繪製紅色入射光
        ctx.beginPath();
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2.5;
        ctx.moveTo(lightSrcX, lightSrcY);
        ctx.lineTo(centerX, centerY);
        ctx.stroke();

        const midInX = lightSrcX + inVecX * 0.5;
        const midInY = lightSrcY + inVecY * 0.5;
        const inAngle = Math.atan2(inVecY, inVecX);
        ctx.beginPath(); ctx.fillStyle = '#ef4444';
        ctx.moveTo(midInX, midInY);
        ctx.lineTo(midInX - 10 * Math.cos(inAngle - Math.PI/6), midInY - 10 * Math.sin(inAngle - Math.PI/6));
        ctx.lineTo(midInX - 10 * Math.cos(inAngle + Math.PI/6), midInY - 10 * Math.sin(inAngle + Math.PI/6));
        ctx.fill();

        // 6. 繪製綠色反射光
        const rScale = 500 / Math.hypot(refVecX, refVecY);
        const refEndX = centerX + refVecX * rScale;
        const refEndY = centerY + refVecY * rScale;

        ctx.beginPath();
        ctx.strokeStyle = '#16a34a';
        ctx.lineWidth = 2.5;
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(refEndX, refEndY);
        ctx.stroke();

        const midOutX = centerX + refVecX * rScale * 0.4;
        const midOutY = centerY + refVecY * rScale * 0.4;
        const outAngle = Math.atan2(refVecY, refVecX);
        ctx.beginPath(); ctx.fillStyle = '#16a34a';
        ctx.moveTo(midOutX, midOutY);
        ctx.lineTo(midOutX - 10 * Math.cos(outAngle - Math.PI/6), midOutY - 10 * Math.sin(outAngle - Math.PI/6));
        ctx.lineTo(midOutX - 10 * Math.cos(outAngle + Math.PI/6), midOutY - 10 * Math.sin(outAngle + Math.PI/6));
        ctx.fill();

        // 7. 繪製橘色光源球 (S)
        ctx.beginPath();
        ctx.fillStyle = '#ea580c';
        ctx.arc(lightSrcX, lightSrcY, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = 'bold 13px sans-serif';
        ctx.fillStyle = '#ea580c';
        ctx.fillText(t('canvas.source'), lightSrcX - 22, lightSrcY - 16);

        ctx.beginPath();
        ctx.fillStyle = '#1e293b';
        ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
        ctx.fill();

        // 8. 實時畫布角度文字
        if (showAngles && showNormal) {
            const arcRadius = 60;
            drawAngleArc(centerX, centerY, normalAngleRad, incomingRayAngle, arcRadius, '#ef4444');
            drawAngleArc(centerX, centerY, normalAngleRad, reflectedRayAngle, arcRadius + 12, '#16a34a');

            ctx.font = 'bold 12px sans-serif';
            ctx.fillStyle = '#ef4444';
            ctx.fillText(`θi = ${iAngleDeg.toFixed(1)}°`, centerX - 60, centerY - 85);
            ctx.fillStyle = '#16a34a';
            ctx.fillText(`θr = ${rAngleDeg.toFixed(1)}°`, centerX + 20, centerY - 85);
        }

        // 9. 更新常規數據面板
        mAngVal.textContent = alphaDeg.toFixed(0) + "°";
        iAngVal.textContent = iAngleDeg.toFixed(1) + "°";
        rAngVal.textContent = rAngleDeg.toFixed(1) + "°";

        ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#475569'; ctx.textAlign = 'right';
        ctx.fillText(t('canvas.dynCheck', { v: iAngleDeg.toFixed(1) }), logicalWidth - 20, 26);
        ctx.textAlign = 'left';

        renderMathTypeStrings(iAngleDeg, rAngleDeg);
    }

    // 【核心修訂】全域防脫軌滑鼠拖曳
    let isDraggingSource = false;

    canvas.addEventListener('mousedown', (e) => {
        const p = PhysLab.c2d.pointerPos(canvas, e, view);
        const mouseX = p.x, mouseY = p.y;

        if (Math.hypot(mouseX - lightSrcX, mouseY - lightSrcY) < 25) {
            isDraggingSource = true;
        }
    });

    // 升級至 window 監聽，杜絕快速拖曳造成的卡死
    window.addEventListener('mousemove', (e) => {
        const p = PhysLab.c2d.pointerPos(canvas, e, view);
        const mouseX = p.x, mouseY = p.y;

        if (isDraggingSource) {
            let targetX = Math.max(40, Math.min(760, mouseX));
            let targetY = Math.max(30, Math.min(centerY - 25, mouseY));

            lightSrcX = targetX;
            lightSrcY = targetY;

            updateSliderBounds(); // 拖曳光源時，同步更新拉桿的安全邊界
            update();
        } else {
            // 僅在畫布範圍內處理游標變化
            if (e.target === canvas) {
                if (Math.hypot(mouseX - lightSrcX, mouseY - lightSrcY) < 25) {
                    canvas.style.cursor = 'pointer';
                } else {
                    canvas.style.cursor = 'default';
                }
            }
        }
    });

    window.addEventListener('mouseup', () => isDraggingSource = false);

    // 面板開關（切換後重繪畫布）
    PhysLab.ui.bindPanelToggle('btn-toggle-left', 'left-panel', update);
    PhysLab.ui.bindPanelToggle('btn-toggle-right', 'right-panel', update);

    // 語言切換後重繪畫布（fillText 中文標籤）；靜態 data-i18n 由 i18n.js 自動套用
    PhysLab.i18n.onChange(update);

    // 頁面初始化
    updateSliderBounds(); // 初始計算一次安全邊界
    update();
    // resize 由 PhysLab.c2d.setup 的 autoResize（window resize + ResizeObserver）接管
</script>
</body>
</html>
