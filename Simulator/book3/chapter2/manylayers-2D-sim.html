<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDSE 物理 - 多層折射與海市蜃樓模擬器</title>

    <!-- 共用資源（載入順序固定，不可 defer/async） -->
    <link rel="stylesheet" href="../../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../../assets/css/labgray.css">
    <script src="../../../assets/js/core.js"></script>
    <script src="../../../assets/js/i18n.js"></script>

    <style>
        /* ── 頁面獨有 CSS ──
           畫布：固定邏輯座標系 800×680（繪圖引擎以 canvas.width/height 計算，
           攝影機 pan/zoom 由 ctx.translate/scale 承擔）。CSS 以 max-width/height
           等比縮放置中（保持 800×680 長寬比，避免拉伸失真），去外框後
           以 #canvas-wrap 的 var(--pl-bg) 灰底作信箱、與舞台無縫。
           ※ 不套 c2d.setup：繪圖直接讀 canvas.width（=800）、pan/zoom 疊在此固定
             緩衝上，重設緩衝會破壞幾何與縮放邏輯，故緩衝固定 800×680 不動。 */
        #canvas-wrap { align-items: center; justify-content: center; }
        #simCanvas {
            max-width: 100%; max-height: 100%;
            background: #fff;
            cursor: grab; touch-action: none;
        }
        .grabbing-cursor { cursor: grabbing !important; }

        /* 海市蜃樓預設按鈕（原琥珀漸變 → warn token） */
        .btn-mirage { background: var(--pl-warn); color: #fff; border-color: var(--pl-warn-deep); }
        .btn-mirage:hover { background: var(--pl-warn-deep); }

        /* 介質層列表（原 Tailwind layer-row 重寫；欄寬與 .lc-head 對齊） */
        .lc-head {
            display: flex; align-items: center; gap: 4px;
            font-size: 0.6rem; font-weight: 700; color: var(--pl-text-faint);
            padding: 0 2px 4px; border-bottom: 1px solid var(--pl-border-soft);
            margin: 8px 0 5px;
        }
        .lc-head .lc-slider { flex: 1; text-align: center; }
        .lc-head .lc-n { width: 34px; text-align: right; }
        .layer-row {
            display: flex; align-items: center; gap: 4px;
            padding: 4px 3px; margin-bottom: 5px; font-size: 0.7rem;
            background: var(--pl-card); border: 1px solid var(--pl-border);
            border-radius: 7px; transition: border-color 0.15s;
        }
        .layer-row:hover { border-color: var(--pl-accent); }
        .lr-idx {
            width: 16px; text-align: center; font-weight: 700;
            color: var(--pl-text-faint); background: var(--pl-inset); border-radius: 4px;
        }
        .lr-name {
            width: 58px; font-weight: 600; color: var(--pl-text-dim);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .layer-row input[type=range] { flex: 1; min-width: 40px; }
        .lr-n {
            width: 34px; text-align: right; font-weight: 700;
            color: var(--pl-accent-deep); font-variant-numeric: tabular-nums;
        }
        .lr-del {
            width: 18px; border: none; background: none; cursor: pointer;
            color: var(--pl-text-faint); font-size: 0.75rem; padding: 0; line-height: 1;
        }
        .lr-del:hover { color: var(--pl-bad); }
    </style>
</head>
<body>

<!-- ═══════════ 頂欄 ═══════════ -->
<div id="topbar">
    <div style="display:flex;align-items:center;gap:16px;">
        <button type="button" class="panel-toggle-btn" id="btn-toggle-left">
            <span>☰</span> <span data-i18n="topbar.controls">控制</span>
        </button>
        <div class="title-block">
            <h1 data-i18n="topbar.title">多層折射模擬器</h1>
            <p data-i18n="topbar.subtitle">HKDSE Physics · Book 3 · Chapter 2 · 多層折射與海市蜃樓</p>
        </div>
    </div>
    <div class="tb-actions">
        <!-- 語言切換 #lang-btn（i18n.js）與 🏠 主頁 #home-btn（core.js）自動注入 -->
    </div>
</div>

<div id="main">

    <!-- ═══════════ 左側控制面板 ═══════════ -->
    <div id="left-panel">
        <div class="card">
            <div class="card-header">🎬 <span data-i18n="panel.presets.header">快速預設</span><span class="chevron">▾</span></div>
            <div class="card-body">
                <div class="action-row">
                    <button type="button" class="action-btn btn-mirage" id="miragePresetBtn" data-i18n="panel.presets.mirage">🏜️ 海市蜃樓成因</button>
                    <button type="button" class="action-btn btn-reset" id="defaultPresetBtn" data-i18n="panel.presets.reset">↩️ 還原基礎三層</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">🔦 <span data-i18n="panel.ray.header">入射光線</span><span class="chevron">▾</span></div>
            <div class="card-body">
                <div class="slider-row">
                    <div class="slider-head">
                        <label data-i18n="panel.ray.posX">入射位置 (X)</label>
                        <span class="val" id="posXValue">200</span>
                    </div>
                    <input type="range" id="incidentX" min="-100" max="700" step="1" value="200">
                </div>
                <div class="slider-row">
                    <div class="slider-head">
                        <label data-i18n="panel.ray.angle">入射角 (θ₁)</label>
                        <span class="val" id="angleValue">45.0°</span>
                    </div>
                    <input type="range" id="incidentAngle" min="0" max="89" step="0.5" value="45">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">👁️ <span data-i18n="panel.view.header">視圖控制</span><span class="chevron">▾</span></div>
            <div class="card-body">
                <div class="toggle-row" id="row-normals">
                    <div class="toggle-track on" id="opt-normals"><div class="toggle-thumb"></div></div>
                    <span data-i18n="panel.view.normals">顯示法線</span>
                </div>
                <div class="toggle-row" id="row-angles">
                    <div class="toggle-track on" id="opt-angles"><div class="toggle-thumb"></div></div>
                    <span data-i18n="panel.view.angles">顯示角度</span>
                </div>
                <div class="slider-row" style="margin-top:10px;">
                    <div class="slider-head">
                        <label data-i18n="panel.view.zoom">縮放:</label>
                        <span class="val" id="zoomValueUI">1.0x</span>
                    </div>
                    <input type="range" id="zoomSlider" min="0.2" max="2.5" step="0.1" value="1">
                </div>
                <div class="action-row" style="margin-top:10px;">
                    <button type="button" class="action-btn btn-reset" id="resetViewBtn" data-i18n="panel.view.center">置中視角</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">🧪 <span data-i18n="panel.layers.header">介質層設定區 (最多 14 層)</span><span class="chevron">▾</span></div>
            <div class="card-body">
                <div class="action-row">
                    <button type="button" class="action-btn btn-reset" id="addLayerBtn" data-i18n="panel.layers.add">＋ 新增介質</button>
                </div>
                <div class="lc-head">
                    <div class="lr-idx" data-i18n="panel.layers.colIdx">層數</div>
                    <div class="lr-name" data-i18n="panel.layers.colName">介質名稱</div>
                    <div class="lc-slider" data-i18n="panel.layers.colSlider">折射率 (n) 微調滑桿</div>
                    <div class="lc-n" data-i18n="panel.layers.colVal">數值</div>
                </div>
                <div id="layersContainer"></div>
            </div>
        </div>
    </div>

    <!-- ═══════════ 中央 2D 畫布 ═══════════ -->
    <div id="canvas-wrap">
        <canvas id="simCanvas" width="800" height="680"></canvas>
        <div id="hint" data-i18n="hint.pan">拖動畫面可平移，滾輪可放大縮小</div>
    </div>
</div>

<!-- ═══════════ 頁面字典（zh 必填；en 缺字自動回退 zh） ═══════════ -->
<script>
PhysLab.i18n.register({
    zh: {
        'topbar.title': '多層折射模擬器',
        'topbar.subtitle': 'HKDSE Physics · Book 3 · Chapter 2 · 多層折射與海市蜃樓',
        'topbar.controls': '控制',
        'panel.presets.header': '快速預設',
        'panel.presets.mirage': '🏜️ 海市蜃樓成因',
        'panel.presets.reset': '↩️ 還原基礎三層',
        'panel.ray.header': '入射光線',
        'panel.ray.posX': '入射位置 (X)',
        'panel.ray.angle': '入射角 (θ₁)',
        'panel.view.header': '視圖控制',
        'panel.view.normals': '顯示法線',
        'panel.view.angles': '顯示角度',
        'panel.view.zoom': '縮放:',
        'panel.view.center': '置中視角',
        'panel.layers.header': '介質層設定區 (最多 14 層)',
        'panel.layers.add': '＋ 新增介質',
        'panel.layers.colIdx': '層數',
        'panel.layers.colName': '介質名稱',
        'panel.layers.colSlider': '折射率 (n) 微調滑桿',
        'panel.layers.colVal': '數值',
        'panel.layers.max': '已達到最大限制 14 層。',
        'panel.layers.del': '刪除此層',
        'layer.air': '空氣 (Air)',
        'layer.water': '水 (Water)',
        'layer.glass': '玻璃 (Glass)',
        'layer.custom': '自訂介質',
        'layer.coldTop': '冷空氣(頂)',
        'layer.hotBottom': '熱空氣(底)',
        'layer.airN': '空氣層 {n}',
        'hint.pan': '拖動畫面可平移，滾輪可放大縮小',
        'canvas.tir': 'TIR 全內反射'
    },
    en: {}
});
</script>

<!-- ═══════════ 頁面邏輯（多層折射光線追蹤／canvas 繪圖逐字保留自原頁） ═══════════ -->
<script>
    const t = (k, p) => PhysLab.i18n.t(k, p);

    // 初始狀態
    let state = {
        incidentAngle: 45,
        incidentX: 200,
        offsetX: 0,
        offsetY: 0,
        scale: 1.0,
        showNormals: true,
        showAngles: true,
        layers: [],
        nextId: 1
    };

    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const angleSlider = document.getElementById('incidentAngle');
    const angleValue = document.getElementById('angleValue');
    const posSlider = document.getElementById('incidentX');
    const posValue = document.getElementById('posXValue');
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomValueUI = document.getElementById('zoomValueUI');
    const layersContainer = document.getElementById('layersContainer');
    const addLayerBtn = document.getElementById('addLayerBtn');
    const optNormals = document.getElementById('opt-normals');
    const optAngles = document.getElementById('opt-angles');
    const resetViewBtn = document.getElementById('resetViewBtn');

    let isDragging = false; let dragStartX = 0; let dragStartY = 0;

    // 開關列 UI 與 state 同步（預設載入時亦呼叫）
    function refreshToggles() {
        optNormals.classList.toggle('on', state.showNormals);
        optAngles.classList.toggle('on', state.showAngles);
    }

    function init() {
        loadDefaultPreset(); // 預設加載基礎三層（須先於 bindSlider — 綁定時即觸發一次 draw）

        PhysLab.ui.bindSlider('incidentAngle', 'angleValue', (v) => {
            state.incidentAngle = v; draw(); return v.toFixed(1) + '°';
        });
        PhysLab.ui.bindSlider('incidentX', 'posXValue', (v) => {
            state.incidentX = v; draw(); return String(v);
        });
        PhysLab.ui.bindSlider('zoomSlider', 'zoomValueUI', (v) => {
            state.scale = v; draw(); return v.toFixed(1) + 'x';
        });

        document.getElementById('row-normals').addEventListener('click', () => {
            state.showNormals = !state.showNormals; refreshToggles(); draw();
        });
        document.getElementById('row-angles').addEventListener('click', () => {
            state.showAngles = !state.showAngles; refreshToggles(); draw();
        });

        resetViewBtn.addEventListener('click', () => {
            state.offsetX = 0; state.offsetY = 0; state.scale = 1.0;
            zoomSlider.value = 1.0; zoomValueUI.textContent = '1.0x';
            draw();
        });

        document.getElementById('miragePresetBtn').addEventListener('click', loadMiragePreset);
        document.getElementById('defaultPresetBtn').addEventListener('click', loadDefaultPreset);

        addLayerBtn.addEventListener('click', () => {
            if (state.layers.length >= 14) { alert(t('panel.layers.max')); return; }
            state.layers.push({ id: state.nextId++, n: 1.50, nameKey: 'layer.custom' });
            renderLayerControls(); draw();
        });

        // 畫布滑鼠事件
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            let newScale = state.scale - Math.sign(e.deltaY) * 0.1;
            newScale = Math.max(0.2, Math.min(newScale, 2.5));
            state.scale = newScale;
            zoomSlider.value = state.scale; zoomValueUI.textContent = state.scale.toFixed(1) + 'x';
            draw();
        }, {passive: false});

        canvas.addEventListener('mousedown', (e) => { isDragging = true; dragStartX = e.clientX - state.offsetX; dragStartY = e.clientY - state.offsetY; canvas.classList.add('grabbing-cursor'); });
        window.addEventListener('mouseup', () => { isDragging = false; canvas.classList.remove('grabbing-cursor'); });
        window.addEventListener('mousemove', (e) => { if (!isDragging) return; state.offsetX = e.clientX - dragStartX; state.offsetY = e.clientY - dragStartY; draw(); });

        // 面板開關（畫布為 CSS 等比縮放，切換後重繪即可）
        PhysLab.ui.bindPanelToggle('btn-toggle-left', 'left-panel', draw);

        // 語言切換：介質名稱／刪除鈕 title 由 renderLayerControls 重生，
        // 畫布內 TIR 文字靠重繪刷新
        PhysLab.i18n.onChange(() => { renderLayerControls(); draw(); });
    }

    // 1. 還原基礎三層（關閉海市蜃樓）
    function loadDefaultPreset() {
        state.layers = [
            { id: 1, n: 1.00, nameKey: 'layer.air' },
            { id: 2, n: 1.33, nameKey: 'layer.water' },
            { id: 3, n: 1.50, nameKey: 'layer.glass' }
        ];
        state.nextId = 4;
        state.incidentAngle = 45;
        state.incidentX = 200;
        state.scale = 1.0;
        state.offsetX = 0;
        state.offsetY = 0;

        // 還原顯示標籤
        state.showNormals = true;
        state.showAngles = true;
        refreshToggles();

        // 更新 UI
        angleSlider.value = 45; angleValue.textContent = '45.0°';
        posSlider.value = 200; posValue.textContent = '200';
        zoomSlider.value = 1.0; zoomValueUI.textContent = '1.0x';

        renderLayerControls(); draw();
    }

    // 2. 一鍵展示海市蜃樓
    function loadMiragePreset() {
        state.layers = [];
        let n_start = 1.28;
        for(let i=0; i<14; i++) {
            let n_val = n_start - (i * 0.02);
            let nameKey = i === 0 ? 'layer.coldTop' : (i === 13 ? 'layer.hotBottom' : 'layer.airN');
            state.layers.push({ id: i+1, n: n_val, nameKey: nameKey, nameParams: (i === 0 || i === 13) ? undefined : { n: i+1 } });
        }
        state.nextId = 15;

        state.incidentAngle = 68;
        state.incidentX = 40;
        state.scale = 0.55;
        state.offsetX = -80;
        state.offsetY = -40;

        // 教學考量：暫時隱藏法線與角度，凸顯光線平滑曲線
        state.showNormals = false;
        state.showAngles = false;
        refreshToggles();

        angleSlider.value = state.incidentAngle; angleValue.textContent = state.incidentAngle.toFixed(1) + '°';
        posSlider.value = state.incidentX; posValue.textContent = state.incidentX;
        zoomSlider.value = state.scale; zoomValueUI.textContent = state.scale.toFixed(1) + 'x';

        renderLayerControls(); draw();
    }

    // 高密度、緊湊型的介質層控制列（名稱經 t() 取值，語言切換時整批重生）
    function renderLayerControls() {
        layersContainer.innerHTML = '';
        state.layers.forEach((layer, index) => {
            const row = document.createElement('div');
            row.className = 'layer-row';
            const layerName = t(layer.nameKey, layer.nameParams);
            row.innerHTML = `
                <div class="lr-idx">${index + 1}</div>
                <div class="lr-name" title="${layerName}" id="name_val_${layer.id}">${layerName}</div>
                <input type="range" min="1.0" max="2.5" step="0.01" value="${layer.n}"
                    oninput="updateLayerN(${layer.id}, this.value)">
                <div class="lr-n">${layer.n.toFixed(2)}</div>
                ${state.layers.length > 1 ? `
                    <button type="button" class="lr-del" title="${t('panel.layers.del')}" onclick="removeLayer(${layer.id})">✕</button>
                ` : ''}
            `;
            layersContainer.appendChild(row);
        });
    }

    window.updateLayerN = function(id, value) {
        const layer = state.layers.find(l => l.id === id);
        if (layer) {
            layer.n = parseFloat(value);

            // 動態名稱命名（當用戶手動拉動非海市蜃樓層時，進行標準標籤變更）
            if (layer.nameKey !== 'layer.airN' && layer.nameKey !== 'layer.coldTop' && layer.nameKey !== 'layer.hotBottom') {
                if(layer.n === 1.00) layer.nameKey = 'layer.air';
                else if(layer.n === 1.33) layer.nameKey = 'layer.water';
                else if(layer.n === 1.50) layer.nameKey = 'layer.glass';
                else layer.nameKey = 'layer.custom';
            }

            renderLayerControls(); // 刷新數值與名稱顯示
            draw();
        }
    };

    window.removeLayer = function(id) {
        state.layers = state.layers.filter(l => l.id !== id);
        renderLayerControls();
        draw();
    };

    // 渲染繪圖邏輯（保持高效及適配多層高厚度）
    function drawText(text, x, y, textColor = '#1e293b') { ctx.font = '600 12px system-ui, sans-serif'; ctx.fillStyle = textColor; ctx.fillText(text, x, y); }
    function drawNormal(x, yStart, yEnd, scale) { ctx.save(); ctx.beginPath(); ctx.setLineDash([5 / scale, 5 / scale]); ctx.moveTo(x, yStart); ctx.lineTo(x, yEnd); ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.2 / scale; ctx.stroke(); ctx.restore(); }

    function drawArrow(x1, y1, x2, y2, scale) {
        const headlen = 10 / scale; const angle = Math.atan2(y2 - y1, x2 - x1);
        let midX = (x1 + x2) / 2; let midY = (y1 + y2) / 2;
        const dist = Math.hypot(x2 - x1, y2 - y1);
        if (dist > 5000) {
            let targetDist = dist / 2;
            if (y1 <= -10000) targetDist = dist - 150 / scale;
            else if (y2 >= 10000) targetDist = 150 / scale;
            else if (y2 <= -10000) targetDist = 150 / scale;
            midX = x1 + (x2 - x1) * (targetDist / dist); midY = y1 + (y2 - y1) * (targetDist / dist);
        }
        ctx.beginPath(); ctx.moveTo(midX, midY);
        ctx.lineTo(midX - headlen * Math.cos(angle - Math.PI / 7), midY - headlen * Math.sin(angle - Math.PI / 7));
        ctx.moveTo(midX, midY); ctx.lineTo(midX - headlen * Math.cos(angle + Math.PI / 7), midY - headlen * Math.sin(angle + Math.PI / 7));
        ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2.2 / scale; ctx.stroke();
    }

    function draw() {
        const width = canvas.width; const height = canvas.height;
        const numLayers = state.layers.length;
        const layerHeight = height / Math.min(numLayers, 7); // 超過 7 層時限制單層最小高度，由 Zoom 和平移查看全貌

        ctx.clearRect(0, 0, width, height);
        ctx.save();
        ctx.translate(state.offsetX, state.offsetY);
        ctx.translate(width / 2, height / 2);
        ctx.scale(state.scale, state.scale);
        ctx.translate(-width / 2, -height / 2);

        // 繪製各介質背景
        state.layers.forEach((layer, index) => {
            const y = index * layerHeight;
            let drawY = y; let drawHeight = layerHeight;
            if (index === 0) { drawY = -20000; drawHeight = y + 20000; }
            if (index === numLayers - 1) { drawHeight = 20000; }
            if (numLayers === 1) { drawY = -20000; drawHeight = 40000; }

            let alpha = Math.max(0, Math.min(0.7, (layer.n - 1.0) * 0.3));
            if (numLayers > 7) { alpha = index / numLayers * 0.22 + 0.02; }

            ctx.fillStyle = `rgba(14, 165, 233, ${alpha})`;
            ctx.fillRect(-20000, drawY, 40000, drawHeight);

            if (index > 0) {
                ctx.beginPath(); ctx.moveTo(-20000, y); ctx.lineTo(20000, y);
                ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1.5 / state.scale; ctx.stroke();
            }
        });

        // 光線追蹤引擎
        const raySegments = []; const boundaries = [];
        let currentAngleRad = state.incidentAngle * Math.PI / 180;
        let dirY = 1; let layerIndex = 0;
        let startY = -20000;
        let startX = state.incidentX - (0 - startY) * Math.tan(currentAngleRad);
        raySegments.push({ x1: startX, y1: startY, x2: state.incidentX, y2: 0 });

        let currentX = state.incidentX; let currentY = 0;

        for (let i = 0; i < 120; i++) {
            const layer = state.layers[layerIndex];
            let isBottomEscape = (dirY === 1 && layerIndex === numLayers - 1);
            let isTopEscape = (dirY === -1 && layerIndex === 0);

            let nextY;
            if (isBottomEscape) { nextY = 20000; }
            else if (isTopEscape) { nextY = -20000; }
            else { nextY = dirY === 1 ? (layerIndex + 1) * layerHeight : layerIndex * layerHeight; }

            const deltaY = Math.abs(nextY - currentY);
            const dx = deltaY * Math.tan(currentAngleRad);
            const nextX = currentX + dx;

            raySegments.push({ x1: currentX, y1: currentY, x2: nextX, y2: nextY });
            if (isBottomEscape || isTopEscape) break;

            const nextLayerIndex = layerIndex + dirY;
            const n1 = layer.n; const n2 = state.layers[nextLayerIndex].n;
            const sinTheta2 = (n1 / n2) * Math.sin(currentAngleRad);

            if (sinTheta2 > 1) { // 全內反射
                boundaries.push({ x: nextX, y: nextY, angleIn: currentAngleRad, angleOut: currentAngleRad, isTIR: true, dirY: dirY });
                dirY = -dirY;
            } else { // 折射
                const nextAngleRad = Math.asin(sinTheta2);
                boundaries.push({ x: nextX, y: nextY, angleIn: currentAngleRad, angleOut: nextAngleRad, isTIR: false, dirY: dirY });
                currentAngleRad = nextAngleRad; layerIndex = nextLayerIndex;
            }
            currentX = nextX; currentY = nextY;
        }

        // 繪製光流
        raySegments.forEach(seg => {
            ctx.beginPath(); ctx.moveTo(seg.x1, seg.y1); ctx.lineTo(seg.x2, seg.y2);
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2.5 / state.scale; ctx.stroke();
            drawArrow(seg.x1, seg.y1, seg.x2, seg.y2, state.scale);
        });

        // 繪製交界面物理數據
        boundaries.forEach(b => {
            if (state.showNormals) drawNormal(b.x, b.y - 40, b.y + 40, state.scale);
            if (state.showAngles) {
                const r = 30; ctx.strokeStyle = '#475569'; ctx.lineWidth = 1.2 / state.scale;
                if (b.dirY === 1) {
                    if (b.angleIn > 0.01) { ctx.beginPath(); ctx.arc(b.x, b.y, r, -Math.PI/2, -Math.PI/2 - b.angleIn, true); ctx.stroke(); drawText(`${(b.angleIn * 180 / Math.PI).toFixed(1)}°`, b.x - 12 - Math.sin(b.angleIn / 2) * (r+4), b.y - Math.cos(b.angleIn / 2) * (r+4)); }
                    if (b.isTIR) { ctx.beginPath(); ctx.arc(b.x, b.y, r + 6, -Math.PI/2, -Math.PI/2 + b.angleOut, false); ctx.stroke(); drawText(`${(b.angleOut * 180 / Math.PI).toFixed(1)}°`, b.x + 5 + Math.sin(b.angleOut / 2) * (r+4), b.y - Math.cos(b.angleOut / 2) * (r+4)); drawText(t('canvas.tir'), b.x + 18, b.y - 35, '#ea580c'); }
                    else if (b.angleOut > 0.01) { ctx.beginPath(); ctx.arc(b.x, b.y, r, Math.PI/2, Math.PI/2 - b.angleOut, true); ctx.stroke(); drawText(`${(b.angleOut * 180 / Math.PI).toFixed(1)}°`, b.x + 5 + Math.sin(b.angleOut / 2) * (r+4), b.y + 8 + Math.cos(b.angleOut / 2) * (r+4)); }
                } else {
                    if (b.angleIn > 0.01) { ctx.beginPath(); ctx.arc(b.x, b.y, r, Math.PI/2, Math.PI/2 + b.angleIn, false); ctx.stroke(); drawText(`${(b.angleIn * 180 / Math.PI).toFixed(1)}°`, b.x - 12 - Math.sin(b.angleIn / 2) * (r+4), b.y + 8 + Math.cos(b.angleIn / 2) * (r+4)); }
                    if (b.isTIR) { ctx.beginPath(); ctx.arc(b.x, b.y, r + 6, Math.PI/2, Math.PI/2 - b.angleOut, true); ctx.stroke(); drawText(`${(b.angleOut * 180 / Math.PI).toFixed(1)}°`, b.x + 5 + Math.sin(b.angleOut / 2) * (r+4), b.y + 8 + Math.cos(b.angleOut / 2) * (r+4)); drawText(t('canvas.tir'), b.x + 18, b.y + 45, '#ea580c'); }
                    else if (b.angleOut > 0.01) { ctx.beginPath(); ctx.arc(b.x, b.y, r, -Math.PI/2, -Math.PI/2 + b.angleOut, false); ctx.stroke(); drawText(`${(b.angleOut * 180 / Math.PI).toFixed(1)}°`, b.x + 5 + Math.sin(b.angleOut / 2) * (r+4), b.y - Math.cos(b.angleOut / 2) * (r+4)); }
                }
            }
        });
        ctx.restore();

        // 漂浮在畫布左側的折射率數值
        state.layers.forEach((layer, index) => {
            let topWorldY = index === 0 ? -20000 : index * layerHeight;
            let bottomWorldY = index === state.layers.length - 1 ? 20000 : (index + 1) * layerHeight;
            let screenTop = (topWorldY - height / 2) * state.scale + height / 2 + state.offsetY;
            let screenBottom = (bottomWorldY - height / 2) * state.scale + height / 2 + state.offsetY;
            if (screenBottom > 0 && screenTop < height) {
                let textY = screenTop > 0 ? screenTop + 20 : 20;
                textY = Math.min(textY, screenBottom - 10);
                ctx.fillStyle = '#475569'; ctx.font = 'bold 11px font-mono';
                ctx.fillText(`n=${layer.n.toFixed(2)}`, 10, textY);
            }
        });
    }

    init();
</script>
</body>
</html>
