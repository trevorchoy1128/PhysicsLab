<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDSE 物理 - 3D 電場線與完美對稱模擬器</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
    <script src="../../../assets/js/core.js"></script>
    <script src="../../../assets/js/i18n.js"></script>
    <script src="../../../assets/js/quiz.js"></script>
    <script src="../../../assets/js/sim3d.js"></script>
    <link rel="stylesheet" href="../../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../../assets/css/labgray.css">
    <style>
        /* ── 頁面獨有樣式（共用 chrome 見 assets/css/labgray.css）── */

        /* 版面鐵律：滿版三欄、面板內卡片不被壓縮（成對使用） */
        body { height: 100vh; overflow: hidden; }
        #left-panel > *, #right-panel > * { flex-shrink: 0; }

        /* 下拉選單（labgray 無 select 規則；沿用 plane-mirror 的 .shape-select 做法） */
        .shape-select {
            width: 100%; padding: 8px 10px; border-radius: 8px;
            border: 1px solid var(--pl-border); background: var(--pl-inset);
            color: var(--pl-text-dim); font-size: 0.78rem; font-weight: 600;
            cursor: pointer;
        }
        .shape-select:hover { border-color: var(--pl-blue); }

        /* 選單上方的說明標籤（卡片內；不影響 .slider-head label / .checkbox-label） */
        .card-body > label { display: block; margin-bottom: 6px; font-size: 0.74rem; color: var(--pl-text-dim); font-weight: 600; }
        .card-body select + label { margin-top: 12px; }

        /* 依模式顯示／隱藏的控制區塊（原 .control-group 拆分） */
        .control-block { margin-top: 12px; }

        /* 滑桿下方灰色小字提示（原 inline font-size:11px 提示） */
        .field-note { font-size: 0.68rem; color: var(--pl-text-faint); margin-top: 4px; line-height: 1.7; }

        /* Q₁／Q₂ 雙滑桿內嵌盒（原 .slider-box 換 --pl-* token） */
        .slider-box { background: var(--pl-inset); padding: 10px; border-radius: 8px; border: 1px solid var(--pl-border-soft); margin-bottom: 6px; }
        .slider-box .slider-row { margin-bottom: 0; }

        /* 中和點核取（沿用原版綠色強調） */
        .checkbox-label { display: flex; align-items: center; font-size: 0.76rem; color: #16a34a; cursor: pointer; font-weight: 700; }
        .checkbox-label input { margin-right: 8px; cursor: pointer; }

        /* 重置視角按鈕（單頁動作鈕；沿用原版藍色） */
        #resetCameraBtn {
            width: 100%; padding: 10px; border-radius: 8px; border: none;
            background-color: #2563eb; color: #fff; font-weight: 700; font-size: 0.8rem;
            cursor: pointer; transition: 0.3s; box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }
        #resetCameraBtn:hover { filter: brightness(0.92); transform: translateY(-1px); }

        /* 右欄操作指南強調字（原 .instructions span 紅色／平行板提示綠色） */
        .info-box span { color: #dc2626; font-weight: 700; }
        .info-box b { color: var(--pl-text-strong); }
        .info-box .plate-note { color: #059669; }
    </style>
</head>
<body>

    <div id="topbar">
        <div style="display: flex; align-items: center; gap: 16px;">
            <button type="button" class="panel-toggle-btn" id="btn-toggle-left">
                <span>☰</span> <span data-i18n="topbar.controls">控制</span>
            </button>
            <div class="title-block">
                <h1 data-i18n="topbar.title">⚡ 3D 對稱電場線 (E-Field) 模擬器</h1>
                <p data-i18n="topbar.subtitle">HKDSE Physics · Book 4 · Chapter 1 · 電場</p>
            </div>

        <div class="tb-actions">

        <div id="left-panel">
            <div class="card">
                <div class="card-header">⚡ <span data-i18n="panel.charge.header">電荷系統</span><span class="chevron">▾</span></div>
                <div class="card-body">
                    <label data-i18n="panel.charge.mode">電荷系統模式：</label>
                    <select id="modeSelect" class="shape-select">
                        <option value="singlePos" selected data-i18n="panel.charge.modeSinglePos">單一正電荷</option>
                        <option value="singleNeg" data-i18n="panel.charge.modeSingleNeg">單一負電荷</option>

                        <option value="like" data-i18n="panel.charge.modeLike">雙電荷自由控制</option>
                        <option value="plates" data-i18n="panel.charge.modePlates">平行電板</option>

                        <div class="slider-row">
                            <div class="slider-head">
                                <label data-i18n="panel.charge.qLabel">電荷電量 Magnitude (Q) :</label>
                                <span class="val" id="qValue">1</span>
                            </div>
                            <input type="range" id="qSlider" min="1" max="5" value="1">
                        </div>
                        <div class="field-note" data-i18n="panel.charge.qNote">* 電量增加時，電場強度與場線密度將同步增加</div>
                    </div>

                    <div class="control-block" id="qLikeControl" style="display: none;">
                        <div class="slider-box">
                            <div class="slider-row">
                                <div class="slider-head">
                                    <label data-i18n="panel.charge.q1Label">電荷 1 電量 (Q₁) :</label>
                                    <span class="val" id="q1Value">1</span>
                                </div>
                                <input type="range" id="q1Slider" min="-5" max="5" value="1">
                            </div>
                        </div>
                        <div class="slider-box">
                            <div class="slider-row">
                                <div class="slider-head">
                                    <label data-i18n="panel.charge.q2Label">電荷 2 電量 (Q₂) :</label>
                                    <span class="val" id="q2Value">1</span>
                                </div>
                                <input type="range" id="q2Slider" min="-5" max="5" value="1">

                        </div>
                        <div class="field-note" data-i18n-html="panel.charge.likeNote">* 支援負數 (例如 -2 與 -3)，可測試負負相斥。<br>* 觀察中和點 (E=0) 會偏向電量較弱的一方。</div>
                    </div>

                    <div class="control-block" id="plateDistControl" style="display: none;">
                        <div class="slider-row">
                            <div class="slider-head">
                                <label data-i18n="panel.charge.plateDist">平行板距離 (Distance) :</label>
                                <span class="val" id="plateDistValue">16</span>
                            </div>
                            <input type="range" id="plateDistSlider" min="8" max="26" value="16">
                        </div>
                    </div>

                    <div class="control-block" id="neutralControl" style="display: none;">
                        <label class="checkbox-label">
                            <input type="checkbox" id="neutralToggle" checked> <span data-i18n="panel.charge.neutralToggle">顯示精準中和點 (E=0)</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">🌐 <span data-i18n="panel.field.header">場線顯示</span><span class="chevron">▾</span></div>
                <div class="card-body">
                    <label data-i18n="panel.field.dimension">空間分佈模式：</label>
                    <select id="dimensionSelect" class="shape-select">
                        <option value="2D" selected data-i18n="panel.field.dim2D">2D 截面 (教科書標準平面)</option>
                        <option value="3D" data-i18n="panel.field.dim3D">3D 均勻發射 (真實立體打斜分佈)</option>
                    </select>
                    <label data-i18n="panel.field.density">電場線密度：</label>
                    <select id="densitySelect" class="shape-select">
                        <option value="sparse" data-i18n="panel.field.denSparse">稀疏 (Sparse)</option>
                        <option value="standard" selected data-i18n="panel.field.denStandard">標準 (Standard)</option>
                        <option value="dense" data-i18n="panel.field.denDense">密集 (Dense)</option>
                    </select>
                </div>
            </div>

            <div class="card">
                <div class="card-header">🎥 <span data-i18n="panel.view.header">視角控制</span><span class="chevron">▾</span></div>
                <div class="card-body">
                    <button type="button" id="resetCameraBtn" data-i18n="panel.view.reset">重置視角 (Top View)</button>
                </div>
            </div>
        </div>

        <div id="canvas-wrap">
            <div id="view3d"></div>
        </div>

        <div id="right-panel">
            <div class="guide-box">
                <h4>📘 <span data-i18n="info.guide.header">操作指南</span></h4>
                <div class="info-box" data-i18n-html="info.guide.body">
                    <b>操作指南：</b><br>
                    • 滑鼠 <span>左鍵拖曳背景</span> 旋轉 3D 視角。<br>

                </div>
            </div>
        </div>
    </div>

<script>

<script>
PhysLab.sim3d.ready(function () {
    let sim = null; // PhysLab.sim3d.create() 場景上下文
    let scene, camera, renderer, orbitControls, dragControls;
    let chargesData = [];
    let chargesGroup = new THREE.Group();
    let fieldLinesGroup = new THREE.Group();
    let neutralMarker = null;

    // 物理全域變數
    const K = 10;
    let chargeQ = 1;
    let chargeQ1 = 1;
    let chargeQ2 = 1;
    const STANDARD_RADIUS = 1.2;

    // 中和點結界防護面
    let neutralBoundary = null;

    function init() {
        const container = document.getElementById('view3d');

        // 本頁原版場景值（與共用預設不同者全部顯式傳入）：
        //   背景 0xf8fafc（非 0xe2e6eb）、fov 45（非 42）、far 1000（非 200）、
        //   相機 (0,0,48) → (0,0,0)、damping 0.05（非 0.07）、無網格
        sim = PhysLab.sim3d.create(container, {
            background: 0xf8fafc,
            fov: 45, near: 0.1, far: 1000,
            views: { default: { pos: [0, 0, 48], tgt: [0, 0, 0] } },
            controls: { damping: 0.05 },
            lights: false,
            grid: false
        });
        scene = sim.scene;
        camera = sim.camera;
        renderer = sim.renderer;
        orbitControls = sim.controls;

        scene.add(chargesGroup);
        scene.add(fieldLinesGroup);

        // 原版光源：Ambient 0.9 ＋ 單一主光 0.4 @ (5,15,20)，無補光
        PhysLab.sim3d.addLabLights(scene, { ambient: 0.9, key: 0.4, keyPos: [5, 15, 20], fill: false });
        // 原版不封頂 devicePixelRatio（create 預設封頂 2）；resize 讓新比例生效
        renderer.setPixelRatio(window.devicePixelRatio);
        sim.resize();

        // 面板收合 → 重算畫布尺寸
        PhysLab.ui.bindPanelToggle('btn-toggle-left', 'left-panel', function () { sim.resize(); });
        PhysLab.ui.bindPanelToggle('btn-toggle-right', 'right-panel', function () { sim.resize(); });

        document.getElementById('modeSelect').addEventListener('change', buildScene);

        document.getElementById('dimensionSelect').addEventListener('change', () => {
            if (document.getElementById('modeSelect').value === 'plates') buildScene();
            else generateFieldLines();
        });

        document.getElementById('densitySelect').addEventListener('change', generateFieldLines);
        document.getElementById('neutralToggle').addEventListener('change', updateNeutralPoint);

        document.getElementById('qSlider').addEventListener('input', (e) => {
            chargeQ = parseInt(e.target.value);
            document.getElementById('qValue').innerText = chargeQ;
            buildScene();
        });

        document.getElementById('q1Slider').addEventListener('input', (e) => {
            let val = parseInt(e.target.value);
            if (val === 0) val = e.target.value = (chargeQ1 > 0 ? -1 : 1);
            chargeQ1 = val;
            document.getElementById('q1Value').innerText = chargeQ1;
            buildScene();
        });

        document.getElementById('q2Slider').addEventListener('input', (e) => {
            let val = parseInt(e.target.value);
            if (val === 0) val = e.target.value = (chargeQ2 > 0 ? -1 : 1);
            chargeQ2 = val;
            document.getElementById('q2Value').innerText = chargeQ2;
            buildScene();
        });

        document.getElementById('plateDistSlider').addEventListener('input', (e) => {
            document.getElementById('plateDistValue').innerText = e.target.value;
            buildScene();
        });

        // 原版：camera.position.set(0,0,48) + lookAt/target(0,0,0) + update → 即 default 視角
        document.getElementById('resetCameraBtn').addEventListener('click', () => sim.setView('default'));

        // 語言切換：就地重繪中和點 sprite 文字（不重建場景、不動電荷位置）
        PhysLab.i18n.onChange(function () {
            if (neutralMarker && neutralMarker.userData.setText) {
                neutralMarker.userData.setText(PhysLab.i18n.t('label3d.neutral'));
            }
        });

        buildScene();
        sim.start(tick);
    }

    function createChargeMaterial(sign) {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = sign === '+' ? '#ef4444' : '#3b82f6';
        ctx.fillRect(0, 0, 256, 256);

        ctx.fillStyle = 'white';
        ctx.font = 'bold 160px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(sign, 128, 140);

        return new THREE.MeshPhongMaterial({ map: new THREE.CanvasTexture(canvas), shininess: 50 });
    }

    const matPos = createChargeMaterial('+');
    const matNeg = createChargeMaterial('-');

    function drawNeutralCanvas(text) {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');

        ctx.beginPath();
        ctx.arc(128, 128, 28, 0, Math.PI * 2);
        ctx.fillStyle = '#16a34a';
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.fillStyle = '#16a34a';
        ctx.font = 'bold 36px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(text, 128, 175);
        return canvas;
    }

    function createNeutralMarker() {
        const marker = new THREE.Sprite(new THREE.SpriteMaterial({
            map: new THREE.CanvasTexture(drawNeutralCanvas(PhysLab.i18n.t('label3d.neutral'))),
            depthTest: false
        }));
        marker.scale.set(4, 4, 1);
        // 供語言切換就地改字（同 sim3d makeSprite 的 userData.setText 慣例）
        marker.userData.setText = function (newText) {
            if (marker.material.map) marker.material.map.dispose();
            marker.material.map = new THREE.CanvasTexture(drawNeutralCanvas(newText));
            marker.material.needsUpdate = true;
        };
        return marker;
    }

    function addCharge(x, y, z, sign, radius, magnitude) {
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 32), sign > 0 ? matPos : matNeg);
        mesh.position.set(x, y, z);
        chargesGroup.add(mesh);
        chargesData.push({ mesh: mesh, sign: sign, radius: radius, q: magnitude * sign });
    }

    function toggleUI() {
        const mode = document.getElementById('modeSelect').value;
        document.getElementById('plateDistControl').style.display = (mode === 'plates') ? 'block' : 'none';
        document.getElementById('neutralControl').style.display = (mode === 'like') ? 'block' : 'none';

        if (mode === 'like') {
            document.getElementById('qSingleControl').style.display = 'none';
            document.getElementById('qLikeControl').style.display = 'block';
        } else {
            document.getElementById('qSingleControl').style.display = 'block';
            document.getElementById('qLikeControl').style.display = 'none';
        }
    }

    function buildScene() {
        toggleUI();
        const mode = document.getElementById('modeSelect').value;
        const dimension = document.getElementById('dimensionSelect').value;

        while(chargesGroup.children.length > 0) chargesGroup.remove(chargesGroup.children[0]);
        chargesData = [];
        if (neutralMarker) { scene.remove(neutralMarker); neutralMarker = null; }
        neutralBoundary = null;

        neutralMarker = createNeutralMarker();
        scene.add(neutralMarker);

        const offset = 8;
        if (mode === 'singlePos') {
            addCharge(0, 0, 0, 1, STANDARD_RADIUS, chargeQ);
        } else if (mode === 'singleNeg') {
            addCharge(0, 0, 0, -1, STANDARD_RADIUS, chargeQ);
        } else if (mode === 'dipole') {
            addCharge(-offset, 0, 0, 1, STANDARD_RADIUS, chargeQ);
            addCharge(offset, 0, 0, -1, STANDARD_RADIUS, chargeQ);
        } else if (mode === 'like') {
            let sign1 = chargeQ1 < 0 ? -1 : 1;
            let sign2 = chargeQ2 < 0 ? -1 : 1;
            addCharge(-offset, 0, 0, sign1, STANDARD_RADIUS, Math.abs(chargeQ1));
            addCharge(offset, 0, 0, sign2, STANDARD_RADIUS, Math.abs(chargeQ2));
        } else if (mode === 'plates') {
            let numCharges = 40 + chargeQ * 10;
            let plateRadius = 0.15;
            let spacing = 20 / (numCharges - 1);
            let halfDist = parseInt(document.getElementById('plateDistSlider').value) / 2;

            let z_layers = dimension === '3D' ? [-2, 0, 2] : [0];
            z_layers.forEach(z => {
                for(let i = 0; i < numCharges; i++) {
                    let y = -10 + i * spacing;
                    addCharge(-halfDist, y, z, 1, plateRadius, chargeQ);
                    addCharge(halfDist, y, z, -1, plateRadius, chargeQ);
                }
            });
        }

        setupDragControls(mode);
        updateNeutralPoint();
        generateFieldLines();
    }

    function setupDragControls(mode) {
        if(dragControls) dragControls.dispose();
        if (mode === 'plates') return;

        // DragControls 以 renderer.domElement 為事件源；r128 內部已用
        // domElement.getBoundingClientRect() 換算 NDC，畫布唔滿版亦正確
        dragControls = new THREE.DragControls(chargesData.map(c => c.mesh), camera, renderer.domElement);

        dragControls.addEventListener('dragstart', () => {
            orbitControls.enabled = false;
            document.body.style.cursor = 'grabbing';
        });

        dragControls.addEventListener('drag', (event) => {
            event.object.position.z = 0;

            const MIN_DIST = STANDARD_RADIUS * 2.15;

            chargesData.forEach(c => {
                if (c.mesh !== event.object) {
                    let dist = event.object.position.distanceTo(c.mesh.position);
                    if (dist < MIN_DIST) {
                        let pushVec = new THREE.Vector3().subVectors(event.object.position, c.mesh.position);
                        if(pushVec.lengthSq() === 0) pushVec.set(1, 0, 0);
                        pushVec.normalize();

                        event.object.position.copy(c.mesh.position).add(pushVec.multiplyScalar(MIN_DIST));
                    }
                }
            });

            chargesData.forEach(c => c.mesh.position.z = 0);

            updateNeutralPoint();
            generateFieldLines();
        });

        dragControls.addEventListener('dragend', () => {
            orbitControls.enabled = true;
            document.body.style.cursor = 'default';
        });
    }

    function getElectricField(pos) {
        let Ex = 0, Ey = 0, Ez = 0;
        const px = pos.x, py = pos.y, pz = pos.z;

        for (let i = 0, len = chargesData.length; i < len; i++) {
            const c = chargesData[i];
            const dx = px - c.mesh.position.x;
            const dy = py - c.mesh.position.y;
            const dz = pz - c.mesh.position.z;
            const distSq = dx*dx + dy*dy + dz*dz;

            if (distSq < 0.05) continue;

            const mag = (c.q * K) / (distSq * Math.sqrt(distSq));
            Ex += dx * mag;
            Ey += dy * mag;
            Ez += dz * mag;
        }
        return new THREE.Vector3(Ex, Ey, Ez);
    }

    function updateNeutralPoint() {
        if(!neutralMarker) return;
        const mode = document.getElementById('modeSelect').value;
        neutralBoundary = null;

        if (!document.getElementById('neutralToggle').checked || mode !== 'like') {
            neutralMarker.visible = false; return;
        }

        let p1 = chargesData[0].mesh.position;
        let p2 = chargesData[1].mesh.position;
        let q1 = chargesData[0].q;
        let q2 = chargesData[1].q;

        if (Math.sign(q1) !== Math.sign(q2)) {
            neutralMarker.visible = false;
            return;
        }

        let sq1 = Math.sqrt(Math.abs(q1));
        let sq2 = Math.sqrt(Math.abs(q2));
        let nx = (p2.x * sq1 + p1.x * sq2) / (sq1 + sq2);
        let ny = (p2.y * sq1 + p1.y * sq2) / (sq1 + sq2);
        let nz = (p2.z * sq1 + p1.z * sq2) / (sq1 + sq2);
        let exactMid = new THREE.Vector3(nx, ny, nz);

        neutralMarker.position.copy(exactMid);
        neutralMarker.visible = true;

        neutralBoundary = {
            point: exactMid,
            normal: new THREE.Vector3().subVectors(p2, p1).normalize()
        };
    }

    function traceLine(startPos, reverse = false) {
        let points = [startPos.clone()];
        let pos = startPos.clone();
        let h = 0.25;
        let maxSteps = reverse ? 300 : 400;
        let hitPositive = false;

        let startSide = 0;
        if (neutralBoundary) {
            let toStart = new THREE.Vector3().subVectors(startPos, neutralBoundary.point);
            startSide = Math.sign(toStart.dot(neutralBoundary.normal));
        }

        for (let step = 0; step < maxSteps; step++) {
            let E1 = getElectricField(pos);
            if (reverse) E1.negate();

            if (E1.lengthSq() < 0.08) break;

            let k1 = E1.normalize().multiplyScalar(h);
            let p2 = pos.clone().add(k1.clone().multiplyScalar(0.5));
            let E2 = getElectricField(p2); if(reverse) E2.negate();
            let k2 = E2.normalize().multiplyScalar(h);

            let p3 = pos.clone().add(k2.clone().multiplyScalar(0.5));
            let E3 = getElectricField(p3); if(reverse) E3.negate();
            let k3 = E3.normalize().multiplyScalar(h);

            let p4 = pos.clone().add(k3);
            let E4 = getElectricField(p4); if(reverse) E4.negate();
            let k4 = E4.normalize().multiplyScalar(h);

            let move = k1.add(k2.multiplyScalar(2)).add(k3.multiplyScalar(2)).add(k4).multiplyScalar(1/6);
            pos.add(move);
            points.push(pos.clone());

            if (neutralBoundary) {
                let toPos = new THREE.Vector3().subVectors(pos, neutralBoundary.point);
                let currentSide = Math.sign(toPos.dot(neutralBoundary.normal));
                if (currentSide !== startSide && currentSide !== 0) break;
            }

            if (pos.lengthSq() > 6400) break;

            let hit = false;
            for (let i = 0; i < chargesData.length; i++) {
                let c = chargesData[i];
                let dx = pos.x - c.mesh.position.x;
                let dy = pos.y - c.mesh.position.y;
                let dz = pos.z - c.mesh.position.z;

                if ((dx*dx + dy*dy + dz*dz) < c.radius * c.radius) {
                    if (!reverse && c.sign < 0) hit = true;
                    if (reverse && c.sign > 0) {
                        hit = true;
                        hitPositive = true;
                    }
                }
            }
            if (hit) break;
        }
        return { points, hitPositive };
    }

    function generateFieldLines() {
        while(fieldLinesGroup.children.length > 0) fieldLinesGroup.remove(fieldLinesGroup.children[0]);

        const tubeMat = new THREE.MeshPhongMaterial({ color: 0x64748b, shininess: 30 });
        const arrowMat = new THREE.MeshPhongMaterial({ color: 0xf97316 });

        const dimension = document.getElementById('dimensionSelect').value;
        const mode = document.getElementById('modeSelect').value;
        const densityLevel = document.getElementById('densitySelect').value;

        let baseLines = 8;
        if (densityLevel === 'sparse') baseLines = 4;
        else if (densityLevel === 'standard') baseLines = 8;
        else if (densityLevel === 'dense') baseLines = 14;

        let allCurves = [];

        function drawCurve(points, isReverse) {
            if (points.length < 4) return;
            if (isReverse) points.reverse();

            const curve = new THREE.CatmullRomCurve3(points);
            allCurves.push({ curve, length: curve.getLength() });

            const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.min(points.length, 120), 0.05, 6, false), tubeMat);
            fieldLinesGroup.add(tube);
        }

        if (mode === 'plates') {
            let numLines = baseLines * chargeQ;
            let halfDist = parseInt(document.getElementById('plateDistSlider').value) / 2;
            let lineSpacing = 20 / numLines;
            let z_offsets = dimension === '2D' ? [0] : [-2, 0, 2];

            z_offsets.forEach(z => {
                for(let i = 0; i <= numLines; i++) {
                    let y = -10 + i * lineSpacing;
                    let startPos = new THREE.Vector3(-halfDist + 0.16, y, z);
                    let res = traceLine(startPos, false);
                    drawCurve(res.points, false);
                }
                let fringeOffsets = [10.2, 10.6, -10.2, -10.6];
                fringeOffsets.forEach(y => {
                    let startPos = new THREE.Vector3(-halfDist + 0.16, y, z);
                    let res = traceLine(startPos, false);
                    drawCurve(res.points, false);
                });
            });
        } else {
            chargesData.forEach(c => {
                if (mode === 'singlePos' && c.sign < 0) return;
                if (mode === 'singleNeg' && c.sign > 0) return;

                let isReverse = (c.sign < 0);
                let absQ = Math.abs(c.q);
                let dirs = [];

                if (dimension === '2D') {
                    let samples = baseLines * absQ * 2;
                    let offset = Math.PI / samples;
                    for(let i=0; i<samples; i++) {
                        let theta = (i / samples) * Math.PI * 2 + offset;
                        dirs.push(new THREE.Vector3(Math.cos(theta), Math.sin(theta), 0));
                    }
                } else {
                    let samples = baseLines * absQ * 6;
                    let phi = Math.PI * (3 - Math.sqrt(5));
                    for (let i = 0; i < samples; i++) {
                        let y = 1 - (i / (samples - 1)) * 2;
                        let radius = Math.sqrt(1 - y * y);
                        let theta = phi * i;
                        let x = Math.cos(theta) * radius;
                        let z = Math.sin(theta) * radius;
                        dirs.push(new THREE.Vector3(x, y, z));
                    }
                }

                dirs.forEach(dir => {
                    if (mode === 'like' && Math.sign(chargesData[0].q) === Math.sign(chargesData[1].q)) {
                        let otherCharge = chargesData[0] === c ? chargesData[1] : chargesData[0];
                        let toOther = new THREE.Vector3().subVectors(otherCharge.mesh.position, c.mesh.position).normalize();
                        if (dir.dot(toOther) > 0.98) return;
                    }

                    let startPos = c.mesh.position.clone().add(dir.multiplyScalar(c.radius + 0.015));
                    let res = traceLine(startPos, isReverse);

                    if (isReverse && res.hitPositive) return;

                    drawCurve(res.points, isReverse);
                });
            });
        }

        allCurves.forEach((data, index) => {
            let curve = data.curve;
            let numArrows = Math.max(1, Math.floor(data.length / 12));
            if (mode === 'plates') numArrows = Math.max(1, Math.floor(data.length / 10));

            for (let j = 1; j <= numArrows; j++) {
                let fraction = j / (numArrows + 1);

                if (mode === 'dipole' || mode === 'like') {
                    let stagger = ((index % 7) - 3) * 0.03;
                    fraction += stagger;
                    fraction = Math.max(0.1, Math.min(0.9, fraction));
                }

                const point = curve.getPointAt(fraction);
                const tangent = curve.getTangentAt(fraction);

                let scale = 0.8;
                if (densityLevel === 'dense' || chargeQ > 3) scale = 0.55;
                if (densityLevel === 'sparse') scale = 1.0;

                const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.25 * scale, 0.8 * scale, 12), arrowMat);
                arrow.geometry.translate(0, -0.4 * scale, 0);
                arrow.position.copy(point);
                arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tangent);
                fieldLinesGroup.add(arrow);
            }
        });
    }

    // 主迴圈（controls.update 與 render 由 sim.start 底座處理）
    function tick() {
        if(neutralMarker && neutralMarker.visible) {
            const scale = 4.0 + Math.sin(Date.now() * 0.005) * 0.2;
            neutralMarker.scale.set(scale, scale, 1);
        }
    }

    init();
});
</script>
</body>
</html>
