<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <link rel="stylesheet" href="../../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../../assets/css/labgray.css">
    <script src="../../../assets/js/core.js"></script>
    <script src="../../../assets/js/i18n.js"></script>
    <script src="../../../assets/js/sim3d.js"></script>

    <style>
        /* ── 頁面獨有樣式（共用 chrome 見 assets/css/labgray.css）── */

        /* 版面鐵律：滿版三欄、面板內卡片不被壓縮（成對使用） */
        body { height: 100vh; overflow: hidden; }
        #left-panel > *, #right-panel > * { flex-shrink: 0; }

        /* 實驗模式按鈕：直向堆疊（原版面板縱向長按鈕） */
        #mode-group { flex-direction: column; }
        #mode-group .dir-btn { text-align: left; width: 100%; }

        /* 重置／步驟按鈕（沿用原版紅綠語意色） */
        #btn-reset { display: block; width: 100%; margin-top: 10px; background: #dc2626; border-color: #dc2626; color: #fff; }
        #btn-next { display: block; width: 100%; background: #16a34a; border-color: #16a34a; color: #fff; }
        #btn-next-wrong { display: none; width: 100%; margin-top: 6px; background: #dc2626; border-color: #dc2626; color: #fff; }
        #btn-reset:hover, #btn-next:hover, #btn-next-wrong:hover, #btn-apply:hover { filter: brightness(0.92); }
        #btn-next:disabled, #btn-next-wrong:disabled {
            background: var(--pl-border); border-color: var(--pl-border);
            color: var(--pl-text-faint); cursor: not-allowed; filter: none;
        }

        /* 電荷顯示模式（radio；labgray 無 radio 樣式） */
        .radio-title { font-size: 0.74rem; color: var(--pl-blue); font-weight: 700; margin: 10px 0 5px; }
        .radio-label { display: flex; align-items: center; gap: 6px; font-size: 0.73rem; color: var(--pl-text-dim); margin-bottom: 5px; cursor: pointer; }

        /* 自訂初始數值（number input 列） */
        .num-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 0.76rem; color: var(--pl-text-dim); }
        .num-row input {
            width: 60px; background: var(--pl-inset); color: var(--pl-text);
            border: 1px solid var(--pl-border); padding: 4px; text-align: center;
            border-radius: 5px; font-family: inherit;
        }
        #inputs-rod { border-top: 1px dashed var(--pl-border); padding-top: 10px; margin-top: 10px; }
        #btn-apply { display: block; width: 100%; margin-top: 4px; background: #2563eb; border-color: #2563eb; color: #fff; }

        /* 右欄實驗指示（原底部 #instruction；保留 \n 換行） */
        #instruction { white-space: pre-line; font-size: 0.78rem; line-height: 1.7; color: var(--pl-text-dim); }

        /* 3D 部件標籤（DOM 投影 chip；原版樣式值） */
        .obj-label {
            position: absolute; background: rgba(0,0,0,0.8); color: #fff;
            padding: 4px 8px; border-radius: 4px; font-size: 12px;
            pointer-events: none; transform: translate(-50%, -50%);
            display: none; border: 1px solid #777; white-space: nowrap; z-index: 5;
        }
    </style>
</head>

<script>
PhysLab.sim3d.ready(function () {
    const t = PhysLab.i18n.t;

    // ==========================================
    // 1. 場景與基礎設定（PhysLab.sim3d.create：頁面精確值）
    // ==========================================
    // 原版值：fov 45、near 0.1、far 100、相機 (0,5,15)→(0,0,0)、
    //   damping 0.05（three 預設；非共用 0.07）、無網格、
    //   pixelRatio 1（原版未呼叫 setPixelRatio）。
    //   背景由原深色 0x888888 統一為淺灰（共用預設 0xe2e6eb）。
    const view3dEl = document.getElementById('view3d');
    const sim = PhysLab.sim3d.create(view3dEl, {
        fov: 45, near: 0.1, far: 100,
        views: { default: { pos: [0, 5, 15], tgt: [0, 0, 0] } },
        controls: { damping: 0.05 },
        lights: false,
        grid: false,
        pixelRatio: 1
    });
    const scene = sim.scene, camera = sim.camera, renderer = sim.renderer, controls = sim.controls;
    renderer.shadowMap.enabled = true;
    controls.maxPolarAngle = Math.PI / 2 + 0.1;
    controls.minDistance = 5; controls.maxDistance = 20;

    // 原版光源：Ambient 0.7 ＋ 主光 0.8 @ (5,10,5)（無補光）
    PhysLab.sim3d.addLabLights(scene, { ambient: 0.7, key: 0.8, keyPos: [5, 10, 5], fill: false });

    // ==========================================
    // 2. 材質與模型建構
    // ==========================================
    function createChargeTexture(sign, color) {
        const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = color; ctx.beginPath(); ctx.arc(32, 32, 30, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'white'; ctx.font = 'bold 40px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(sign, 32, 36);
        return new THREE.CanvasTexture(canvas);
    }
    const matPos = new THREE.SpriteMaterial({ map: createChargeTexture('+', '#e74c3c'), transparent: true, depthTest: false });
    const matNeg = new THREE.SpriteMaterial({ map: createChargeTexture('-', '#3498db'), transparent: true, depthTest: false });

    const metalMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.9, roughness: 0.2, transparent: true, opacity: 1.0, depthWrite: true });
    document.getElementById('row-transparent').addEventListener('click', () => {
        const on = document.getElementById('opt-transparent').classList.toggle('on');
        metalMat.opacity = on ? 0.35 : 1.0; metalMat.depthWrite = !on;
    });

    function createStand() {
        const standGroup = new THREE.Group();
        const base = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 1.2), new THREE.MeshStandardMaterial({ color: 0x111111 })); base.position.y = -1.95;
        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.0), new THREE.MeshStandardMaterial({ color: 0xdddddd })); pillar.position.y = -1.4;
        standGroup.add(base, pillar); return standGroup;
    }

    const groupA = new THREE.Group(); groupA.add(new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), metalMat), createStand());
    const chargesAllA = new THREE.Group(); const chargesNetA = new THREE.Group(); groupA.add(chargesAllA, chargesNetA); scene.add(groupA);

    const groupB = new THREE.Group(); groupB.add(new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), metalMat), createStand());
    const chargesAllB = new THREE.Group(); const chargesNetB = new THREE.Group(); groupB.add(chargesAllB, chargesNetB); scene.add(groupB);

    const groupRod = new THREE.Group();
    const rodMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 4), new THREE.MeshStandardMaterial({ color: 0xe67e22, transparent: true, opacity: 0.9 })); rodMesh.rotation.z = Math.PI / 2; rodMesh.position.x = -2.0;
    const rodHandle = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 1.5), new THREE.MeshStandardMaterial({ color: 0x222222 })); rodHandle.rotation.z = Math.PI / 2; rodHandle.position.x = -3.25;
    const chargesRod = new THREE.Group(); groupRod.add(rodMesh, rodHandle, chargesRod); scene.add(groupRod);

    const groupEarth = new THREE.Group();
    const wireMat = new THREE.MeshStandardMaterial({ color: 0x27ae60 });
    const tipMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.5), new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8 })); tipMesh.rotation.z = Math.PI / 2; tipMesh.position.x = 0.25;
    const wireMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 3.0), wireMat); wireMesh.rotation.z = Math.PI / 2; wireMesh.position.x = 2.0;
    const vWire = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.5), wireMat); vWire.position.set(3.5, -0.75, 0);
    const g1 = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.2), wireMat); g1.rotation.z = Math.PI / 2; g1.position.set(3.5, -1.5, 0);
    const g2 = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.8), wireMat); g2.rotation.z = Math.PI / 2; g2.position.set(3.5, -1.8, 0);
    const g3 = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.4), wireMat); g3.rotation.z = Math.PI / 2; g3.position.set(3.5, -2.1, 0);
    groupEarth.add(tipMesh, wireMesh, vWire, g1, g2, g3); scene.add(groupEarth);

    // ==========================================
    // 3. 全新核心：物理狀態與持久化粒子追蹤
    // ==========================================
    let logicalState = { qA_net: 0, qB_net: 0, rodQ: 6, distA_net: 'even', distB_net: 'even', distA_e: 'even', distB_e: 'even' };
    let memory = { protonsA: [], electronsA: [], protonsB: [], electronsB: [] };

    function clearGroup(group) { while(group.children.length > 0) group.remove(group.children[0]); }

    function applyFibonacciDirect(spritesArray, type, distType) {
        const count = spritesArray.length; if (count === 0) return;
        const goldenRatio = (1 + Math.sqrt(5)) / 2;
        for (let i = 0; i < count; i++) {
            let sprite = spritesArray[i]; if (sprite.userData.isMoving) continue;
            let u; if (distType === 'left') u = -(i + 0.5) / count; else if (distType === 'right') u = 1 - (i + 0.5) / count; else u = 1 - (2 * i + 1) / count;
            let radiusAtU = Math.sqrt(1 - u * u); let theta = 2 * Math.PI * i / goldenRatio;
            let x = u, y = Math.cos(theta) * radiusAtU, z = Math.sin(theta) * radiusAtU;
            let r = type === '-' ? 1.06 : 1.04;
            let targetPos = new THREE.Vector3(x * r, y * r, z * r);

            if (!sprite.userData.initialized) { sprite.position.copy(targetPos); sprite.userData.initialized = true; }
            else { gsap.to(sprite.position, { x: targetPos.x, y: targetPos.y, z: targetPos.z, duration: 1.0, ease: "power2.out" }); }
        }
    }

    function updateLatticePositions(sphereID, eDistType) {
        let protons = sphereID === 'A' ? memory.protonsA : memory.protonsB;
        let electrons = sphereID === 'A' ? memory.electronsA : memory.electronsB;
        applyFibonacciDirect(protons, '+', 'even'); applyFibonacciDirect(electrons, '-', eDistType);
    }

    function updateNetCharges() {
        clearGroup(chargesNetA); clearGroup(chargesNetB);
        const createNetSprites = (group, q_net, distType) => {
            if (q_net === 0) return;
            let type = q_net > 0 ? '+' : '-'; let tex = type === '+' ? matPos : matNeg; let arr = [];
            for(let i=0; i<Math.abs(q_net); i++) { let s = new THREE.Sprite(tex.clone()); s.scale.set(0.35,0.35,0.35); s.userData = { initialized: false }; group.add(s); arr.push(s); }
            applyFibonacciDirect(arr, type, distType);
        };
        createNetSprites(chargesNetA, logicalState.qA_net, logicalState.distA_net);
        createNetSprites(chargesNetB, logicalState.qB_net, logicalState.distB_net);
        updateChargeVisibility();
    }

    function initSimulation() {
        gsap.killTweensOf(groupA.position); gsap.killTweensOf(groupB.position); gsap.killTweensOf(groupRod.position); gsap.killTweensOf(groupEarth.position);
        clearGroup(chargesAllA); clearGroup(chargesAllB); clearGroup(chargesRod);
        memory = { protonsA: [], electronsA: [], protonsB: [], electronsB: [] };

        let maxExpectedQ = Math.max(Math.abs(logicalState.qA_net), Math.abs(logicalState.qB_net), Math.abs(logicalState.rodQ));
        let baseProtons = maxExpectedQ + 16;

        const populateSphere = (groupAll, protonsArr, electronsArr, q_net) => {
            let eCount = baseProtons - q_net;
            for(let i=0; i<baseProtons; i++) { let s = new THREE.Sprite(matPos.clone()); s.scale.set(0.35,0.35,0.35); s.userData = {type: '+', initialized: false}; groupAll.add(s); protonsArr.push(s); }
            for(let i=0; i<eCount; i++) { let s = new THREE.Sprite(matNeg.clone()); s.scale.set(0.35,0.35,0.35); s.userData = {type: '-', initialized: false, isMoving: false}; groupAll.add(s); electronsArr.push(s); }
        };

        populateSphere(chargesAllA, memory.protonsA, memory.electronsA, logicalState.qA_net);
        if(currentMode !== 'earthing') populateSphere(chargesAllB, memory.protonsB, memory.electronsB, logicalState.qB_net);

        updateLatticePositions('A', logicalState.distA_e);
        if(currentMode !== 'earthing') updateLatticePositions('B', logicalState.distB_e);
        updateNetCharges();

        if (logicalState.rodQ !== 0) {
            let type = logicalState.rodQ > 0 ? '+' : '-'; let tex = type === '+' ? matPos : matNeg;
            for(let i=0; i<Math.abs(logicalState.rodQ); i++) {
                let s = new THREE.Sprite(tex.clone()); s.scale.set(0.35,0.35,0.35); s.position.set(-Math.random() * 3.5 - 0.2, 0.5, (Math.random() - 0.5) * 0.4); chargesRod.add(s);
            }
        }
    }

    function updateChargeVisibility() {
        const mode = document.querySelector('input[name="chargeView"]:checked').value;
        chargesAllA.visible = (mode === 'all'); chargesAllB.visible = (mode === 'all');
        chargesNetA.visible = (mode === 'net'); chargesNetB.visible = (mode === 'net');
        scene.children.forEach(c => { if (c.userData && c.userData.isMoving) c.visible = true; });
    }
    document.querySelectorAll('input[name="chargeView"]').forEach(r => r.addEventListener('change', updateChargeVisibility));

    // ==========================================
    // 4. ★ 物理核心動畫：球體傳導 與 接地傳導 ★
    // ==========================================
    function playPhysicalTransfer(fromID, toID, amount, onComplete) {
        let fromGroup = fromID === 'A' ? groupA : groupB; let toGroup = toID === 'A' ? groupA : groupB;
        let fromElectrons = fromID === 'A' ? memory.electronsA : memory.electronsB;
        let toChargesGroup = toID === 'A' ? chargesAllA : chargesAllB;
        fromGroup.updateMatrixWorld(true); toGroup.updateMatrixWorld(true);

        let available = fromElectrons.filter(e => !e.userData.isMoving);
        let toMove = available.slice(0, amount); let count = toMove.length;
        if (count === 0) { if(onComplete) onComplete(); return; }

        if(fromID === 'A') memory.electronsA = memory.electronsA.filter(e => !toMove.includes(e)); else memory.electronsB = memory.electronsB.filter(e => !toMove.includes(e));
        if(toID === 'A') memory.electronsA.push(...toMove); else memory.electronsB.push(...toMove);

        let completed = 0;
        let worldFrom = new THREE.Vector3(); fromGroup.getWorldPosition(worldFrom); let worldTo = new THREE.Vector3(); toGroup.getWorldPosition(worldTo);
        let contactX = (worldFrom.x + worldTo.x) / 2;

        toMove.forEach((sprite, i) => {
            sprite.userData.isMoving = true; scene.attach(sprite);
            let targetLocal = new THREE.Vector3((Math.random()-0.5)*1.5, (Math.random()-0.5)*1.5, (Math.random()-0.5)*1.5).normalize().multiplyScalar(1.06);
            let targetWorld = targetLocal.clone().applyMatrix4(toGroup.matrixWorld);

            let tl = gsap.timeline({
                delay: i * 0.1, onComplete: () => {
                    toChargesGroup.attach(sprite); sprite.userData.isMoving = false; completed++;
                    if (completed === count) { updateLatticePositions(toID, logicalState[`dist${toID}_e`]); if (onComplete) onComplete(); }
                }
            });
            tl.to(sprite.position, { x: contactX, y: 1.0, z: 0, duration: 0.5, ease: "power1.in" });
            tl.to(sprite.position, { x: targetWorld.x, y: targetWorld.y, z: targetWorld.z, duration: 0.5, ease: "power1.out" });
        });
        updateLatticePositions(fromID, logicalState[`dist${fromID}_e`]);
    }

    // 修改點 2：接地轉移採用 L 型導線路徑移動
    function playEarthTransfer(direction, amount, onComplete) {
        let completed = 0;
        let worldEarth = new THREE.Vector3(); groupEarth.getWorldPosition(worldEarth);
        let worldA = new THREE.Vector3(); groupA.getWorldPosition(worldA);

        // 定義導線上的三個關鍵節點，讓電子沿著直角行進
        let p1 = { x: worldA.x + 1.0, y: worldEarth.y, z: 0 };           // 節點 1：球體接觸點
        let p2 = { x: worldEarth.x + 3.5, y: worldEarth.y, z: 0 };       // 節點 2：導線直角彎折處
        let p3 = { x: worldEarth.x + 3.5, y: worldEarth.y - 2.5, z: 0 }; // 節點 3：地球端 (最下方)

        if (direction === 'in') {
            for (let i = 0; i < amount; i++) {
                let s = new THREE.Sprite(matNeg.clone()); s.scale.set(0.35, 0.35, 0.35); s.userData = { type: '-', initialized: true, isMoving: true };
                s.position.set(p3.x, p3.y, p3.z); scene.add(s); // 從地球端生成

                let targetLocal = new THREE.Vector3((Math.random()-0.5)*1.5, (Math.random()-0.5)*1.5, (Math.random()-0.5)*1.5).normalize().multiplyScalar(1.06);
                let targetWorld = targetLocal.clone().applyMatrix4(groupA.matrixWorld);

                let tl = gsap.timeline({
                    delay: i * 0.1, onComplete: () => {
                        chargesAllA.attach(s); s.userData.isMoving = false; memory.electronsA.push(s); completed++;
                        if (completed === amount) { updateLatticePositions('A', logicalState.distA_e); if (onComplete) onComplete(); }
                    }
                });

                // 順序：沿直線上滑 -> 沿橫線左滑 -> 進入球體
                tl.to(s.position, { x: p2.x, y: p2.y, z: p2.z, duration: 0.3, ease: "none" });
                tl.to(s.position, { x: p1.x, y: p1.y, z: p1.z, duration: 0.3, ease: "none" });
                tl.to(s.position, { x: targetWorld.x, y: targetWorld.y, z: targetWorld.z, duration: 0.3, ease: "power1.out" });
            }
        } else {
            let available = memory.electronsA.filter(e => !e.userData.isMoving);
            let toMove = available.slice(0, amount);
            memory.electronsA = memory.electronsA.filter(e => !toMove.includes(e));

            toMove.forEach((sprite, i) => {
                sprite.userData.isMoving = true; scene.attach(sprite);
                let tl = gsap.timeline({
                    delay: i * 0.1, onComplete: () => {
                        scene.remove(sprite); completed++;
                        if (completed === amount) { updateLatticePositions('A', logicalState.distA_e); if (onComplete) onComplete(); }
                    }
                });

                // 順序：出球體到接觸點 -> 沿橫線右滑 -> 沿直線下滑
                tl.to(sprite.position, { x: p1.x, y: p1.y, z: p1.z, duration: 0.3, ease: "power1.in" });
                tl.to(sprite.position, { x: p2.x, y: p2.y, z: p2.z, duration: 0.3, ease: "none" });
                tl.to(sprite.position, { x: p3.x, y: p3.y, z: p3.z, duration: 0.3, ease: "none" });
            });
        }
    }

    // ==========================================
    // 5. UI、狀態機、按鈕與面板控制
    // ==========================================
    let currentMode = 'sharing'; let step = 0; let isDraggingEnabled = true;
    const uiInstruction = document.getElementById('instruction');
    const btnNext = document.getElementById('btn-next');
    const btnNextWrong = document.getElementById('btn-next-wrong');

    /* 指示文字經 t() 輸出；lastInst 記住 key/params，語言切換時重繪。
       params 可為函式（延遲求值，令內嵌的 t() 片段一併跟隨語言）。 */
    let lastInst = null;
    function renderInst() {
        if (!lastInst) return;
        const p = (typeof lastInst.params === 'function') ? lastInst.params() : lastInst.params;
        uiInstruction.innerText = t(lastInst.key, p);
    }
    function showInst(key, params) { lastInst = { key: key, params: params }; renderInst(); }

    /* 顯示部件標籤開關（原 checkbox → toggle-row） */
    let showLabels = true;
    document.getElementById('row-labels').addEventListener('click', () => {
        showLabels = document.getElementById('opt-labels').classList.toggle('on');
    });

    /* 面板開關（topbar 標準鈕；切換後重算畫布尺寸） */
    PhysLab.ui.bindPanelToggle('btn-toggle-left', 'left-panel', sim.resize);
    PhysLab.ui.bindPanelToggle('btn-toggle-right', 'right-panel', sim.resize);

    function setDraggingStatus(status) {
        isDraggingEnabled = status;
        btnNext.disabled = !status;
        btnNextWrong.disabled = !status;

        let isFinished = false;
        if (currentMode === 'sharing' && step >= 1) isFinished = true;
        if (currentMode === 'induction' && step >= 3) isFinished = true;
        if (currentMode === 'earthing' && (step === 4 || step === 6)) isFinished = true;

        if (isFinished) {
            btnNext.style.display = 'none';
            btnNextWrong.style.display = 'none';
        } else {
            if (currentMode === 'earthing' && step === 2) {
                btnNext.style.display = 'block';
                btnNext.innerText = t('btn.nextEarthCorrect');
                btnNextWrong.style.display = 'block';
            } else {
                btnNext.style.display = 'block';
                btnNextWrong.style.display = 'none';
                if (currentMode === 'earthing') {
                    if (step === 0) btnNext.innerText = t('btn.next');
                    if (step === 1) btnNext.innerText = t('btn.next');
                    if (step === 3) btnNext.innerText = t('btn.removeRod');
                    if (step === 5) btnNext.innerText = t('btn.removeEarth');
                } else {
                    btnNext.innerText = t('btn.next');
                }
            }
        }
    }

    btnNext.addEventListener('click', () => {
        if (!isDraggingEnabled) return;
        setDraggingStatus(false);

        if (currentMode === 'sharing') {
            if (step === 0) gsap.to(groupA.position, { x: groupB.position.x - 2.05, duration: 1, onComplete: checkPhysicsLogic });
        }
        else if (currentMode === 'induction') {
            if (step === 0) gsap.to(groupRod.position, { x: groupA.position.x - 1.25, duration: 1, onComplete: checkPhysicsLogic });
            else if (step === 1) gsap.to(groupB.position, { x: groupA.position.x + 3.0, duration: 1, onComplete: checkPhysicsLogic });
            else if (step === 2) gsap.to(groupRod.position, { x: groupA.position.x - 6.0, duration: 1, onComplete: checkPhysicsLogic });
        }
        else if (currentMode === 'earthing') {
            if (step === 0) gsap.to(groupRod.position, { x: groupA.position.x - 1.25, duration: 1, onComplete: checkPhysicsLogic });
            else if (step === 1) gsap.to(groupEarth.position, { x: groupA.position.x + 1.0, duration: 1, onComplete: checkPhysicsLogic });
            else if (step === 2) {
                gsap.to(groupEarth.position, { x: groupA.position.x + 3.0, duration: 1, onComplete: () => {
                    step = 3;
                    groupEarth.position.x = groupA.position.x + 3.0;
                    showInst('inst.earthing.step3');
                    setDraggingStatus(true);
                }});
            }
            else if (step === 3) gsap.to(groupRod.position, { x: groupA.position.x - 6.0, duration: 1, onComplete: checkPhysicsLogic });
            else if (step === 5) {
                gsap.to(groupEarth.position, { x: groupA.position.x + 3.0, duration: 1, onComplete: () => {
                    step = 6;
                    groupEarth.position.x = groupA.position.x + 3.0;
                    showInst('inst.earthing.wrongEnd');
                    setDraggingStatus(true);
                }});
            }
        }
    });

    btnNextWrong.addEventListener('click', () => {
        if (!isDraggingEnabled || currentMode !== 'earthing' || step !== 2) return;
        setDraggingStatus(false);

        gsap.to(groupRod.position, { x: groupA.position.x - 6.0, duration: 1, onComplete: () => {
            step = 5;
            groupRod.position.x = groupA.position.x - 6.0;

            // 修改點 1 (自動執行版)：因為移走了帶電棒，立刻將球體狀態設為「均勻分佈」，並強迫剩下的電荷立刻散開
            logicalState.distA_net = 'even'; logicalState.distA_e = 'even';
            updateLatticePositions('A', 'even');

            let currentQ = logicalState.qA_net;
            let direction = currentQ > 0 ? 'in' : 'out';
            let eAmount = Math.abs(currentQ);

            showInst('inst.earthing.wrongStart');

            if (eAmount > 0) {
                playEarthTransfer(direction, eAmount, () => {
                    logicalState.qA_net = 0;
                    updateNetCharges();
                    showInst('inst.earthing.wrongLeaked');
                    setDraggingStatus(true);
                });
            } else {
                logicalState.qA_net = 0;
                updateNetCharges();
                showInst('inst.earthing.wrongNeutral');
                setDraggingStatus(true);
            }
        }});
    });

    function setMode(modeId) {
        document.querySelectorAll('#mode-group .dir-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${modeId}`).classList.add('active');
        currentMode = modeId; applyCustomInputs();
    }
    document.getElementById('btn-sharing').addEventListener('click', () => setMode('sharing'));
    document.getElementById('btn-induction').addEventListener('click', () => setMode('induction'));
    document.getElementById('btn-earthing').addEventListener('click', () => setMode('earthing'));
    document.getElementById('btn-apply').addEventListener('click', applyCustomInputs);
    document.getElementById('btn-reset').addEventListener('click', applyCustomInputs);

    function applyCustomInputs() {
        let valA = parseInt(document.getElementById('inputA').value) || 0;
        let valB = parseInt(document.getElementById('inputB').value) || 0;
        let valRod = parseInt(document.getElementById('inputRod').value) || 0;
        if (valRod === 0) valRod = 6; document.getElementById('inputRod').value = valRod;

        document.getElementById('lbl-inputA').style.display = 'flex';

        if (currentMode === 'sharing') {
            document.getElementById('inputs-rod').style.display = 'none'; document.getElementById('lbl-inputB').style.display = 'flex';
            groupA.position.set(-3, 1, 0); groupB.position.set(2, 1, 0);

            groupB.visible = true; groupA.visible = true;
            groupRod.visible = false; groupEarth.visible = false;

            logicalState = { qA_net: valA, qB_net: valB, rodQ: 0, distA_net: 'even', distB_net: 'even', distA_e: 'even', distB_e: 'even' };
            showInst('inst.sharing.intro', { a: valA, b: valB });
        }
        else if (currentMode === 'induction') {
            document.getElementById('inputs-rod').style.display = 'block'; document.getElementById('lbl-inputB').style.display = 'none';
            valA = 0; document.getElementById('inputA').value = 0;
            groupA.position.set(-1, 1, 0); groupB.position.set(1, 1, 0); groupRod.position.set(-8, 1, 0);

            groupB.visible = true; groupA.visible = true; groupRod.visible = true;
            groupEarth.visible = false;

            logicalState = { qA_net: 0, qB_net: 0, rodQ: valRod, distA_net: 'even', distB_net: 'even', distA_e: 'even', distB_e: 'even' };
            showInst('inst.induction.intro', () => ({ rod: t(valRod > 0 ? 'rod.pos' : 'rod.neg') }));
        }
        else if (currentMode === 'earthing') {
            document.getElementById('inputs-rod').style.display = 'block'; document.getElementById('lbl-inputB').style.display = 'none';
            groupA.position.set(0, 1, 0); groupRod.position.set(-8, 1, 0); groupEarth.position.set(8, 1, 0);

            groupB.visible = false; groupA.visible = true; groupRod.visible = true; groupEarth.visible = true;

            logicalState = { qA_net: valA, qB_net: 0, rodQ: valRod, distA_net: 'even', distB_net: 'even', distA_e: 'even', distB_e: 'even' };
            showInst('inst.earthing.intro', () => ({
                rod: t(valRod > 0 ? 'rod.pos' : 'rod.neg'),
                state: valA === 0 ? t('sign.neutral') : t('inst.aCharge', { a: valA })
            }));
        }
        step = 0; initSimulation(); setDraggingStatus(true);
    }

    // ==========================================
    // 6. 拖曳防穿模系統
    // ==========================================
    const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
    let draggedObject = null; let dragOffset = 0;

    /* 畫布不再滿版（原版用 window.innerWidth/Height）：
       NDC 座標改以 renderer canvas 的實際版面矩形換算 */
    function setMouseFromEvent(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }

    window.addEventListener('pointerdown', (event) => {
        if (!isDraggingEnabled) return;
        setMouseFromEvent(event);
        raycaster.setFromCamera(mouse, camera);

        let interactables = [];
        if (currentMode === 'sharing' && step === 0) interactables.push(groupA.children[0], groupA.children[1]);
        if (currentMode === 'induction') {
            if (step === 0 || step === 2) interactables.push(...groupRod.children.filter(c => c.isMesh));
            if (step === 1) interactables.push(groupB.children[0], groupB.children[1]);
        }
        if (currentMode === 'earthing') {
            if (step === 0) interactables.push(...groupRod.children.filter(c => c.isMesh));
            if (step === 1) interactables.push(...groupEarth.children.filter(c => c.isMesh));
            if (step === 2) {
                interactables.push(...groupRod.children.filter(c => c.isMesh));
                interactables.push(...groupEarth.children.filter(c => c.isMesh));
            }
            if (step === 3) interactables.push(...groupRod.children.filter(c => c.isMesh));
            if (step === 5) interactables.push(...groupEarth.children.filter(c => c.isMesh));
        }

        const intersects = raycaster.intersectObjects(interactables);
        if (intersects.length > 0) {
            controls.enabled = false; draggedObject = intersects[0].object.parent;
            const plane = new THREE.Plane(new THREE.Vector3(0,0,1), 0); const point = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, point); dragOffset = draggedObject.position.x - point.x;
        }
    });

    window.addEventListener('pointermove', (event) => {
        if (draggedObject) {
            setMouseFromEvent(event);
            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0,0,1), 0); const point = new THREE.Vector3();

            if (raycaster.ray.intersectPlane(plane, point)) {
                let newX = point.x + dragOffset;
                if (currentMode === 'sharing' && draggedObject === groupA && newX > groupB.position.x - 2.05) newX = groupB.position.x - 2.05;
                else if (currentMode === 'induction') {
                    if (draggedObject === groupRod && newX > groupA.position.x - 1.25) newX = groupA.position.x - 1.25;
                    if (step === 1 && draggedObject === groupB && newX < groupA.position.x + 2.05) newX = groupA.position.x + 2.05;
                }
                else if (currentMode === 'earthing') {
                    if (draggedObject === groupRod && newX > groupA.position.x - 1.25) newX = groupA.position.x - 1.25;
                    if (draggedObject === groupEarth && newX < groupA.position.x + 1.0) newX = groupA.position.x + 1.0;
                }
                draggedObject.position.x = newX; checkPhysicsLogic();
            }
        }
    });

    window.addEventListener('pointerup', () => { draggedObject = null; controls.enabled = true; });

    // ==========================================
    // 7. ★ 核心物理邏輯演算 ★
    // ==========================================
    function checkPhysicsLogic() {
        if (currentMode === 'sharing' && step === 0) {
            if (groupB.position.x - groupA.position.x <= 2.05) {
                step = 1; draggedObject = null; setDraggingStatus(false); groupA.position.x = groupB.position.x - 2.05;
                let totalCharge = logicalState.qA_net + logicalState.qB_net;
                let target_qA = Math.floor(totalCharge / 2), target_qB = Math.ceil(totalCharge / 2);
                let delta_A = target_qA - logicalState.qA_net; let eFlowAmount = Math.abs(delta_A);
                let fromID = delta_A < 0 ? 'B' : 'A'; let toID = delta_A < 0 ? 'A' : 'B';

                if (eFlowAmount !== 0) showInst('inst.sharing.flow', { from: fromID, to: toID });
                else showInst('inst.sharing.balanced');

                const finishSharing = () => {
                    logicalState.qA_net = target_qA; logicalState.qB_net = target_qB;
                    logicalState.distA_net = 'left'; logicalState.distB_net = 'right'; logicalState.distA_e = 'left'; logicalState.distB_e = 'right';
                    updateNetCharges(); updateLatticePositions('A', 'left'); updateLatticePositions('B', 'right');
                    showInst('inst.sharing.done', () => ({
                        sign: t(totalCharge > 0 ? 'sign.pos' : (totalCharge < 0 ? 'sign.neg' : 'sign.neutral')),
                        repel: t(totalCharge !== 0 ? 'inst.sharing.repelYes' : 'inst.sharing.repelNo')
                    }));

                    gsap.to(groupA.position, { x: groupB.position.x - 2.6, duration: 1, ease: "power2.out" }); gsap.to(groupB.position, { x: groupB.position.x + 0.6, duration: 1, ease: "power2.out" });
                    gsap.delayedCall(1.0, () => {
                        logicalState.distA_net = 'even'; logicalState.distB_net = 'even'; logicalState.distA_e = 'even'; logicalState.distB_e = 'even';
                        updateNetCharges(); updateLatticePositions('A', 'even'); updateLatticePositions('B', 'even');
                        setDraggingStatus(true);
                    });
                };
                if (eFlowAmount !== 0) playPhysicalTransfer(fromID, toID, eFlowAmount, finishSharing); else gsap.delayedCall(1.0, finishSharing);
            }
        }
        else if (currentMode === 'induction') {
            if (step === 0 && groupA.position.x - groupRod.position.x <= 1.3) {
                step = 1; draggedObject = null; setDraggingStatus(false); groupRod.position.x = groupA.position.x - 1.25;
                let qRod = logicalState.rodQ; let amountToMove = Math.abs(qRod);

                if (qRod > 0) {
                    showInst('inst.induction.polarPos');
                    playPhysicalTransfer('B', 'A', amountToMove, () => {
                        logicalState.qA_net = -amountToMove; logicalState.qB_net = amountToMove;
                        logicalState.distA_net = 'left'; logicalState.distB_net = 'right'; logicalState.distA_e = 'left'; logicalState.distB_e = 'right';
                        updateNetCharges(); updateLatticePositions('A', 'left'); updateLatticePositions('B', 'right');
                        showInst('inst.induction.separated');
                        setDraggingStatus(true);
                    });
                } else {
                    showInst('inst.induction.polarNeg');
                    playPhysicalTransfer('A', 'B', amountToMove, () => {
                        logicalState.qA_net = amountToMove; logicalState.qB_net = -amountToMove;
                        logicalState.distA_net = 'left'; logicalState.distB_net = 'right'; logicalState.distA_e = 'left'; logicalState.distB_e = 'right';
                        updateNetCharges(); updateLatticePositions('A', 'left'); updateLatticePositions('B', 'right');
                        showInst('inst.induction.separated');
                        setDraggingStatus(true);
                    });
                }
            }
            else if (step === 1 && groupB.position.x - groupA.position.x >= 3.0) {
                step = 2; draggedObject = null;
                showInst('inst.induction.step2');
                logicalState.distB_net = 'even'; logicalState.distB_e = 'even'; updateNetCharges(); updateLatticePositions('B', 'even');
                setDraggingStatus(true);
            }
            else if (step === 2 && groupA.position.x - groupRod.position.x >= 6.0) {
                step = 3; draggedObject = null;
                showInst('inst.induction.step3');
                logicalState.distA_net = 'even'; logicalState.distA_e = 'even'; updateNetCharges(); updateLatticePositions('A', 'even');
                setDraggingStatus(true);
            }
        }
        else if (currentMode === 'earthing') {
            if (step === 0 && groupA.position.x - groupRod.position.x <= 1.3) {
                step = 1; draggedObject = null; setDraggingStatus(false); groupRod.position.x = groupA.position.x - 1.25;
                let qRod = logicalState.rodQ; logicalState.distA_e = qRod > 0 ? 'left' : 'right'; updateLatticePositions('A', logicalState.distA_e);
                showInst('inst.earthing.step1');
                setDraggingStatus(true);
            }
            else if (step === 1 && groupEarth.position.x - groupA.position.x <= 1.05) {
                step = 2; draggedObject = null; setDraggingStatus(false); groupEarth.position.x = groupA.position.x + 1.0;
                let qRod = logicalState.rodQ; let target_qA = -qRod;
                let delta_A = target_qA - logicalState.qA_net; let eAmount = Math.abs(delta_A);

                if (eAmount === 0) {
                    showInst('inst.earthing.noFlow');
                    gsap.delayedCall(1.0, () => {
                        showInst('inst.earthing.branch');
                        setDraggingStatus(true);
                    });
                }
                else if (delta_A < 0) {
                    showInst('inst.earthing.inFlow');
                    playEarthTransfer('in', eAmount, () => {
                        logicalState.qA_net = target_qA; updateNetCharges();
                        showInst('inst.earthing.branch');
                        setDraggingStatus(true);
                    });
                } else {
                    showInst('inst.earthing.outFlow');
                    playEarthTransfer('out', eAmount, () => {
                        logicalState.qA_net = target_qA; updateNetCharges();
                        showInst('inst.earthing.branch');
                        setDraggingStatus(true);
                    });
                }
            }
            else if (step === 2) {
                if (groupEarth.position.x - groupA.position.x >= 3.0) {
                    step = 3; draggedObject = null;
                    showInst('inst.earthing.step3');
                    setDraggingStatus(true);
                }
                else if (groupA.position.x - groupRod.position.x >= 6.0) {
                    step = 5; draggedObject = null; setDraggingStatus(false);

                    // 修改點 1 (手動拖曳版)：因為移走了帶電棒，立刻將球體狀態設為「均勻分佈」
                    logicalState.distA_net = 'even'; logicalState.distA_e = 'even';
                    updateLatticePositions('A', 'even');

                    let currentQ = logicalState.qA_net;
                    let direction = currentQ > 0 ? 'in' : 'out';
                    let eAmount = Math.abs(currentQ);

                    showInst('inst.earthing.wrongStartDrag');

                    const resetSphere = () => {
                        logicalState.qA_net = 0; updateNetCharges();
                        showInst('inst.earthing.wrongLeaked');
                        setDraggingStatus(true);
                    };
                    if (eAmount > 0) playEarthTransfer(direction, eAmount, resetSphere); else resetSphere();
                }
            }
            else if (step === 3 && groupA.position.x - groupRod.position.x >= 6.0) {
                step = 4; draggedObject = null;
                logicalState.distA_net = 'even'; logicalState.distA_e = 'even'; updateNetCharges(); updateLatticePositions('A', 'even');
                showInst('inst.earthing.step4');
                setDraggingStatus(true);
            }
            else if (step === 5 && groupEarth.position.x - groupA.position.x >= 3.0) {
                step = 6; draggedObject = null;
                showInst('inst.earthing.wrongEnd');
                setDraggingStatus(true);
            }
        }
    }

    // ==========================================
    // 8. 視窗標籤與渲染循環
    // ==========================================
    const domLabels = { A: document.getElementById('label-sphereA'), B: document.getElementById('label-sphereB'), Rod: document.getElementById('label-rod'), Earth: document.getElementById('label-earth') };
    function updateLabels() {
        if (!showLabels) { Object.values(domLabels).forEach(el => el.style.display = 'none'); return; }
        /* 標籤改掛 #view3d 內：投影座標以容器尺寸換算（原版用 window 尺寸） */
        const W = view3dEl.clientWidth, H = view3dEl.clientHeight;
        const updatePos = (group, xOffset, yOffset, el) => {
            if (!group.visible || group.position.y > 5 || group.position.x < -7 || group.position.y < -5) { el.style.display = 'none'; return; }
            const pos = new THREE.Vector3(group.position.x + xOffset, group.position.y + yOffset, group.position.z).project(camera);
            el.style.display = 'block'; el.style.left = `${(pos.x * .5 + .5) * W}px`; el.style.top = `${(pos.y * -.5 + .5) * H}px`;
        };
        updatePos(groupA, 0, 2.0, domLabels.A); updatePos(groupB, 0, 2.0, domLabels.B); updatePos(groupRod, -1.0, 1.5, domLabels.Rod);
        updatePos(groupEarth, 3.5, -0.5, domLabels.Earth);
    }

    /* 語言切換：重繪動態指示文字與步驟按鈕文字
       （靜態 data-i18n 由 i18n.applyTo 自動處理） */
    PhysLab.i18n.onChange(function () {
        renderInst();
        setDraggingStatus(isDraggingEnabled);
    });

    applyCustomInputs();
    sim.start(function () { updateLabels(); });
});
</script>
</body>
