    <link rel="stylesheet" href="../../../assets/css/labgray.css">
    <style>
        /* ==============================================================
           本頁為「全螢幕畫布＋浮動面板」版式（非 Lab Gray 三欄 chrome），
           以下第一段為共用樣式中和，其餘為頁面專屬樣式。
           ============================================================== */

        /* 中和 labgray §1 body（flex 三欄版式）與 tokens 全域 reset：
           維持原版全螢幕畫布 body 的計算值 */
        body {
            margin: 0; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc; color: #333;
            display: block; min-height: auto; flex-direction: row;
            box-sizing: content-box;
        }
        /* 中和 tokens 的 * { box-sizing: border-box }：原版面板以 content-box
           排版（內容寬 340px ＋ 25px×2 內距 ＋ 1px×2 邊框 ＝ 總寬 392px）。
           面板內的 select / button 本來就是 UA 預設 border-box，不受影響。 */
        #ui-panel { box-sizing: content-box; }
        /* 畫布容器尺寸：PhysLab.sim3d.create 依容器大小建立 renderer
           （原版直接用 window.innerWidth / innerHeight） */
        #canvas-container { width: 100vw; height: 100vh; }

        #ui-panel {
            position: absolute; top: 20px; left: 20px; background: rgba(255, 255, 255, 0.95);
            padding: 20px 25px; border-radius: 12px; border: 1px solid var(--pl-border);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12); width: 340px; z-index: 100; backdrop-filter: blur(10px);
            max-height: 90vh; overflow-y: auto;
        }
        h2 { margin: 0 0 15px 0; font-size: 19px; color: #0f172a; border-bottom: 2px solid var(--pl-border-soft); padding-bottom: 10px; }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--pl-text-dim); font-weight: bold; }
        select {
            width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--pl-border);
            background: #fff; color: var(--pl-text-strong); font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        select:hover { border-color: var(--pl-blue); }
        .checkbox-label {
            display: flex; align-items: center; font-size: 13px; color: #dc2626; cursor: pointer; font-weight: bold;
        }
        /* margin 前三值補回被 tokens reset 歸零的 UA 預設（3px 3px 3px 4px），
           右值為原版的 margin-right: 8px */
        .checkbox-label input { width: auto; margin: 3px 8px 3px 4px; cursor: pointer; }
        button {
            width: 100%; padding: 10px; border-radius: 6px; border: none;
            background-color: #2563eb; color: white; font-weight: bold; font-size: 14px;
            cursor: pointer; transition: 0.3s; margin-top: 5px; box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }
        button:hover { background-color: #1d4ed8; transform: translateY(-1px); }
        .instructions { font-size: 12px; color: var(--pl-text-faint); line-height: 1.6; margin-top: 15px; padding-top: 12px; border-top: 1px dashed var(--pl-border); }
        .instructions span { color: #dc2626; font-weight: bold; }
        .tip { background: #eff6ff; border-left: 4px solid var(--pl-blue); padding: 10px; margin-top: 10px; font-size: 12px; color: #1e40af; border-radius: 0 4px 4px 0;}

        /* -- Responsive (Mobile / Tablet) --
           本頁浮動面板的自有斷點（非 labgray 三欄 chrome 的 1180/860） */
        @media (max-width: 768px) {
            #ui-panel, .ui-panel {
                width: calc(100vw - 20px) !important;
                max-width: 100vw !important;
                max-height: 45vh !important;
                overflow-y: auto !important;
                top: auto !important;
                bottom: 0 !important;
                left: 0 !important;
                right: 0 !important;
                border-radius: 12px 12px 0 0 !important;
                padding: 12px !important;
                font-size: 12px !important;
            }
            #ui-panel h2, .ui-panel h2 { font-size: 14px !important; margin: 0 0 6px 0 !important; }
            #ui-panel h3, .ui-panel h3 { font-size: 13px !important; }
            #ui-panel label, .ui-panel label { font-size: 11px !important; }
            #ui-panel input[type=range], .ui-panel input[type=range] { height: 20px !important; }
            #ui-panel .btn, .ui-panel .btn { padding: 7px 4px !important; font-size: 11px !important; }
        }
        @media (min-width: 769px) and (max-width: 1024px) {
            #ui-panel, .ui-panel {
                width: 260px !important;
                font-size: 13px !important;
            }
        }
    </style>

<body>

        <button id="compassBtn" data-i18n="panel.main.compassOpen">打開 2D 平面指南針</button>

        <div class="tip" data-i18n-html="panel.main.tip">

        </div>

        <div class="instructions" data-i18n-html="panel.main.instructions">
            <b>操作指南：</b><br>
            • 滑鼠 <span>左鍵拖曳背景</span> 旋轉 3D 視角。<br>
            • 滑鼠 <span>點擊指南針</span> 可無縫自由拖曳。<br>
            * 橘色箭頭指示磁場由 N 極流向 S 極。

    <div id="canvas-container"></div>

<script>

            'panel.main.modeAttract': '異極相吸 (N - S)',
            'panel.main.neutralToggle': '顯示精準中和點標記',

            'panel.main.dir2': '2 條 (完美重現教科書 2D 截面)',

            'panel.main.dir8': '8 條 (標準 3D 包覆)',

            'panel.main.compassClose': '關閉指南針',
            'panel.main.tip': '💡 <b>精準標記：</b><br>中和點現在改用幾何正中心的<b>實心圓點</b>標示，確保標示位置100%符合 $\\vec{B} = 0$ 的絕對座標點。',
            'panel.main.instructions': '<b>操作指南：</b><br>• 滑鼠 <span>左鍵拖曳背景</span> 旋轉 3D 視角。<br>• 滑鼠 <span>點擊指南針</span> 可無縫自由拖曳。<br>* 橘色箭頭指示磁場由 N 極流向 S 極。',

<script>
    let sim = null; // PhysLab.sim3d.create() 場景上下文
    let scene, camera, renderer, orbitControls;
    let magnetsData = [];
    let magnetsGroup, fieldLinesGroup;
    let neutralMarker = null;

    // 指南針與拖曳系統
    let compass;
    let isCompassActive = false;
    let isDragging = false;
    let raycaster, mouse, dragPlane;

    // 物理比例設定
    const MAG_LEN = 8.0;
    const MAG_WID = 1.4;
    const POLE_DIST = (MAG_LEN / 2) * 0.85;

    function init() {
        const container = document.getElementById('canvas-container');

        // 本頁原版場景值（與共用預設不同者全部顯式傳入）：
        //   背景 0xf8fafc（非 0xe2e6eb）、fov 45（非 42）、far 1000（非 200）、
        //   相機 (0,0,48) → (0,0,0)、damping 0.05（非 0.07）、無網格
        sim = PhysLab.sim3d.create(container, {
            background: 0xf8fafc,
            fov: 45, near: 0.1, far: 1000,
            views: { default: { pos: [0, 0, 48], tgt: [0, 0, 0] } },
            controls: { damping: 0.05 },
            lights: false,
            grid: false
        });
        scene = sim.scene;
        camera = sim.camera;
        renderer = sim.renderer;
        orbitControls = sim.controls;

        // 原版光源：Ambient 0.85 ＋ 單一主光 0.5 @ (5,15,20)（無補光 → fill:0）
        PhysLab.sim3d.addLabLights(scene, { ambient: 0.85, key: 0.5, keyPos: [5, 15, 20], fill: 0 });
        // 原版不封頂 devicePixelRatio（create 預設封頂 2）；resize 讓新比例生效
        renderer.setPixelRatio(window.devicePixelRatio);
        sim.resize();

        magnetsGroup = new THREE.Group();
        fieldLinesGroup = new THREE.Group();
        scene.add(magnetsGroup);
        scene.add(fieldLinesGroup);

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();
        dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

        createCompass();

        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);

        document.getElementById('modeSelect').addEventListener('change', (e) => {
            const mode = e.target.value;
            document.getElementById('neutralControl').style.display = mode === 'repel' ? 'block' : 'none';
            buildScene(mode);
        });

        document.getElementById('neutralToggle').addEventListener('change', (e) => {
            if (neutralMarker) neutralMarker.visible = e.target.checked;
        });

        document.getElementById('linesDirectionSelect').addEventListener('change', () => generateFieldLines());
        document.getElementById('densitySelect').addEventListener('change', () => generateFieldLines());
        document.getElementById('compassBtn').addEventListener('click', toggleCompass);

        // 初始載入
        updateCompassBtn();
        buildScene(document.getElementById('modeSelect').value);
        sim.start(tick);
    }

    function onPointerDown(event) {
        if (!isCompassActive) return;
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const intersects = raycaster.intersectObject(compass, true);
        if (intersects.length > 0) {
            isDragging = true;
            orbitControls.enabled = false;
        }
    }

    function onPointerMove(event) {
        if (!isDragging) return;
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const targetPoint = new THREE.Vector3();
        raycaster.ray.intersectPlane(dragPlane, targetPoint);

        if (targetPoint) {
            compass.position.copy(targetPoint);
        }
    }

    function onPointerUp(event) {
        isDragging = false;
        orbitControls.enabled = true;
    }

    function createTextMaterial(text, bgColor) {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 180;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'white';
        ctx.font = 'bold 110px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 256, 96);
        return new THREE.MeshPhongMaterial({ map: new THREE.CanvasTexture(canvas) });
    }

    function buildScene(mode) {
        magnetsData = [];
        while(magnetsGroup.children.length > 0){ magnetsGroup.remove(magnetsGroup.children[0]); }
        if (neutralMarker) { scene.remove(neutralMarker); neutralMarker = null; }

        const colorN = '#ef4444';
        const colorS = '#3b82f6';

        const matN_text = createTextMaterial('N', colorN);
        const matS_text = createTextMaterial('S', colorS);
        const matN_color = new THREE.MeshPhongMaterial({ color: colorN });
        const matS_color = new THREE.MeshPhongMaterial({ color: colorS });

        const materialsN = [matN_color, matN_color, matN_text, matN_color, matN_text, matN_color];
        const materialsS = [matS_color, matS_color, matS_text, matS_color, matS_text, matS_color];

        function addBarMagnet(centerX, centerY, centerZ, nDirectionX) {
            const group = new THREE.Group();
            const geo = new THREE.BoxGeometry(MAG_LEN/2, MAG_WID, MAG_WID);

            const meshN = new THREE.Mesh(geo, materialsN);
            meshN.position.x = nDirectionX > 0 ? MAG_LEN/4 : -MAG_LEN/4;
            const meshS = new THREE.Mesh(geo, materialsS);
            meshS.position.x = nDirectionX > 0 ? -MAG_LEN/4 : MAG_LEN/4;

            group.add(meshN);
            group.add(meshS);
            group.position.set(centerX, centerY, centerZ);
            magnetsGroup.add(group);

            magnetsData.push({
                posCenter: new THREE.Vector3(centerX, centerY, centerZ),
                posN: new THREE.Vector3(centerX + nDirectionX * POLE_DIST, centerY, centerZ),
                posS: new THREE.Vector3(centerX - nDirectionX * POLE_DIST, centerY, centerZ),
                nDir: new THREE.Vector3(nDirectionX, 0, 0)
            });
        }

        const offset = 6.5;
        if (mode === 'single') {
            addBarMagnet(0, 0, 0, 1);
        } else if (mode === 'repel') {
            addBarMagnet(-offset, 0, 0, 1);
            addBarMagnet(offset, 0, 0, -1);

            // ★ 全新的精準圓形中和點標記 ★
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // 繪製正中央的實心紅點 (帶有白邊以增加對比)
            ctx.beginPath();
            ctx.arc(128, 128, 28, 0, Math.PI * 2);
            ctx.fillStyle = '#dc2626'; // 紅色
            ctx.fill();
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#ffffff'; // 白色邊框
            ctx.stroke();

            // 在紅點下方繪製輔助文字
            ctx.fillStyle = '#dc2626';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(PhysLab.i18n.t('label3d.neutral'), 128, 175);

            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
            neutralMarker = new THREE.Sprite(mat);

            // 將 Sprite 設為正方形，這樣 (128,128) 剛好對應 3D 空間的 (0,0,0)
            neutralMarker.scale.set(4, 4, 1);
            neutralMarker.position.set(0, 0, 0);
            neutralMarker.visible = document.getElementById('neutralToggle').checked;
            scene.add(neutralMarker);

        } else if (mode === 'attract') {
            addBarMagnet(-offset, 0, 0, 1);
            addBarMagnet(offset, 0, 0, 1);
        }

        generateFieldLines();
    }

    function getMagneticField(pos) {
        let B = new THREE.Vector3(0, 0, 0);
        for (let m of magnetsData) {
            let rN = new THREE.Vector3().subVectors(pos, m.posN);
            let distSqN = rN.lengthSq();
            if (distSqN > 0.05) B.add(rN.normalize().multiplyScalar(1 / distSqN));

            let rS = new THREE.Vector3().subVectors(pos, m.posS);
            let distSqS = rS.lengthSq();
            if (distSqS > 0.05) B.add(rS.normalize().multiplyScalar(-1 / distSqS));
        }
        return B;
    }

    function traceLine(startPos, stepSign) {
        let points = [startPos.clone()];
        let pos = startPos.clone();
        let h = 0.15;
        let closed = false;
        let maxSteps = 2500;

        let isRepelMode = document.getElementById('modeSelect').value === 'repel';
        let startSideX = startPos.x > 0 ? 1 : -1;

        for (let step = 0; step < maxSteps; step++) {
            let B1 = getMagneticField(pos);
            let bMag1 = B1.length();

            if (bMag1 < 0.02) break;
            if (isRepelMode && pos.length() < 1.2) break;

            let k1 = B1.multiplyScalar((h * stepSign) / bMag1);
            let p2 = pos.clone().add(k1.clone().multiplyScalar(0.5));
            let B2 = getMagneticField(p2);
            let bMag2 = B2.length();
            if (bMag2 < 0.02 || (isRepelMode && p2.length() < 1.2)) break;
            let k2 = B2.multiplyScalar((h * stepSign) / bMag2);

            let p3 = pos.clone().add(k2.clone().multiplyScalar(0.5));
            let B3 = getMagneticField(p3);
            let bMag3 = B3.length();
            if (bMag3 < 0.02 || (isRepelMode && p3.length() < 1.2)) break;
            let k3 = B3.multiplyScalar((h * stepSign) / bMag3);

            let p4 = pos.clone().add(k3);
            let B4 = getMagneticField(p4);
            let bMag4 = B4.length();
            if (bMag4 < 0.02 || (isRepelMode && p4.length() < 1.2)) break;
            let k4 = B4.multiplyScalar((h * stepSign) / bMag4);

            let move = k1.add(k2.multiplyScalar(2)).add(k3.multiplyScalar(2)).add(k4).multiplyScalar(1/6);
            pos.add(move);
            points.push(pos.clone());

            // 絕對防穿透結界：相斥模式下強制截斷跨越 x=0 的線條
            if (isRepelMode) {
                let currentSideX = pos.x > 0 ? 1 : -1;
                if (startSideX !== currentSideX) {
                    break;
                }
            }

            if (pos.length() > 60) break;

            if (step > 5) {
                let hit = false;
                for (let m of magnetsData) {
                    let toCenter = new THREE.Vector3().subVectors(pos, m.posCenter);
                    let xProj = toCenter.dot(m.nDir);
                    let radialDist = Math.sqrt(Math.max(0, toCenter.lengthSq() - xProj * xProj));

                    if (Math.abs(xProj) <= (MAG_LEN / 2) && radialDist <= (MAG_WID / 2) + 0.1) {
                        hit = true;
                        closed = true;
                        break;
                    }
                }
                if (hit) break;
            }
        }
        return { points, closed };
    }

    function generateFieldLines() {
        while(fieldLinesGroup.children.length > 0) { fieldLinesGroup.remove(fieldLinesGroup.children[0]); }

        const tubeMat = new THREE.MeshPhongMaterial({ color: 0x475569, shininess: 30 });
        const arrowMat = new THREE.MeshPhongMaterial({ color: 0xf97316 });

        const numDirections = parseInt(document.getElementById('linesDirectionSelect').value);
        const density = parseInt(document.getElementById('densitySelect').value);
        let isRepelMode = document.getElementById('modeSelect').value === 'repel';

        const totalLinesIndex = numDirections * density * magnetsData.length;

        let tubeRadius = 0.035;
        if (totalLinesIndex > 60) tubeRadius = 0.025;
        if (totalLinesIndex > 200) tubeRadius = 0.015;

        // 動態箭頭間距與大小縮放
        let arrowSpacing = 20;
        let arrowScale = 1.0;

        if (totalLinesIndex > 32) { arrowSpacing = 35; arrowScale = 0.85; }
        if (totalLinesIndex > 80) { arrowSpacing = 60; arrowScale = 0.7; }
        if (totalLinesIndex > 200) { arrowSpacing = 100; arrowScale = 0.5; }
        if (totalLinesIndex > 400) { arrowSpacing = 160; arrowScale = 0.4; }

        let allCurves = [];

        function drawCurve(pointsArray) {
            if (pointsArray.length < 5) return;
            const curve = new THREE.CatmullRomCurve3(pointsArray);

            const tubeGeo = new THREE.TubeGeometry(curve, 150, tubeRadius, 8, false);
            const tube = new THREE.Mesh(tubeGeo, tubeMat);
            fieldLinesGroup.add(tube);

            allCurves.push(curve);
        }

        magnetsData.forEach(m => {
            for (let i = 0; i < numDirections; i++) {
                let angle = (i / numDirections) * Math.PI * 2;
                let up = new THREE.Vector3(0, 1, 0);
                let right = new THREE.Vector3(0, 0, 1);
                let radialDir = up.clone().multiplyScalar(Math.cos(angle)).add(right.clone().multiplyScalar(Math.sin(angle)));

                let maxDistAlongSide = (MAG_LEN / 2) * 0.85;
                let endFaceDist = MAG_WID / 2;
                let totalPath = endFaceDist + maxDistAlongSide;

                for (let j = 0; j < density; j++) {
                    let frac = j / (density - 1);
                    let s = Math.pow(frac, 0.9) * totalPath;

                    if (isRepelMode && s < 0.2) continue;

                    let x_offset, radial_offset;

                    if (s <= endFaceDist) {
                        x_offset = MAG_LEN / 2 + 0.05;
                        radial_offset = s;
                    } else {
                        x_offset = (MAG_LEN / 2) - (s - endFaceDist);
                        radial_offset = (MAG_WID / 2) + 0.05;
                    }

                    let startN = m.posCenter.clone()
                        .add(m.nDir.clone().multiplyScalar(x_offset))
                        .add(radialDir.clone().multiplyScalar(radial_offset));
                    let resN = traceLine(startN, 1);
                    drawCurve(resN.points);

                    let startS = m.posCenter.clone()
                        .add(m.nDir.clone().multiplyScalar(-x_offset))
                        .add(radialDir.clone().multiplyScalar(radial_offset));
                    let resS = traceLine(startS, -1);

                    if (!resS.closed) {
                        resS.points.reverse();
                        drawCurve(resS.points);
                    }
                }
            }
        });

        // 限制箭頭總數 (最大 32 個)
        let potentialArrows = [];

        for(let curve of allCurves) {
            let arcLength = curve.getLength();
            let numArrows = Math.floor(arcLength / 25);
            if (numArrows < 1 && arcLength > 5) numArrows = 1;

            for (let j = 1; j <= numArrows; j++) {
                potentialArrows.push({ curve: curve, fraction: j / (numArrows + 1) });
            }
        }

        const MAX_ARROWS = 32;
        if (potentialArrows.length > MAX_ARROWS) {
            let step = potentialArrows.length / MAX_ARROWS;
            for (let i = 0; i < MAX_ARROWS; i++) {
                let targetIndex = Math.floor(i * step);
                let p = potentialArrows[targetIndex];
                addArrowToCurve(p.curve, p.fraction, arrowMat, arrowScale);
            }
        } else {
            for (let p of potentialArrows) {
                addArrowToCurve(p.curve, p.fraction, arrowMat, arrowScale);
            }
        }
    }

    function addArrowToCurve(curve, fraction, material, scale) {
        const point = curve.getPointAt(fraction);
        const tangent = curve.getTangentAt(fraction);

        const radius = 0.35 * scale;
        const height = 1.2 * scale;
        const arrowGeo = new THREE.ConeGeometry(radius, height, 12);
        arrowGeo.translate(0, -height / 2, 0);

        const arrow = new THREE.Mesh(arrowGeo, material);
        arrow.position.copy(point);
        const axis = new THREE.Vector3(0, 1, 0);
        arrow.quaternion.setFromUnitVectors(axis, tangent);
        fieldLinesGroup.add(arrow);
    }

    function createCompass() {
        compass = new THREE.Group();

        const coneN = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.8, 16), new THREE.MeshPhongMaterial({ color: 0xef4444 }));
        coneN.rotation.z = -Math.PI / 2;
        coneN.position.x = 0.9;

        const coneS = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.8, 16), new THREE.MeshPhongMaterial({ color: 0xffffff }));
        coneS.rotation.z = Math.PI / 2;
        coneS.position.x = -0.9;

        const base = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 0.1, 32), new THREE.MeshPhongMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.7 }));
        base.rotation.x = Math.PI / 2;

        const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.3, 16), new THREE.MeshPhongMaterial({ color: 0x475569 }));
        pin.rotation.x = Math.PI / 2;

        compass.add(coneN);
        compass.add(coneS);
        compass.add(base);
        compass.add(pin);

        compass.position.set(0, 8, 0);
        compass.visible = false;
        scene.add(compass);
    }

    /* 依指南針狀態更新按鈕文字（語言切換時亦由 onChange 呼叫） */
    function updateCompassBtn() {
        const btn = document.getElementById('compassBtn');
        btn.innerText = PhysLab.i18n.t(isCompassActive ? 'panel.main.compassClose' : 'panel.main.compassOpen');
    }

    function toggleCompass() {
        isCompassActive = !isCompassActive;
        compass.visible = isCompassActive;
        const btn = document.getElementById('compassBtn');

        if (isCompassActive) {
            compass.position.set(0, 8, 0);
            btn.style.backgroundColor = "#dc2626";

            if(document.getElementById('linesDirectionSelect').value !== "2") {
                document.getElementById('linesDirectionSelect').value = "2";
                generateFieldLines();
            }

            sim.setView('default');

        } else {
            isDragging = false;
            orbitControls.enabled = true;
            btn.style.backgroundColor = "#2563eb";
        }
        updateCompassBtn();
    }

    /* 每幀回呼：controls.update 與 renderer.render 由 sim.start 處理 */
    function tick() {
        if (isCompassActive && compass && magnetsData.length > 0) {
            compass.position.z = 0;

            const B = getMagneticField(compass.position);
            const bMag = B.lengthSq();

            if (bMag > 1e-4) {
                const targetQuaternion = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1, 0, 0), B.normalize());
                compass.quaternion.slerp(targetQuaternion, 0.25);
            }
        }
    }

    /* 語言切換：重建場景（中和點貼圖文字）＋ 更新指南針按鈕文字；
       靜態 data-i18n 文字由 i18n.applyTo 自動處理 */
    PhysLab.i18n.onChange(function () {
        if (!sim) return;
        buildScene(document.getElementById('modeSelect').value);
        updateCompassBtn();
    });

    PhysLab.sim3d.ready(init);
</script>
</body>
