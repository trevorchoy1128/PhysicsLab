<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDSE 物理 - 多層折射與海市蜃樓模擬器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans HK', sans-serif; background-color: #f1f5f9; }
        canvas { touch-action: none; }
        .layer-row { transition: all 0.15s ease-in-out; }
        .layer-row:hover { background-color: #f0fdf4; border-color: #bbf7d0; }
        input[type=range] { accent-color: #0ea5e9; }
        
        /* 介質列表專用美化滾動軸 */
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .grab-cursor { cursor: grab; }
        .grabbing-cursor { cursor: grabbing !important; }
        .btn-animate { transition: all 0.2s; }
        .btn-animate:hover { transform: translateY(-1px); }
        .btn-animate:active { transform: translateY(1px); }
    </style>
</head>
<body class="min-h-screen p-3 md:p-6 flex items-center justify-center">
    <div class="max-w-[1450px] w-full mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col lg:flex-row border border-slate-200">
        
        <div class="w-full lg:w-3/5 p-4 md:p-6 flex flex-col items-center justify-center bg-slate-50 relative border-b lg:border-b-0 lg:border-r border-slate-200">
            <div class="w-full relative">
                <div class="absolute top-4 right-4 z-10 bg-slate-800/75 text-white text-xs px-3 py-1.5 rounded-full backdrop-blur-sm pointer-events-none flex items-center shadow-sm">
                    <svg class="w-4 h-4 mr-1.5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                    拖動畫面可平移，滾輪可放大縮小
                </div>
                <canvas id="simCanvas" width="800" height="680" class="w-full h-auto bg-white rounded-xl shadow-inner border border-slate-300 grab-cursor"></canvas>
            </div>
        </div>

        <div class="w-full lg:w-2/5 bg-white p-5 md:p-6 flex flex-col h-[740px]">
            <div class="flex justify-between items-start mb-4 border-b border-slate-100 pb-3">
                <div>
                    <h1 class="text-xl font-black text-slate-800 tracking-tight">多層折射模擬器</h1>
                    <p class="text-xs font-bold text-sky-600 tracking-wider">HKDSE PHYSICS • MIRAGE & TIR</p>
                </div>
                <button id="resetViewBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-1 rounded-md text-xs font-bold transition border border-slate-200 shadow-sm">
                    置中視角
                </button>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="loadMiragePreset()" class="btn-animate bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-bold py-2.5 px-3 rounded-xl shadow-md flex items-center justify-center text-sm">
                    <span class="mr-1.5 text-base">🏜️</span> 海市蜃樓成因
                </button>
                <button onclick="loadDefaultPreset()" class="btn-animate bg-gradient-to-r from-slate-600 to-slate-700 hover:from-slate-700 hover:to-slate-800 text-white font-bold py-2.5 px-3 rounded-xl shadow-md flex items-center justify-center text-sm">
                    <span class="mr-1.5 text-base">↩️</span> 還原基礎三層
                </button>
            </div>

            <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 shadow-sm space-y-3 mb-4 text-xs">
                <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                    <div class="flex space-x-4">
                        <label class="flex items-center space-x-1.5 font-bold text-slate-600 cursor-pointer hover:text-sky-600">
                            <input type="checkbox" id="showNormals" checked class="rounded text-sky-500 focus:ring-sky-500 w-3.5 h-3.5 cursor-pointer">
                            <span>顯示法線</span>
                        </label>
                        <label class="flex items-center space-x-1.5 font-bold text-slate-600 cursor-pointer hover:text-sky-600">
                            <input type="checkbox" id="showAngles" checked class="rounded text-sky-500 focus:ring-sky-500 w-3.5 h-3.5 cursor-pointer">
                            <span>顯示角度</span>
                        </label>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="font-bold text-slate-500">縮放:</span>
                        <input type="range" id="zoomSlider" min="0.2" max="2.5" step="0.1" value="1" class="w-20 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                        <span class="font-black text-sky-600 w-8 text-right" id="zoomValueUI">1.0x</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <div class="flex justify-between items-center mb-1 font-bold text-slate-700">
                            <span>入射位置 (X)</span>
                            <span class="text-sky-600 font-black" id="posXValue">200</span>
                        </div>
                        <input type="range" id="incidentX" min="-100" max="700" step="1" value="200" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1 font-bold text-slate-700">
                            <span>入射角 (θ₁)</span>
                            <span class="text-sky-600 font-black" id="angleValue">45.0°</span>
                        </div>
                        <input type="range" id="incidentAngle" min="0" max="89" step="0.5" value="45" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-center mb-2">
                <h2 class="text-sm font-bold text-slate-800 flex items-center">
                    <svg class="w-4 h-4 mr-1.5 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    介質層設定區 <span class="ml-1.5 text-xs text-slate-400 font-normal">(最多 14 層)</span>
                </h2>
                <button id="addLayerBtn" class="bg-sky-500 hover:bg-sky-600 text-white px-2.5 py-1 rounded-md text-xs font-bold shadow-sm transition flex items-center btn-animate">
                    <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    新增介質
                </button>
            </div>

            <div class="flex-1 border border-slate-200 rounded-xl bg-slate-50/50 p-2 overflow-hidden flex flex-col">
                <div class="flex items-center text-[11px] font-bold text-slate-400 px-2 pb-1.5 border-b border-slate-200/60 mb-1">
                    <div class="w-8">層數</div>
                    <div class="w-24">介質名稱</div>
                    <div class="flex-1 text-center">折射率 (n) 微調滑桿</div>
                    <div class="w-12 text-right">數值</div>
                    <div class="w-6"></div>
                </div>
                <div id="layersContainer" class="custom-scroll overflow-y-auto flex-1 space-y-1.5 pr-1">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // 初始狀態
        let state = {
            incidentAngle: 45,
            incidentX: 200, 
            offsetX: 0, 
            offsetY: 0,
            scale: 1.0,
            showNormals: true,
            showAngles: true,
            layers: [],
            nextId: 1
        };

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const angleSlider = document.getElementById('incidentAngle');
        const angleValue = document.getElementById('angleValue');
        const posSlider = document.getElementById('incidentX');
        const posValue = document.getElementById('posXValue');
        const zoomSlider = document.getElementById('zoomSlider');
        const zoomValueUI = document.getElementById('zoomValueUI');
        const layersContainer = document.getElementById('layersContainer');
        const addLayerBtn = document.getElementById('addLayerBtn');
        const showNormalsCheckbox = document.getElementById('showNormals');
        const showAnglesCheckbox = document.getElementById('showAngles');
        const resetViewBtn = document.getElementById('resetViewBtn');

        let isDragging = false; let dragStartX = 0; let dragStartY = 0;

        function init() {
            angleSlider.addEventListener('input', (e) => { state.incidentAngle = parseFloat(e.target.value); angleValue.textContent = state.incidentAngle.toFixed(1) + '°'; draw(); });
            posSlider.addEventListener('input', (e) => { state.incidentX = parseFloat(e.target.value); posValue.textContent = state.incidentX; draw(); });
            showNormalsCheckbox.addEventListener('change', (e) => { state.showNormals = e.target.checked; draw(); });
            showAnglesCheckbox.addEventListener('change', (e) => { state.showAngles = e.target.checked; draw(); });
            
            zoomSlider.addEventListener('input', (e) => {
                state.scale = parseFloat(e.target.value);
                zoomValueUI.textContent = state.scale.toFixed(1) + 'x';
                draw();
            });

            resetViewBtn.addEventListener('click', () => { 
                state.offsetX = 0; state.offsetY = 0; state.scale = 1.0;
                zoomSlider.value = 1.0; zoomValueUI.textContent = '1.0x';
                draw(); 
            });

            addLayerBtn.addEventListener('click', () => {
                if (state.layers.length >= 14) { alert("已達到最大限制 14 層。"); return; }
                state.layers.push({ id: state.nextId++, n: 1.50, name: "自訂介質" });
                renderLayerControls(); draw();
            });

            // 畫布滑鼠事件
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                let newScale = state.scale - Math.sign(e.deltaY) * 0.1;
                newScale = Math.max(0.2, Math.min(newScale, 2.5));
                state.scale = newScale;
                zoomSlider.value = state.scale; zoomValueUI.textContent = state.scale.toFixed(1) + 'x';
                draw();
            }, {passive: false});

            canvas.addEventListener('mousedown', (e) => { isDragging = true; dragStartX = e.clientX - state.offsetX; dragStartY = e.clientY - state.offsetY; canvas.classList.add('grabbing-cursor'); });
            window.addEventListener('mouseup', () => { isDragging = false; canvas.classList.remove('grabbing-cursor'); });
            window.addEventListener('mousemove', (e) => { if (!isDragging) return; state.offsetX = e.clientX - dragStartX; state.offsetY = e.clientY - dragStartY; draw(); });

            loadDefaultPreset(); // 預設加載基礎三層
        }

        // 1. 還原基礎三層（關閉海市蜃樓）
        window.loadDefaultPreset = function() {
            state.layers = [
                { id: 1, n: 1.00, name: "空氣 (Air)" },
                { id: 2, n: 1.33, name: "水 (Water)" },
                { id: 3, n: 1.50, name: "玻璃 (Glass)" }
            ];
            state.nextId = 4;
            state.incidentAngle = 45;
            state.incidentX = 200;
            state.scale = 1.0;
            state.offsetX = 0;
            state.offsetY = 0;
            
            // 還原顯示標籤
            state.showNormals = true;
            state.showAngles = true;
            showNormalsCheckbox.checked = true;
            showAnglesCheckbox.checked = true;

            // 更新 UI
            angleSlider.value = 45; angleValue.textContent = '45.0°';
            posSlider.value = 200; posValue.textContent = '200';
            zoomSlider.value = 1.0; zoomValueUI.textContent = '1.0x';

            renderLayerControls(); draw();
        };

        // 2. 一鍵展示海市蜃樓
        window.loadMiragePreset = function() {
            state.layers = [];
            let n_start = 1.28;
            for(let i=0; i<14; i++) {
                let n_val = n_start - (i * 0.02);
                let name = i === 0 ? "冷空氣(頂)" : (i === 13 ? "熱空氣(底)" : `空氣層 ${i+1}`);
                state.layers.push({ id: i+1, n: n_val, name: name });
            }
            state.nextId = 15;
            
            state.incidentAngle = 68; 
            state.incidentX = 40;
            state.scale = 0.55; 
            state.offsetX = -80;
            state.offsetY = -40;
            
            // 教學考量：暫時隱藏法線與角度，凸顯光線平滑曲線
            state.showNormals = false;
            state.showAngles = false;
            showNormalsCheckbox.checked = false;
            showAnglesCheckbox.checked = false;
            
            angleSlider.value = state.incidentAngle; angleValue.textContent = state.incidentAngle.toFixed(1) + '°';
            posSlider.value = state.incidentX; posValue.textContent = state.incidentX;
            zoomSlider.value = state.scale; zoomValueUI.textContent = state.scale.toFixed(1) + 'x';
            
            renderLayerControls(); draw();
        };

        // 核心改動：重製高密度、緊湊型的 UI 控制列
        function renderLayerControls() {
            layersContainer.innerHTML = '';
            state.layers.forEach((layer, index) => {
                const row = document.createElement('div');
                row.className = 'layer-row flex items-center justify-between p-1.5 bg-white rounded-lg border border-slate-200 text-xs shadow-sm space-x-1.5';
                row.innerHTML = `
                    <div class="w-7 text-center font-black text-slate-400 bg-slate-100 rounded py-0.5">${index + 1}</div>
                    
                    <div class="w-20 font-bold text-slate-700 truncate" id="name_val_${layer.id}">${layer.name}</div>
                    
                    <div class="flex-1 flex items-center">
                        <input type="range" min="1.0" max="2.5" step="0.01" value="${layer.n}" 
                            class="w-full h-1.5 bg-slate-100 rounded-lg appearance-none cursor-pointer"
                            oninput="updateLayerN(${layer.id}, this.value)">
                    </div>
                    
                    <div class="w-12 text-right font-mono font-black text-sky-600 bg-sky-50 px-1.5 py-0.5 rounded border border-sky-100">${layer.n.toFixed(2)}</div>
                    
                    <div class="w-6 flex justify-end">
                        ${state.layers.length > 1 ? `
                            <button class="text-slate-300 hover:text-red-500 transition p-0.5" title="刪除此層" onclick="removeLayer(${layer.id})">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        ` : ''}
                    </div>
                `;
                layersContainer.appendChild(row);
            });
        }

        window.updateLayerN = function(id, value) {
            const layer = state.layers.find(l => l.id === id);
            if (layer) {
                layer.n = parseFloat(value);
                
                // 動態名稱命名（當用戶手動拉動非海市蜃樓層時，進行標準標籤變更）
                if(!layer.name.includes("空氣層") && !layer.name.includes("冷空氣") && !layer.name.includes("熱空氣")) {
                    if(layer.n === 1.00) layer.name = "空氣 (Air)"; 
                    else if(layer.n === 1.33) layer.name = "水 (Water)"; 
                    else if(layer.n === 1.50) layer.name = "玻璃 (Glass)"; 
                    else layer.name = "自訂介質";
                }
                
                renderLayerControls(); // 刷新數值與名稱顯示
                draw();
            }
        };

        window.removeLayer = function(id) { 
            state.layers = state.layers.filter(l => l.id !== id); 
            renderLayerControls(); 
            draw(); 
        };

        // 渲染繪圖邏輯（保持高效及適配多層高厚度）
        function drawText(text, x, y, textColor = '#1e293b') { ctx.font = '600 12px "Noto Sans HK", sans-serif'; ctx.fillStyle = textColor; ctx.fillText(text, x, y); }
        function drawNormal(x, yStart, yEnd, scale) { ctx.save(); ctx.beginPath(); ctx.setLineDash([5 / scale, 5 / scale]); ctx.moveTo(x, yStart); ctx.lineTo(x, yEnd); ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.2 / scale; ctx.stroke(); ctx.restore(); }
        
        function drawArrow(x1, y1, x2, y2, scale) {
            const headlen = 10 / scale; const angle = Math.atan2(y2 - y1, x2 - x1);
            let midX = (x1 + x2) / 2; let midY = (y1 + y2) / 2;
            const dist = Math.hypot(x2 - x1, y2 - y1);
            if (dist > 5000) {
                let targetDist = dist / 2;
                if (y1 <= -10000) targetDist = dist - 150 / scale; 
                else if (y2 >= 10000) targetDist = 150 / scale;    
                else if (y2 <= -10000) targetDist = 150 / scale;   
                midX = x1 + (x2 - x1) * (targetDist / dist); midY = y1 + (y2 - y1) * (targetDist / dist);
            }
            ctx.beginPath(); ctx.moveTo(midX, midY);
            ctx.lineTo(midX - headlen * Math.cos(angle - Math.PI / 7), midY - headlen * Math.sin(angle - Math.PI / 7));
            ctx.moveTo(midX, midY); ctx.lineTo(midX - headlen * Math.cos(angle + Math.PI / 7), midY - headlen * Math.sin(angle + Math.PI / 7));
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2.2 / scale; ctx.stroke();
        }

        function draw() {
            const width = canvas.width; const height = canvas.height;
            const numLayers = state.layers.length; 
            const layerHeight = height / Math.min(numLayers, 7); // 超過 7 層時限制單層最小高度，由 Zoom 和平移查看全貌
            
            ctx.clearRect(0, 0, width, height);
            ctx.save();
            ctx.translate(state.offsetX, state.offsetY);
            ctx.translate(width / 2, height / 2);
            ctx.scale(state.scale, state.scale);
            ctx.translate(-width / 2, -height / 2);

            // 繪製各介質背景
            state.layers.forEach((layer, index) => {
                const y = index * layerHeight;
                let drawY = y; let drawHeight = layerHeight;
                if (index === 0) { drawY = -20000; drawHeight = y + 20000; }
                if (index === numLayers - 1) { drawHeight = 20000; }
                if (numLayers === 1) { drawY = -20000; drawHeight = 40000; }

                let alpha = Math.max(0, Math.min(0.7, (layer.n - 1.0) * 0.3));
                if (numLayers > 7) { alpha = index / numLayers * 0.22 + 0.02; } 
                
                ctx.fillStyle = `rgba(14, 165, 233, ${alpha})`;
                ctx.fillRect(-20000, drawY, 40000, drawHeight);

                if (index > 0) {
                    ctx.beginPath(); ctx.moveTo(-20000, y); ctx.lineTo(20000, y);
                    ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1.5 / state.scale; ctx.stroke();
                }
            });

            // 光線追蹤引擎
            const raySegments = []; const boundaries = []; 
            let currentAngleRad = state.incidentAngle * Math.PI / 180;
            let dirY = 1; let layerIndex = 0;
            let startY = -20000;
            let startX = state.incidentX - (0 - startY) * Math.tan(currentAngleRad);
            raySegments.push({ x1: startX, y1: startY, x2: state.incidentX, y2: 0 });

            let currentX = state.incidentX; let currentY = 0; 

            for (let i = 0; i < 120; i++) { 
                const layer = state.layers[layerIndex];
                let isBottomEscape = (dirY === 1 && layerIndex === numLayers - 1);
                let isTopEscape = (dirY === -1 && layerIndex === 0);

                let nextY;
                if (isBottomEscape) { nextY = 20000; } 
                else if (isTopEscape) { nextY = -20000; } 
                else { nextY = dirY === 1 ? (layerIndex + 1) * layerHeight : layerIndex * layerHeight; }

                const deltaY = Math.abs(nextY - currentY);
                const dx = deltaY * Math.tan(currentAngleRad);
                const nextX = currentX + dx;

                raySegments.push({ x1: currentX, y1: currentY, x2: nextX, y2: nextY });
                if (isBottomEscape || isTopEscape) break;

                const nextLayerIndex = layerIndex + dirY;
                const n1 = layer.n; const n2 = state.layers[nextLayerIndex].n;
                const sinTheta2 = (n1 / n2) * Math.sin(currentAngleRad);

                if (sinTheta2 > 1) { // 全內反射
                    boundaries.push({ x: nextX, y: nextY, angleIn: currentAngleRad, angleOut: currentAngleRad, isTIR: true, dirY: dirY });
                    dirY = -dirY; 
                } else { // 折射
                    const nextAngleRad = Math.asin(sinTheta2);
                    boundaries.push({ x: nextX, y: nextY, angleIn: currentAngleRad, angleOut: nextAngleRad, isTIR: false, dirY: dirY });
                    currentAngleRad = nextAngleRad; layerIndex = nextLayerIndex;
                }
                currentX = nextX; currentY = nextY;
            }

            // 繪製光流
            raySegments.forEach(seg => {
                ctx.beginPath(); ctx.moveTo(seg.x1, seg.y1); ctx.lineTo(seg.x2, seg.y2);
                ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2.5 / state.scale; ctx.stroke();
                drawArrow(seg.x1, seg.y1, seg.x2, seg.y2, state.scale);
            });

            // 繪製交界面物理數據
            boundaries.forEach(b => {
                if (state.showNormals) drawNormal(b.x, b.y - 40, b.y + 40, state.scale);
                if (state.showAngles) {
                    const r = 30; ctx.strokeStyle = '#475569'; ctx.lineWidth = 1.2 / state.scale;
                    if (b.dirY === 1) { 
                        if (b.angleIn > 0.01) { ctx.beginPath(); ctx.arc(b.x, b.y, r, -Math.PI/2, -Math.PI/2 - b.angleIn, true); ctx.stroke(); drawText(`${(b.angleIn * 180 / Math.PI).toFixed(1)}°`, b.x - 12 - Math.sin(b.angleIn / 2) * (r+4), b.y - Math.cos(b.angleIn / 2) * (r+4)); }
                        if (b.isTIR) { ctx.beginPath(); ctx.arc(b.x, b.y, r + 6, -Math.PI/2, -Math.PI/2 + b.angleOut, false); ctx.stroke(); drawText(`${(b.angleOut * 180 / Math.PI).toFixed(1)}°`, b.x + 5 + Math.sin(b.angleOut / 2) * (r+4), b.y - Math.cos(b.angleOut / 2) * (r+4)); drawText('TIR 全內反射', b.x + 18, b.y - 35, '#ea580c'); } 
                        else if (b.angleOut > 0.01) { ctx.beginPath(); ctx.arc(b.x, b.y, r, Math.PI/2, Math.PI/2 - b.angleOut, true); ctx.stroke(); drawText(`${(b.angleOut * 180 / Math.PI).toFixed(1)}°`, b.x + 5 + Math.sin(b.angleOut / 2) * (r+4), b.y + 8 + Math.cos(b.angleOut / 2) * (r+4)); }
                    } else { 
                        if (b.angleIn > 0.01) { ctx.beginPath(); ctx.arc(b.x, b.y, r, Math.PI/2, Math.PI/2 + b.angleIn, false); ctx.stroke(); drawText(`${(b.angleIn * 180 / Math.PI).toFixed(1)}°`, b.x - 12 - Math.sin(b.angleIn / 2) * (r+4), b.y + 8 + Math.cos(b.angleIn / 2) * (r+4)); }
                        if (b.isTIR) { ctx.beginPath(); ctx.arc(b.x, b.y, r + 6, Math.PI/2, Math.PI/2 - b.angleOut, true); ctx.stroke(); drawText(`${(b.angleOut * 180 / Math.PI).toFixed(1)}°`, b.x + 5 + Math.sin(b.angleOut / 2) * (r+4), b.y + 8 + Math.cos(b.angleOut / 2) * (r+4)); drawText('TIR 全內反射', b.x + 18, b.y + 45, '#ea580c'); } 
                        else if (b.angleOut > 0.01) { ctx.beginPath(); ctx.arc(b.x, b.y, r, -Math.PI/2, -Math.PI/2 + b.angleOut, false); ctx.stroke(); drawText(`${(b.angleOut * 180 / Math.PI).toFixed(1)}°`, b.x + 5 + Math.sin(b.angleOut / 2) * (r+4), b.y - Math.cos(b.angleOut / 2) * (r+4)); }
                    }
                }
            });
            ctx.restore(); 

            // 漂浮在畫布左側的折射率數值
            state.layers.forEach((layer, index) => {
                let topWorldY = index === 0 ? -20000 : index * layerHeight;
                let bottomWorldY = index === state.layers.length - 1 ? 20000 : (index + 1) * layerHeight;
                let screenTop = (topWorldY - height / 2) * state.scale + height / 2 + state.offsetY;
                let screenBottom = (bottomWorldY - height / 2) * state.scale + height / 2 + state.offsetY;
                if (screenBottom > 0 && screenTop < height) {
                    let textY = screenTop > 0 ? screenTop + 20 : 20;
                    textY = Math.min(textY, screenBottom - 10);
                    ctx.fillStyle = '#475569'; ctx.font = 'bold 11px font-mono';
                    ctx.fillText(`n=${layer.n.toFixed(2)}`, 10, textY);
                }
            });
        }

        init();
    </script>
</body>
</html>
